AWSTemplateFormatVersion: "2010-09-09"
Description: >
  SUMMARY:

  This CloudFormation template grants Blocks secure, read-only access scoped to cost-optimization analysis across all linked accounts. The role attaches AWS-managed read policies (billing, organizations, account management, Savings Plans, and a base read policy) together with a custom data-protection deny policy that blocks every AWS read action known to return customer sensitive data:
  Creates a read IAM role attached to AWS-managed read policies plus the data-protection deny policy.
  Deploys the same role to all linked accounts via a StackSet to gain organization-wide cost visibility.

Metadata:
  TemplateVersion: "0.1.84" #  x-release-please-version

Mappings:
  TemplateConfig:
    Constants:
      Version: "0.1.84" #  x-release-please-version

Rules:
  EnforceUsEast1:
    Assertions:
      - Assert:
          Fn::Equals:
            - !Ref AWS::Region
            - us-east-1
        AssertDescription: "You must deploy to region us-east-1 only. Organizations APIs are only available in us-east-1."

Resources:
  EnableStackSetsLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "EnableStackSetsLambdaRole-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      Description: "Execution role for the Lambda that deploys read-only cost analysis roles across your organization accounts. Grants permissions for AWS CloudFormation StackSets and AWS Organizations service integration."
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud
        - Key: Purpose
          Value: Onboarding
      Policies:
        - PolicyName: BlocksOnboardingLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: StackSetsOrganizationsAccess
                Effect: Allow
                Action:
                  - cloudformation:ActivateOrganizationsAccess
                  - cloudformation:DescribeOrganizationsAccess
                  - cloudformation:CreateStackSet
                Resource: "*"
              - Sid: StackSetManagement
                Effect: Allow
                Action:
                  - cloudformation:CreateStackInstances
                  - cloudformation:DeleteStackSet
                  - cloudformation:DeleteStackInstances
                  - cloudformation:DescribeStackSet
                  - cloudformation:DescribeStackSetOperation
                  - cloudformation:ListStackInstances
                  - cloudformation:ListStackSetOperationResults
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stackset/Blocks-CostEstimations-{{BLOCKS_CUSTOMER_RESOURCE_ID}}:*"
                  - !Sub "arn:${AWS::Partition}:cloudformation::${AWS::AccountId}:stackset-target/Blocks-CostEstimations-{{BLOCKS_CUSTOMER_RESOURCE_ID}}:*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}::type/resource/AWS-IAM-ManagedPolicy"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}::type/resource/AWS-IAM-Role"
              - Effect: Allow
                Action:
                  - organizations:DescribeOrganization
                  - organizations:EnableAWSServiceAccess
                  - organizations:ListAWSServiceAccessForOrganization
                  - organizations:ListRoots
                  - organizations:DescribeOrganizationalUnit
                Resource: "*"
              - Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:CreateServiceLinkedRole
                Resource: "*"
              # Why this grant exists (non-obvious): the Lambda does NOT download the
              # template itself — there is no s3.get_object / urllib call in its code.
              # It passes the S3 URL as TemplateURL to cfn.create_stack_set(), and the
              # CloudFormation service reads that object on behalf of THIS role's identity.
              # So the s3:GetObject is consumed by CloudFormation-acting-as-the-Lambda,
              # not by the function code. Removing it breaks CreateStackSet.
              # GetObjectVersion is a distinct action, not a superset of GetObject:
              # GetObject alone authorizes only the object's current version, so a
              # TEMPLATE_URL carrying ?versionId= (pinning the template to an
              # immutable version rather than a mutable key) is denied without it.
              # Scope is tight: this role can ONLY read objects from buckets whose
              # name starts with "blocks-customer-templates" (the Blocks-owned dev/
              # staging/production template buckets) and nothing else — no other
              # bucket, no other S3 action. It cannot read any customer S3 data.
              - Sid: ReadStackSetTemplateFromBlocksBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::blocks-customer-templates*/*"

  EnableStackSetsLambda:
    Type: AWS::Lambda::Function
    Properties:
      Description: "Used by Blocks.cloud to deploy read-only cost analysis roles across your organization accounts via the AWS CloudFormation StackSets feature. This function runs only during stack creation, update, or deletion."
      FunctionName: EnableStackSets-{{BLOCKS_CUSTOMER_RESOURCE_ID}}
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt EnableStackSetsLambdaRole.Arn
      Timeout: 900
      Architectures:
        - arm64
      Environment:
        Variables:
          STACKSET_NAME: "Blocks-CostEstimations-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
          TEMPLATE_URL: "{{SUBACCOUNTS_TEMPLATE_URL}}"
          BLOCKS_CUSTOMER_RESOURCE_ID: "{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
          BLOCKS_ACCOUNT_ID: "{{BLOCKS_ACCOUNT_ID}}"
          EXTERNAL_ID: "{{EXTERNAL_ID}}"
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import json
          import time
          import os
          from botocore.exceptions import ClientError

          def enable_stacksets(orgs, cfn):
              """Enable StackSets trusted access with AWS Organizations."""
              try:
                  orgs.enable_aws_service_access(ServicePrincipal='member.org.stacksets.cloudformation.amazonaws.com')
                  print("Enabled AWS Organizations Service Access for CloudFormation StackSets")
                  time.sleep(10)
              except ClientError as e:
                  print(f"Skipped enabling service access: {e}")

              if cfn.describe_organizations_access().get('Status') != 'ENABLED':
                  try:
                      cfn.activate_organizations_access()
                      print("Activated Trusted Access for CloudFormation StackSets")
                  except ClientError as e:
                      print(f"Error activating Trusted Access: {e}")
                      raise

              for i in range(12):
                  status = cfn.describe_organizations_access().get('Status')
                  if status == 'ENABLED': return
                  time.sleep(60)
              raise Exception(f"Failed to verify StackSets activation. Status: {status}")

          def detect_account_type(orgs):
              """Detect if account is management, member, or standalone."""
              try:
                  org = orgs.describe_organization()['Organization']
                  master_account_id = org['MasterAccountId']
                  sts = boto3.client('sts')
                  current_account = sts.get_caller_identity()['Account']

                  if current_account == master_account_id:
                      roots = orgs.list_roots()['Roots']
                      org_root_id = roots[0]['Id'] if roots else None
                      return ('management', org_root_id, master_account_id, None)
                  else:
                      warning = f"WARNING: Member account. Deploy from management account {master_account_id} for org-wide coverage."
                      return ('member', None, master_account_id, warning)
              except ClientError as e:
                  error_code = e.response.get('Error', {}).get('Code', '')
                  if error_code in ['AWSOrganizationsNotInUseException', 'AccessDeniedException']:
                      return ('standalone', None, None, None)
                  raise

          def create_stackset(cfn, org_root_id):
              """Create StackSet via boto3."""
              stackset_name = os.environ['STACKSET_NAME']
              template_url = os.environ['TEMPLATE_URL']

              params = [
                  {'ParameterKey': 'BlocksCustomerId', 'ParameterValue': os.environ['BLOCKS_CUSTOMER_RESOURCE_ID']},
                  {'ParameterKey': 'BlocksAccountId', 'ParameterValue': os.environ['BLOCKS_ACCOUNT_ID']},
                  {'ParameterKey': 'ExternalId', 'ParameterValue': os.environ['EXTERNAL_ID']},
              ]

              print(f"Creating StackSet {stackset_name}...")
              cfn.create_stack_set(
                  StackSetName=stackset_name,
                  Description="Blocks read-only IAM role for organization-wide cost analysis. Must remain in place for Blocks to function correctly.",
                  TemplateURL=template_url,
                  Parameters=params,
                  PermissionModel='SERVICE_MANAGED',
                  AutoDeployment={'Enabled': False},
                  Capabilities=['CAPABILITY_NAMED_IAM'],
                  CallAs='SELF',
              )
              operation = cfn.create_stack_instances(
                  StackSetName=stackset_name,
                  DeploymentTargets={'OrganizationalUnitIds': [org_root_id]},
                  Regions=['us-east-1'],
                  OperationPreferences={
                      # 100% tolerance: attempt EVERY account rather than aborting the
                      # operation on the first failure. Individual accounts fail for
                      # reasons we cannot fix from here (a customer SCP, a suspended
                      # account, an IAM name collision) and partial org coverage is far
                      # more useful than none. Failures are reported below rather than
                      # swallowed — with tolerance 100 the operation itself reports
                      # SUCCEEDED even when instances failed, so the per-instance
                      # results are the ONLY signal that coverage is incomplete.
                      'FailureTolerancePercentage': 100,
                      'MaxConcurrentPercentage': 100,
                      'RegionConcurrencyType': 'PARALLEL',
                      'ConcurrencyMode': 'SOFT_FAILURE_TOLERANCE'
                  },
                  CallAs='SELF',
              )
              # Wait for stack instances deployment to complete
              operation_id = operation['OperationId']
              print(f"Waiting for StackSet operation {operation_id} to complete...")
              status = 'UNKNOWN'
              for _ in range(28):  # Max ~14 min (28 * 30s), within 900s Lambda timeout
                  status = cfn.describe_stack_set_operation(
                      StackSetName=stackset_name,
                      OperationId=operation_id,
                      CallAs='SELF'
                  )['StackSetOperation']['Status']
                  if status in ['SUCCEEDED', 'FAILED', 'STOPPED']:
                      break
                  time.sleep(30)
              # Always enumerate per-instance results, not just on a failed operation.
              # Failure tolerance is 100, so the operation reports SUCCEEDED even when
              # individual accounts failed; skipping this on success would make partial
              # coverage invisible.
              failed = 0
              try:
                  failed = log_failed_instances(cfn, stackset_name, operation_id)
              except Exception as e:
                  print(f"log_failed_instances itself crashed: {e}")
              if status in ['FAILED', 'STOPPED']:
                  # Tolerance 100 means per-account failures no longer land here — this
                  # is a systemic failure of the operation itself, so keep failing hard.
                  raise Exception(f"StackSet operation {operation_id} ended with status: {status}")
              if failed:
                  print(f"StackSet {stackset_name} deployed to org root {org_root_id} with {failed} account(s) FAILED — org coverage is partial")
              else:
                  print(f"StackSet {stackset_name} deployed to org root {org_root_id}")
              return failed

          def log_failed_instances(cfn, stackset_name, operation_id):
              """Print every non-SUCCEEDED stack instance; return how many there were.

              Printing is capped at max_logged to keep the log readable, but counting
              is not — the caller reports the true number of accounts that failed.
              """
              max_logged = 50
              failed = 0
              try:
                  paginator = cfn.get_paginator('list_stack_set_operation_results')
                  pages = paginator.paginate(
                      StackSetName=stackset_name,
                      OperationId=operation_id,
                      CallAs='SELF',
                  )
                  for page in pages:
                      for s in page.get('Summaries', []):
                          if s.get('Status') == 'SUCCEEDED':
                              continue
                          failed += 1
                          if failed <= max_logged:
                              print(json.dumps({
                                  'event': 'failed_stack_instance',
                                  'account': s.get('Account', ''),
                                  'region': s.get('Region', ''),
                                  'status': s.get('Status', ''),
                                  'reason': s.get('StatusReason', ''),
                              }))
                          elif failed == max_logged + 1:
                              print(f"Reached max_logged={max_logged}; further failures counted but not printed.")
              except ClientError as e:
                  print(f"Could not fetch per-instance results: {e}")
              return failed

          def delete_stackset(cfn):
              """Delete StackSet and all instances."""
              stackset_name = os.environ['STACKSET_NAME']
              try:
                  instances = cfn.list_stack_instances(StackSetName=stackset_name, CallAs='SELF')
                  if instances.get('Summaries'):
                      regions = list(set(i['Region'] for i in instances['Summaries']))
                      ou_ids = list(set(i.get('OrganizationalUnitId') for i in instances['Summaries'] if i.get('OrganizationalUnitId')))
                      if ou_ids:
                          operation = cfn.delete_stack_instances(
                              StackSetName=stackset_name,
                              DeploymentTargets={'OrganizationalUnitIds': ou_ids},
                              Regions=regions,
                              RetainStacks=False,
                              OperationPreferences={
                                  # Same reasoning as create, and it matters more here:
                                  # the API default is tolerance 0, so one account that
                                  # cannot be cleaned up would abort deletion for all the
                                  # others and leave the customer's stack stuck in
                                  # DELETE_FAILED with orphaned roles across the org.
                                  'FailureTolerancePercentage': 100,
                                  'MaxConcurrentPercentage': 100,
                                  'RegionConcurrencyType': 'PARALLEL',
                                  'ConcurrencyMode': 'SOFT_FAILURE_TOLERANCE'
                              },
                              CallAs='SELF',
                          )
                          operation_id = operation['OperationId']
                          print(f"Waiting for delete operation {operation_id} to complete...")
                          status = 'UNKNOWN'
                          for _ in range(28):  # Max ~14 min (28 * 30s), within 900s Lambda timeout
                              status = cfn.describe_stack_set_operation(
                                  StackSetName=stackset_name,
                                  OperationId=operation_id,
                                  CallAs='SELF'
                              )['StackSetOperation']['Status']
                              if status in ['SUCCEEDED', 'FAILED', 'STOPPED']:
                                  break
                              time.sleep(30)
                          if status != 'SUCCEEDED':
                              print(f"Warning: delete instances operation ended with status: {status}")
                  cfn.delete_stack_set(StackSetName=stackset_name, CallAs='SELF')
                  print(f"StackSet {stackset_name} deleted")
              except cfn.exceptions.StackSetNotFoundException:
                  print(f"StackSet {stackset_name} not found, nothing to delete")

          def handler(event, context):
              try:
                  response_data = {}
                  orgs = boto3.client("organizations")
                  cfn = boto3.client("cloudformation")

                  if event['RequestType'] in ['Create', 'Update']:
                      time.sleep(10)  # IAM propagation

                      account_type, org_root_id, mgmt_account_id, warning = detect_account_type(orgs)
                      response_data['AccountType'] = account_type
                      response_data['Warning'] = warning or ''
                      response_data['ManagementAccountId'] = mgmt_account_id or ''

                      if account_type == 'management':
                          if orgs.describe_organization()['Organization']['FeatureSet'] != 'ALL':
                              raise Exception("Organization must have 'All Features' enabled.")

                          enable_stacksets(orgs, cfn)
                          failed = create_stackset(cfn, org_root_id)
                          response_data['OrganizationRootId'] = org_root_id
                          response_data['StackSetDeployed'] = 'true'
                          # Non-zero means the StackSet succeeded but org coverage is
                          # partial. 'StackSetDeployed' stays 'true' either way, so this
                          # is the only place the distinction survives.
                          response_data['FailedAccountCount'] = str(failed)
                      else:
                          response_data['OrganizationRootId'] = ''
                          response_data['StackSetDeployed'] = 'false'
                          response_data['FailedAccountCount'] = '0'
                          print(f"Account type: {account_type}. StackSet skipped.")

                  elif event['RequestType'] == 'Delete':
                      try:
                          delete_stackset(cfn)
                      except Exception as e:
                          print(f"StackSet deletion skipped: {e}")
                      response_data['AccountType'] = 'unknown'
                      response_data['OrganizationRootId'] = ''
                      response_data['StackSetDeployed'] = 'false'
                      response_data['ManagementAccountId'] = ''
                      response_data['Warning'] = ''

                  cfnresponse.send(event, context, cfnresponse.SUCCESS, response_data)
              except Exception as e:
                  print(f"Unexpected Error in EnableStackSets: {e}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(e)})

  # Custom Resource: Enable StackSets Trusted Access & manage StackSet deployment
  # Triggers Lambda to enable CloudFormation StackSets trusted access with AWS Organizations
  # and deploy StackSet to management account
  EnableStackSets:
    Type: Custom::EnableStackSets
    Properties:
      ServiceToken: !GetAtt EnableStackSetsLambda.Arn
      ServiceTimeout: 900

  # ==== BEGIN GENERATED IAM POLICIES ====
  # Source: iam-policies/policies/
  # DO NOT EDIT MANUALLY 

  # IAM Policy: Custom Read Permissions for Cost Estimations
  # Custom read permissions for Blocks cost estimations not covered by AWS managed policies
  # Note: Most read permissions come from AWS managed policies attached to the role; the statements below add read actions not covered by those managed policies.
  BlocksEstimationsCustomReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "BlocksEstimationsCustomReadPolicy-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      Description: "Custom read permissions for Blocks cost estimations not covered by AWS managed policies"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # IAM - Policy simulation for access analysis
          # Services: IAM
          - Sid: IamPolicySimulationRead
            Effect: Allow
            Action:
              - iam:SimulatePrincipalPolicy
            Resource: "*"
          # Cost Explorer - Combined commitment analysis for BlocksEstimationsCustomReadPolicy
          # Services: Cost Explorer
          - Sid: CommitmentAnalysisAndRecommendations
            Effect: Allow
            Action:
              - ce:StartCommitmentPurchaseAnalysis
              - ce:ListCommitmentPurchaseAnalyses
              - ce:StartSavingsPlansPurchaseRecommendationGeneration
              - ce:ListSavingsPlansPurchaseRecommendationGeneration
              - ce:GetSavingsPlansPurchaseRecommendation
              - ce:GetSavingsPlansCoverage
              - ce:GetSavingsPlansUtilization
              - ce:GetSavingsPlansUtilizationDetails
            Resource: "*"
          # S3 - Bucket configuration discovery for cost optimization
          # Services: S3
          - Sid: S3BucketDiscovery
            Effect: Allow
            Action:
              - s3:GetBucketLocation
              - s3:GetLifecycleConfiguration
              - s3:GetIntelligentTieringConfiguration
              - s3:GetBucketLogging
            Resource: "*"
          # OpenSearch/Elasticsearch - Domain discovery for cost analysis (es: prefix covers all managed domains)
          # Services: Amazon OpenSearch Service
          - Sid: OpenSearchDomainDiscovery
            Effect: Allow
            Action:
              - es:DescribeDomain
              - es:DescribeDomains
              - es:DescribeDomainConfig
              - es:ListDomainNames
              - es:ListTags
            Resource: "*"
          # Pricing API - Full read access for cost calculations
          # Services: Pricing
          - Sid: PricingRead
            Effect: Allow
            Action:
              - pricing:Get*
              - pricing:DescribeServices
              - pricing:ListPriceLists
            Resource: "*"
          # EKS - Cluster discovery for rightsizing analysis
          # Services: EKS
          - Sid: EKSClusterDiscovery
            Effect: Allow
            Action:
              - eks:ListClusters
              - eks:DescribeCluster
            Resource: "*"
          # ECR - Lifecycle policy discovery for container cost analysis
          # Services: ECR
          - Sid: ECRLifecyclePolicyDiscovery
            Effect: Allow
            Action:
              - ecr:GetLifecyclePolicy
            Resource: "*"
          # ELB - Listener rule discovery for load balancer analysis
          # Services: Elastic Load Balancing
          - Sid: LoadBalancerRulesDiscovery
            Effect: Allow
            Action:
              - elasticloadbalancing:DescribeRules
            Resource: "*"
          # CloudWatch Logs Insights - Container Insights performance log queries only (restricted by data protection policy)
          # Services: CloudWatch Logs
          - Sid: ContainerInsightsAnalysis
            Effect: Allow
            Action:
              - logs:StartQuery
              - logs:GetQueryResults
            Resource: "*"
          # CloudFormation - Stack event and resource discovery for deployment debugging
          # Services: CloudFormation
          - Sid: CloudFormationDeploymentDiscovery
            Effect: Allow
            Action:
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResources
            Resource: "*"
          # Trusted Advisor - Read-only access (Get/List) for cost optimization recommendations
          # Services: Trusted Advisor
          - Sid: TrustedAdvisorReadOnly
            Effect: Allow
            Action:
              - trustedadvisor:Get*
              - trustedadvisor:List*
            Resource: "*"
          # Trusted Advisor - Legacy API read access (requires Business/Enterprise support plan, fails gracefully on Basic/Developer plans)
          # Services: Support
          - Sid: TrustedAdvisorLegacyRead
            Effect: Allow
            Action:
              - support:DescribeTrustedAdvisorChecks
              - support:DescribeTrustedAdvisorCheckResult
              - support:DescribeTrustedAdvisorCheckSummaries
            Resource: "*"
          # Compute Optimizer - Get-only read access for rightsizing and resource optimization recommendations
          # Services: Compute Optimizer
          - Sid: ComputeOptimizerGetRead
            Effect: Allow
            Action:
              - compute-optimizer:Get*
            Resource: "*"
          # Cost Optimization Hub - Read-only access (Get/List) for centralized cost optimization recommendations
          # Services: Cost Optimization Hub
          - Sid: CostOptimizationHubReadOnly
            Effect: Allow
            Action:
              - cost-optimization-hub:Get*
              - cost-optimization-hub:List*
            Resource: "*"
          # Application Auto Scaling - Scalable targets and scaling policy discovery for rightsizing analysis
          # Services: Application Auto Scaling
          - Sid: ApplicationAutoScalingDiscovery
            Effect: Allow
            Action:
              - application-autoscaling:DescribeScalableTargets
              - application-autoscaling:DescribeScalingPolicies
            Resource: "*"
          # AWS Backup - Read backup plan rules (retention, cold-storage transitions), backup selections, and vault access policies for cost optimization analysis.
          # Services: AWS Backup
          - Sid: BackupPlanAndVaultDiscovery
            Effect: Allow
            Action:
              - backup:GetBackupPlan
              - backup:GetBackupSelection
              - backup:GetBackupVaultAccessPolicy
            Resource: "*"

  # ============================================================================
  # IAM Managed Policy: Data Protection Policy (Step 1 - Cost Estimations)
  # Explicit Deny Policy - Explicit IAM Deny Controls for Data Protection
  # ============================================================================
  # IAM evaluation: Explicit Deny > Allow > Implicit Deny (denies always win)
  # Coverage: secrets, communications, documents, databases, search, storage,
  # analytics, logs, identity, code, ML, instance access, and additional
  # sensitive operations.
  # Note: Step 1 has no S3 CUR exception (CUR access lives in Step 2 only).
  # ============================================================================
  BlocksEstimationsDataProtectionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "BlocksEstimationsDataProtectionPolicy-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      Description: "Comprehensive 11-tier data protection policy with 100+ explicit denies across secrets, communications, documents, databases, search data plane, storage, analytics, logs, identity, code, ML, and instance access. Provides explicit IAM deny controls ensuring Blocks cannot access customer sensitive data during cost estimations."
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # TIER 1: Secrets & Credentials
          - Sid: DenySecretsAndCredentials
            Effect: Deny
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:BatchGetSecretValue
              - secretsmanager:ListSecretVersionIds
              - secretsmanager:GetResourcePolicy
              - secretsmanager:DescribeSecret
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParameterHistory
              - ssm:GetParametersByPath
              - acm-pca:GetCertificate
              - acm-pca:GetCertificateAuthorityCertificate
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:ReEncrypt*
              - glue:GetConnection
              - glue:GetConnections
            Resource: "*"
          # TIER 2: Communications (Emails, Messages, SMS)
          - Sid: DenyCommunicationsData
            Effect: Deny
            Action:
              - workmail:*
              - ses:List*
              - ses:Get*
              - ses:Describe*
              - sesv2:List*
              - sesv2:Get*
              - pinpoint:Get*
              - pinpoint:List*
              - pinpoint-email:*
              - pinpoint-sms-voice:*
              - chime:GetMessage*
              - chime:GetConversation*
              - chime:ListMessages
              - connect:GetContactAttributes
              - connect:DescribeContact
              - connect:SearchContacts
              - connect:ListContactReferences
              - connect:ListContactEvaluations
              - connect:DescribeContactEvaluation
              - connect:ListRealtimeContactAnalysisSegments
              - connect:ListRealtimeContactAnalysisSegmentsV2
              - connect:GetFederationToken
              - sns:GetSMSAttributes
              - sns:ListPlatformApplications
              - sns:GetPlatformApplicationAttributes
              - sns:ListEndpointsByPlatformApplication
              - sns:GetEndpointAttributes
              - sns:ListPhoneNumbersOptedOut
              - sns:ListOriginationNumbers
              - sns:ListSMSSandboxPhoneNumbers
              - sns:GetSMSSandboxAccountStatus
              - sns:CheckIfPhoneNumberIsOptedOut
              - sns:ListSubscriptions
              - sns:ListSubscriptionsByTopic
              - sns:GetSubscriptionAttributes
            Resource: "*"
          # TIER 3: Documents & Collaboration
          - Sid: DenyDocumentsAccess
            Effect: Deny
            Action:
              - workdocs:GetDocument
              - workdocs:GetDocumentVersion
              - workspaces:DescribeWorkspacesConnectionStatus
              - workspaces:DescribeWorkspaceSnapshots
            Resource: "*"
          # TIER 4: Database Content
          - Sid: DenyDatabaseContentAccess
            Effect: Deny
            Action:
              - dynamodb:GetItem
              - dynamodb:BatchGetItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:GetRecords
              - dynamodb:GetShardIterator
              - rds:DownloadDBLogFilePortion
              - rds:DownloadCompleteDBLogFile
              - rds-data:ExecuteStatement
              - rds-data:BatchExecuteStatement
              - rds-data:ExecuteSql
              - rds-data:BeginTransaction
              - rds-data:CommitTransaction
              - rds-data:RollbackTransaction
              - redshift-data:ExecuteStatement
              - redshift-data:BatchExecuteStatement
              - redshift-data:GetStatementResult
              - redshift-data:GetStatementResultV2
              - redshift-data:DescribeStatement
              - redshift-data:ListStatements
            Resource: "*"
          # TIER 4: Search data plane - HTTP reads against OpenSearch/Elasticsearch domains return index documents. Not granted by any Blocks statement; inherited from AWS-managed ReadOnlyAccess, so an explicit Deny is the only way to close it. Cost analysis needs the control plane only (see statements/read/opensearch.json).
          # Services: Amazon OpenSearch Service, Amazon OpenSearch Serverless
          - Sid: DenyOpenSearchDataPlane
            Effect: Deny
            Action:
              - es:ESHttpGet
              - es:ESHttpHead
              - es:ESHttpPost
              - aoss:APIAccessAll
            Resource: "*"
          # TIER 5: Storage Content (Complete S3 deny - no CUR exception in Step 1)
          - Sid: DenyS3DataAccess
            Effect: Deny
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:GetObjectTorrent
            Resource: "*"
          # TIER 5: File systems and backups. GetRecoveryPointRestoreMetadata is denied because it returns the metadata required to restore a recovery point, which can reveal the contents and layout of protected data; cost analysis reads backup plan and vault configuration instead.
          - Sid: DenyFileSystemAndBackupAccess
            Effect: Deny
            Action:
              - backup:GetRecoveryPointRestoreMetadata
            Resource: "*"
          # TIER 5: EBS direct APIs read the raw block contents of snapshots - i.e. the volume data itself, including anything on the root filesystem. Snapshot cost analysis reads ec2:DescribeSnapshots metadata (size, age, source volume) and never the blocks. ListSnapshotBlocks/ListChangedBlocks are denied alongside GetSnapshotBlock because they enumerate the block indices and tokens that GetSnapshotBlock consumes.
          # Services: EBS direct APIs
          - Sid: DenyEBSDirectSnapshotDataAccess
            Effect: Deny
            Action:
              - ebs:GetSnapshotBlock
              - ebs:ListSnapshotBlocks
              - ebs:ListChangedBlocks
            Resource: "*"
          # TIER 6: Analytics Query Results
          - Sid: DenyAnalyticsQueryResults
            Effect: Deny
            Action:
              - athena:GetQueryResults
              - athena:GetQueryResultsStream
              - glue:GetTable
              - glue:GetPartition
              - glue:GetPartitions
            Resource: "*"
          # TIER 7: Logs (with Container Insights exception)
          - Sid: DenyLogsQueryExceptContainerInsights
            Effect: Deny
            Action:
              - logs:StartQuery
              - logs:GetQueryResults
            Resource: "*"
            Condition:
              StringNotLike:
                "logs:LogGroupName": "/aws/containerinsights/*/performance"
          # Deny direct log access
          - Sid: DenyLogEventsAccess
            Effect: Deny
            Action:
              - logs:GetLogEvents
              - logs:FilterLogEvents
              - logs:GetLogRecord
              - logs:StartLiveTail
            Resource: "*"
          # TIER 8: User Directories & Identity
          - Sid: DenyUserDirectoryAccess
            Effect: Deny
            Action:
              - cognito-identity:*
              - cognito-idp:*
              - cognito-sync:*
              - ds:DescribeUsers
              - iam:GetSSHPublicKey
              - iam:GetServiceSpecificCredential
              - iam:GetLoginProfile
            Resource: "*"
          # TIER 9: Code & Artifacts - blocks retrieval of source code, container image layers, package assets, and Lambda function definitions. The Lambda actions cover both direct reads and listing, since ListFunctions and ListVersionsByFunction also return FunctionConfiguration with Environment.Variables. ecs:DescribeTaskDefinition is deliberately NOT denied: the ECS Fargate rightsizing detector reads the task-level cpu/memory from it. Denying it silently drops every ECS Fargate finding, so customers who keep plaintext secrets in containerDefinitions[].environment re-add it in their own deny layer instead.
          - Sid: DenyCodeAccess
            Effect: Deny
            Action:
              - codecommit:GetFile
              - codecommit:GetFolder
              - codecommit:GetBlob
              - codecommit:GitPull
              - codeartifact:GetPackageVersionAsset
              - codeartifact:ReadFromRepository
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
              - lambda:GetFunction
              - lambda:GetFunctionConfiguration
              - lambda:ListFunctions
              - lambda:ListVersionsByFunction
            Resource: "*"
          # TIER 10: Machine Learning Data
          - Sid: DenyMachineLearningData
            Effect: Deny
            Action:
              - sagemaker:DescribeModelPackage
              - sagemaker:DescribeTrainingJob
              - rekognition:DetectFaces
              - rekognition:SearchFaces*
              - comprehend:DetectPiiEntities
            Resource: "*"
          # TIER 11: Instance Access. DescribeInstanceAttribute (Attribute=userData) and GetLaunchTemplateData both return user-data, a common location for bootstrap secrets/credentials; cost/rightsizing reads the equivalent configuration via DescribeInstances and DescribeLaunchTemplateVersions instead. Console output, console screenshots and password data expose live instance state and Windows administrator credentials, none of which cost analysis needs.
          - Sid: DenyInstanceAccess
            Effect: Deny
            Action:
              - ec2:DescribeInstanceAttribute
              - ec2:GetConsoleOutput
              - ec2:GetConsoleScreenshot
              - ec2:GetPasswordData
              - ec2:GetLaunchTemplateData
            Resource: "*"
          # Additional sensitive operations
          - Sid: DenyOtherSensitiveOperations
            Effect: Deny
            Action:
              - sqs:ReceiveMessage
              - kinesis:GetRecords
              - apigateway:GET
              - states:GetExecutionHistory
              - states:DescribeExecution
            Resource: "*"

  # ==== END GENERATED IAM POLICIES ====

  # IAM Role: Blocks Estimations Execution Role (Management Account)
  # Cross-account role assumed by Blocks to execute cost optimization estimations
  # Combines write policy with read-only policies
  BlocksEstimationsReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "BlocksEstimationsReadRole-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      Description: "Used by Blocks.cloud to analyze cost savings. Must remain in place for Blocks to function correctly. Email support@blocks.cloud for assistance."
      MaxSessionDuration: 3600
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud
        - Key: Purpose
          Value: CostAnalysis
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::{{BLOCKS_ACCOUNT_ID}}:role/BlocksCustomerAccessRole"
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                "sts:ExternalId": "{{EXTERNAL_ID}}"
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::{{BLOCKS_ACCOUNT_ID}}:role/BlocksCustomerAccessRole"
            Action:
              - sts:TagSession

      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSBillingReadOnlyAccess
        - !Ref BlocksEstimationsDataProtectionPolicy
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSOrganizationsReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSAccountManagementReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSSavingsPlansReadOnlyAccess
        - !Ref BlocksEstimationsCustomReadPolicy

  BlocksEstimationsNotifierRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "BlocksEstimationsNotifierRole-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      Description: "Used by Blocks.cloud to notify about deployment events. Must remain in place for Blocks to function correctly. Email support@blocks.cloud for assistance."
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud
        - Key: Purpose
          Value: EventNotification
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendToBlocksSQS
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: "arn:aws:sqs:us-east-1:{{BLOCKS_ACCOUNT_ID}}:Blocks-Onboarding-Queue"

  # EventBridge Rule: Stack Completion Notification
  # Sends CloudFormation status events to Blocks SQS queue
  CloudFormationCompleteRule:
    Type: AWS::Events::Rule
    Properties:
      Name: "NotifyBlocksStep1Complete-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      Description: "Notifies Blocks when CloudFormation stack deployment completes"
      EventPattern:
        source:
          - "aws.cloudformation"
        detail-type:
          - "CloudFormation Stack Status Change"
        detail:
          stack-id:
            - prefix: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/"
      Targets:
        - Arn: "arn:aws:sqs:us-east-1:{{BLOCKS_ACCOUNT_ID}}:Blocks-Onboarding-Queue"
          Id: "BlocksSQSQueue"
          RoleArn: !GetAtt BlocksEstimationsNotifierRole.Arn
          InputTransformer:
            InputPathsMap:
              account: "$.account"
              region: "$.region"
              time: "$.time"
              stackId: "$.detail.stack-id"
              statusDetails: "$.detail.status-details"
            InputTemplate: !Sub
              - |
                {
                  "source": "aws.cloudformation",
                  "account": <account>,
                  "region": <region>,
                  "time": <time>,
                  "stackId": <stackId>,
                  "statusDetails": <statusDetails>,
                  "templateVersion": "${TemplateVersion}",
                  "customerResourceId": "{{BLOCKS_CUSTOMER_RESOURCE_ID}}",
                  "readRoleArn": "${BlocksEstimationsReadRole.Arn}",
                  "externalId": "{{EXTERNAL_ID}}",
                  "step": "1",
                  "accountType": "${EnableStackSets.AccountType}",
                  "stackSetDeployed": "${EnableStackSets.StackSetDeployed}",
                  "failedAccountCount": "${EnableStackSets.FailedAccountCount}",
                  "organizationRootId": "${EnableStackSets.OrganizationRootId}",
                  "managementAccountId": "${EnableStackSets.ManagementAccountId}"
                }
              - TemplateVersion: !FindInMap [TemplateConfig, Constants, Version]

Outputs:
  BlocksEstimationsReadRoleArn:
    Description: "Read-only cross-account role ARN. Return this role ARN to Blocks to complete the setup"
    Value: !GetAtt BlocksEstimationsReadRole.Arn
  BlocksEstimationsReadRoleName:
    Description: "Cross-account role Name with read-only access to billing services, and 20+ AWS services for complete cost visibility and optimization"
    Value: !Ref BlocksEstimationsReadRole
  AccountType:
    Description: "Type of AWS account: management, member, or standalone"
    Value: !GetAtt EnableStackSets.AccountType
  StackSetDeployed:
    Description: "Whether organization-wide StackSet was deployed (true only for management accounts)"
    Value: !GetAtt EnableStackSets.StackSetDeployed
  ManagementAccountId:
    Description: "Management account ID of the organization (empty for standalone accounts)"
    Value: !GetAtt EnableStackSets.ManagementAccountId
  DeploymentWarning:
    Description: "Warning message if deployment is limited (empty if no warning)"
    Value: !GetAtt EnableStackSets.Warning
