AWSTemplateFormatVersion: "2010-09-09"
Description: >
  This template creates a cross-account read-only role for Blocks to analyze cost savings
  within a sub-account. It provides read access to billing, cost management, resource configuration,
  and optimization services across compute, storage, database, and monitoring services.

Metadata:
  TemplateVersion: "0.1.17"
  LastUpdated: "2026-01-08"

Parameters:
  BlocksCustomerId:
    Type: String
    Description: "Unique customer identifier provided by Blocks"
    AllowedPattern: "^[a-zA-Z0-9-_]+$"
    ConstraintDescription: "Must contain only alphanumeric characters, hyphens, and underscores"

  BlocksAccountId:
    Type: String
    Description: "Blocks AWS account ID for cross-account access"
    AllowedPattern: "^[0-9]{12}$"
    ConstraintDescription: "Must be a valid 12-digit AWS account ID"

  ExternalId:
    Type: String
    Description: "External ID for secure cross-account role assumption"
    NoEcho: true

Resources:
  # IAM Policy: Data Protection Deny Policy
  # Explicit deny overlay to block access to sensitive data while using broad managed read policies
  # ============================================================================
  # COMPREHENSIVE 11-TIER DATA PROTECTION POLICY (Step 1 - Cost Estimations)
  # ============================================================================
  # Provides cryptographic assurance that Blocks cannot access customer sensitive data
  # IAM evaluation: Explicit Deny > Allow > Implicit Deny (denies always win)
  # Coverage: 100+ actions across 11 tiers protecting secrets, communications,
  # documents, databases, storage, analytics, logs, identity, code, ML, and instance access
  # Note: Step 1 has no exceptions (no CUR access needed)
  # ============================================================================
  BlocksDataProtectionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "BlocksEstimationsDataProtectionPolicy-${BlocksCustomerId}"
      Description: "Comprehensive 11-tier data protection policy with 100+ explicit denies across secrets, communications, documents, databases, storage, analytics, logs, identity, code, ML, and instance access. Provides cryptographic assurance that Blocks cannot access customer sensitive data during cost estimations."
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # TIER 1: Secrets & Credentials
          - Sid: DenySecretsAndCredentials
            Effect: Deny
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:GetResourcePolicy
              - secretsmanager:DescribeSecret
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParameterHistory
              - ssm:GetParametersByPath
              - acm-pca:GetCertificate
              - acm-pca:GetCertificateAuthorityCertificate
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:ReEncrypt*
            Resource: "*"

          # TIER 2: Communications (Emails, Messages, SMS)
          - Sid: DenyCommunicationsData
            Effect: Deny
            Action:
              - workmail:*
              - ses:GetMessage
              - ses:GetEmailIdentity
              - ses:GetEmailTemplate
              - chime:GetMessage*
              - chime:GetConversation*
              - chime:ListMessages
              - connect:GetContactAttributes
              - connect:GetContactRecording
              - pinpoint:GetEmailTemplate
              - pinpoint:GetSmsTemplate
              - sns:GetSMSAttributes
            Resource: "*"

          # TIER 3: Documents & Collaboration
          - Sid: DenyDocumentsAccess
            Effect: Deny
            Action:
              - workdocs:GetDocument
              - workdocs:GetDocumentVersion
              - workdocs:DownloadDocumentVersion
              - workspaces:DescribeWorkspacesConnectionStatus
              - workspaces:DescribeWorkspaceSnapshots
            Resource: "*"

          # TIER 4: Database Content
          - Sid: DenyDatabaseContentAccess
            Effect: Deny
            Action:
              - dynamodb:GetItem
              - dynamodb:BatchGetItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:GetRecords
              - dynamodb:GetShardIterator
              - rds-data:ExecuteStatement
              - rds-data:BatchExecuteStatement
              - rds:DownloadDBLogFilePortion
              - rds:DownloadCompleteDBLogFile
              - neptune-db:*
              - timestream:Select
              - timestream:SelectValues
              - qldb:SendCommand
              - qldb:ExecuteStatement
              - redshift:GetClusterCredentials
              - redshift:ExecuteQuery
              - redshift-data:ExecuteStatement
              - redshift-data:GetStatementResult
            Resource: "*"

          # TIER 5: Storage Content (Complete S3 deny - no CUR exception in Step 1)
          - Sid: DenyS3DataAccess
            Effect: Deny
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:GetObjectTorrent
            Resource: "*"

          # Deny all S3 write/delete operations
          - Sid: DenyS3WriteDelete
            Effect: Deny
            Action:
              - s3:PutObject
              - s3:DeleteObject
            Resource: "*"

          # TIER 5: File systems and backups
          - Sid: DenyFileSystemAndBackupAccess
            Effect: Deny
            Action:
              - elasticfilesystem:ClientMount
              - elasticfilesystem:ClientWrite
              - elasticfilesystem:ClientRootAccess
              - fsx:*
              - backup:GetRecoveryPointRestoreMetadata
              - backup:StartRestoreJob
            Resource: "*"

          # TIER 6: Analytics Query Results
          - Sid: DenyAnalyticsQueryResults
            Effect: Deny
            Action:
              - athena:GetQueryResults
              - athena:GetQueryResultsStream
              - quicksight:GetDashboard
              - quicksight:GetDataSet
              - glue:GetTable
              - glue:GetPartition
              - glue:GetPartitions
            Resource: "*"

          # TIER 7: Logs (with Container Insights exception)
          # Deny CloudWatch Logs queries EXCEPT Container Insights performance logs
          - Sid: DenyLogsQueryExceptContainerInsights
            Effect: Deny
            Action:
              - logs:StartQuery
              - logs:GetQueryResults
            Resource: "*"
            Condition:
              StringNotLike:
                "logs:LogGroupName": "/aws/containerinsights/*/performance"

          # Deny direct log access
          - Sid: DenyLogEventsAccess
            Effect: Deny
            Action:
              - logs:GetLogEvents
              - logs:FilterLogEvents
              - logs:GetLogRecord
              - cloudtrail:LookupEvents
              - cloudtrail:GetQueryResults
            Resource: "*"

          # TIER 8: User Directories & Identity
          - Sid: DenyUserDirectoryAccess
            Effect: Deny
            Action:
              - cognito-identity:*
              - cognito-idp:*
              - cognito-sync:*
              - ds:DescribeUsers
              - iam:GetSSHPublicKey
              - iam:GetServiceSpecificCredential
              - iam:GetLoginProfile
            Resource: "*"

          # TIER 9: Code & Artifacts
          - Sid: DenyCodeAccess
            Effect: Deny
            Action:
              - codecommit:GetFile
              - codecommit:GetFolder
              - codecommit:GetBlob
              - codecommit:GitPull
              - codeartifact:GetPackageVersionAsset
              - codeartifact:ReadFromRepository
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Resource: "*"

          # TIER 10: Machine Learning Data
          - Sid: DenyMachineLearningData
            Effect: Deny
            Action:
              - sagemaker:DescribeModelPackage
              - sagemaker:DescribeTrainingJob
              - rekognition:DetectFaces
              - rekognition:SearchFaces*
              - comprehend:DetectPiiEntities
            Resource: "*"

          # TIER 11: Instance Access
          - Sid: DenyInstanceAccess
            Effect: Deny
            Action:
              - ec2:GetConsoleOutput
              - ec2:GetConsoleScreenshot
              - ec2:GetPasswordData
              - ssm:StartSession
            Resource: "*"

          # Additional sensitive operations
          - Sid: DenyOtherSensitiveOperations
            Effect: Deny
            Action:
              - lambda:InvokeFunction
              - sqs:ReceiveMessage
              - kinesis:GetRecords
            Resource: "*"

  # IAM Policy: Custom Read Permissions
  # Permissions not covered by AWS managed policies, serving as an extensible bucket for future custom read permissions
  BlocksEstimationsCustomReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "BlocksEstimationsCustomReadPolicy-${BlocksCustomerId}"
      Description: "Custom read permissions for Blocks cost estimations not covered by AWS managed policies"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: IAMSimulatePrincipalPolicy
            Effect: Allow
            Action:
              - iam:SimulatePrincipalPolicy
            Resource: "*"
          - Sid: CommitmentAnalysisAndRecommendations
            Effect: Allow
            Action:
              - ce:StartCommitmentPurchaseAnalysis
              - ce:StartSavingsPlansPurchaseRecommendationGeneration
              - ce:ListSavingsPlansPurchaseRecommendationGeneration
              - ce:GetSavingsPlansPurchaseRecommendation
              - ce:GetSavingsPlansCoverage
              - ce:GetSavingsPlansUtilization
              - ce:GetSavingsPlansUtilizationDetails
            Resource: "*"
          - Sid: S3BucketDiscovery
            Effect: Allow
            Action:
              - s3:GetBucketLocation
              - s3:GetLifecycleConfiguration
              - s3:GetIntelligentTieringConfiguration
            Resource: "*"
          - Sid: PricingRead
            Effect: Allow
            Action:
              - pricing:GetProducts
              - pricing:DescribeServices
              - pricing:GetAttributeValues
            Resource: "*"
          - Sid: EKSClusterDiscovery
            Effect: Allow
            Action:
              - eks:ListClusters
              - eks:DescribeCluster
            Resource: "*"
          - Sid: ContainerInsightsAnalysis
            Effect: Allow
            Action:
              - logs:StartQuery
              - logs:GetQueryResults
            Resource: "*"

  BlocksEstimationsReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "BlocksEstimationsReadRole-${BlocksCustomerId}"
      Description: "Used by Blocks.cloud to analyze cost savings. Must remain in place for Blocks to function correctly. Email support@blocks.cloud for assistance."
      MaxSessionDuration: 3600
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud
        - Key: Purpose
          Value: CostAnalysis
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${BlocksAccountId}:role/BlocksCustomerAccessRole"
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${BlocksAccountId}:role/BlocksCustomerAccessRole"
            Action:
              - sts:TagSession

      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/job-function/ViewOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSBillingReadOnlyAccess
        - !Ref BlocksDataProtectionPolicy
        - !Sub arn:${AWS::Partition}:iam::aws:policy/ComputeOptimizerReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSSavingsPlansReadOnlyAccess
        - !Ref BlocksEstimationsCustomReadPolicy

Outputs:
  BlocksEstimationsReadRoleArn:
    Description: "Cross-account role for cost and resource optimization analysis within a sub-account"
    Value: !GetAtt BlocksEstimationsReadRole.Arn
  BlocksEstimationsReadRoleName:
    Description: "Name of the cross-account Blocks read role"
    Value: !Ref BlocksEstimationsReadRole
