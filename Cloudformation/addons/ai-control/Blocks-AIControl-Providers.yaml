AWSTemplateFormatVersion: "2010-09-09"
Description: "Blocks AI Control provider Lambdas and key intake API in the control account. Deployed and removed by the Blocks AI Control stack in your management account. Email support@blocks.cloud for assistance."
Parameters:
  EnabledProviders:
    Type: CommaDelimitedList
    Default: anthropic
    Description: "Providers whose Lambda is deployed (anthropic, openai)."
  IntakeIssuer:
    Type: String
    MaxLength: 120
    AllowedPattern: "^(https://[A-Za-z0-9.-]+(/[A-Za-z0-9._/-]*)?)?$"
    Description: "Issuer of the Blocks tokens the key intake API accepts. Empty: no provider resources are created."
  IntakeAllowedOrigin:
    Type: String
    AllowedPattern: "^((https://[A-Za-z0-9.-]+|http://localhost)(:[0-9]{1,5})?)?$"
    Description: "The one browser origin that may call the key intake API. An http://localhost origin is for development stacks only; customer stacks use https."
  CustomerId:
    Type: String
    NoEcho: true
    MaxLength: 40
    AllowedPattern: "^[A-Za-z0-9_-]{1,64}$"
    Description: "The Blocks customer UUID (lowercase hex with dashes). The key intake accepts only tokens issued for this customer."
  TemplateVersion:
    Type: String
    MaxLength: 16
Conditions:
  # anthropic (or openai) is in EnabledProviders (up to 4); an issuer and an origin are set.
  AnthropicEnabled: !And
    - !Or
      - !Equals [!Select [0, !Split [",", !Join [",", [!Join [",", !Ref EnabledProviders], "", "", ""]]]], anthropic]
      - !Equals [!Select [1, !Split [",", !Join [",", [!Join [",", !Ref EnabledProviders], "", "", ""]]]], anthropic]
      - !Equals [!Select [2, !Split [",", !Join [",", [!Join [",", !Ref EnabledProviders], "", "", ""]]]], anthropic]
      - !Equals [!Select [3, !Split [",", !Join [",", [!Join [",", !Ref EnabledProviders], "", "", ""]]]], anthropic]
    - !Not [!Equals [!Ref IntakeIssuer, ""]]
    - !Not [!Equals [!Ref IntakeAllowedOrigin, ""]]
  OpenAIEnabled: !And
    - !Or
      - !Equals [!Select [0, !Split [",", !Join [",", [!Join [",", !Ref EnabledProviders], "", "", ""]]]], openai]
      - !Equals [!Select [1, !Split [",", !Join [",", [!Join [",", !Ref EnabledProviders], "", "", ""]]]], openai]
      - !Equals [!Select [2, !Split [",", !Join [",", [!Join [",", !Ref EnabledProviders], "", "", ""]]]], openai]
      - !Equals [!Select [3, !Split [",", !Join [",", [!Join [",", !Ref EnabledProviders], "", "", ""]]]], openai]
    - !Not [!Equals [!Ref IntakeIssuer, ""]]
    - !Not [!Equals [!Ref IntakeAllowedOrigin, ""]]
  # The key store and the intake API are shared by the providers.
  AnyProviderEnabled: !Or [!Condition AnthropicEnabled, !Condition OpenAIEnabled]
Resources:
  # Keeps the stack valid when no provider is enabled.
  ProviderPlaceholder:
    Type: AWS::CloudFormation::WaitConditionHandle
  ProviderKeysKey:
    Type: AWS::KMS::Key
    Condition: AnyProviderEnabled
    Properties:
      Description: "Blocks AI Control: encrypts the provider service account keys stored in Secrets Manager. Only the provider Lambda roles can use it."
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: KeyAdministrationWithoutUse
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action:
              - kms:CreateAlias
              - kms:DeleteAlias
              - kms:UpdateAlias
              - kms:DescribeKey
              - kms:EnableKey
              - kms:DisableKey
              - kms:EnableKeyRotation
              - kms:DisableKeyRotation
              - kms:GetKeyPolicy
              - kms:GetKeyRotationStatus
              - kms:ListAliases
              - kms:ListGrants
              - kms:ListKeyPolicies
              - kms:ListResourceTags
              - kms:PutKeyPolicy
              - kms:UpdateKeyDescription
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: "*"
          # "*" with conditions, not the role: the role policy names this key (a circular dependency otherwise).
          - Sid: ProviderRolesUseThroughSecretsManager
            Effect: Allow
            Principal:
              AWS: "*"
            Action:
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey
            Resource: "*"
            Condition:
              StringEquals:
                "kms:CallerAccount": !Ref AWS::AccountId
                "kms:ViaService": !Sub "secretsmanager.${AWS::Region}.amazonaws.com"
              ArnEquals:
                "aws:PrincipalArn":
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/BlocksAIControlProviderAnthropicRole"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/BlocksAIControlProviderOpenAIRole"
          - Sid: ProviderRolesDescribeKey
            Effect: Allow
            Principal:
              AWS: "*"
            Action: kms:DescribeKey
            Resource: "*"
            Condition:
              StringEquals:
                "kms:CallerAccount": !Ref AWS::AccountId
              ArnEquals:
                "aws:PrincipalArn":
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/BlocksAIControlProviderAnthropicRole"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/BlocksAIControlProviderOpenAIRole"
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud
  ProviderKeysKeyAlias:
    Type: AWS::KMS::Alias
    Condition: AnyProviderEnabled
    Properties:
      AliasName: alias/BlocksAIControlProviderKeys
      TargetKeyId: !Ref ProviderKeysKey
  AnthropicProviderLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: AnthropicEnabled
    Properties:
      LogGroupName: /aws/lambda/BlocksAIControlProvider-Anthropic
      RetentionInDays: 365
  AnthropicProviderRole:
    Type: AWS::IAM::Role
    Condition: AnthropicEnabled
    Properties:
      RoleName: BlocksAIControlProviderAnthropicRole
      Description: "Execution role of the Blocks AI Control Anthropic provider."
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BlocksAIControlAnthropicProvider
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt AnthropicProviderLogGroup.Arn
              - Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:UpdateSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:RestoreSecret
                  - secretsmanager:TagResource
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:blocks/ai-control/anthropic/*"
              # ListSecrets has no resource-level permissions.
              - Effect: Allow
                Action: secretsmanager:ListSecrets
                Resource: "*"
              - Effect: Allow
                Action: cloudformation:DescribeStackResource
                Resource: !Ref AWS::StackId
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !GetAtt ProviderKeysKey.Arn
  AnthropicProviderFunction:
    Type: AWS::Lambda::Function
    Condition: AnthropicEnabled
    Properties:
      FunctionName: BlocksAIControlProvider-Anthropic
      Description: "Stores the Anthropic service account key and runs the Anthropic calls of Blocks AI Control."
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 120
      MemorySize: 256
      Role: !GetAtt AnthropicProviderRole.Arn
      LoggingConfig:
        LogGroup: !Ref AnthropicProviderLogGroup
      Environment:
        Variables:
          TEMPLATE_VERSION: !Ref TemplateVersion
          PROVIDER_KEYS_KEY_ARN: !GetAtt ProviderKeysKey.Arn
          INTAKE_ISSUER: !Ref IntakeIssuer
          CUSTOMER_ID: !Ref CustomerId
          STACK_ID: !Ref AWS::StackId
          INTAKE_URL: !Sub "https://${IntakeApi}.execute-api.${AWS::Region}.amazonaws.com/providers/anthropic/credentials"
      Code:
        ZipFile: |
          # >>> render_provider_lambdas: begin anthropic
