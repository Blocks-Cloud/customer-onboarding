  # Stack delete: the secrets go before the key and the role (this resource depends on both). Create and Update do nothing.
  ProviderSecretsCleanup:
    Type: Custom::BlocksAIControlProviderSecretsCleanup
    Condition: AnthropicEnabled
    DependsOn:
      - ProviderKeysKey
      - AnthropicProviderRole
      - AnthropicProviderLogGroup
    Properties:
      ServiceToken: !GetAtt AnthropicProviderFunction.Arn
  # The key intake reaches the function only through this alias (only API Gateway may invoke it). The description holds the code
  # hash and the settings a version freezes, so a change of either publishes a new version and moves the alias.
  # A new CustomerId needs a new stack or a code change (the alias version ignores it).
  AnthropicProviderVersion:
    Type: AWS::Lambda::Version
    Condition: AnthropicEnabled
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref AnthropicProviderFunction
      Description: !Sub "Provider code sha256:d303ff44b26b766e v${TemplateVersion} ${ProviderKeysKey} ${IntakeIssuer}"
  AnthropicProviderIntakeAlias:
    Type: AWS::Lambda::Alias
    Condition: AnthropicEnabled
    Properties:
      FunctionName: !Ref AnthropicProviderFunction
      FunctionVersion: !GetAtt AnthropicProviderVersion.Version
      Name: intake
  # Stack delete: the OpenAI secrets go before the key and the role. Create and Update do nothing.
  OpenAIProviderSecretsCleanup:
    Type: Custom::BlocksAIControlOpenAIProviderSecretsCleanup
    Condition: OpenAIEnabled
    DependsOn:
      - ProviderKeysKey
      - OpenAIProviderRole
      - OpenAIProviderLogGroup
    Properties:
      ServiceToken: !GetAtt OpenAIProviderFunction.Arn
  OpenAIProviderVersion:
    Type: AWS::Lambda::Version
    Condition: OpenAIEnabled
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref OpenAIProviderFunction
      Description: !Sub "Provider code sha256:45b60865d02ca7c8 v${TemplateVersion} ${ProviderKeysKey} ${IntakeIssuer}"
  OpenAIProviderIntakeAlias:
    Type: AWS::Lambda::Alias
    Condition: OpenAIEnabled
    Properties:
      FunctionName: !Ref OpenAIProviderFunction
      FunctionVersion: !GetAtt OpenAIProviderVersion.Version
      Name: intake
  IntakeApi:
    Type: AWS::ApiGatewayV2::Api
    Condition: AnyProviderEnabled
    Properties:
      Name: BlocksAIControlIntake
      Description: "Key intake for Blocks AI Control. Your browser sends the provider service account key here, not to Blocks."
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref IntakeAllowedOrigin
        AllowMethods:
          - POST
        AllowHeaders:
          - authorization
          - content-type
        MaxAge: 600
      Tags:
        OwnedBy: Blocks.cloud
  IntakeAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: AnyProviderEnabled
    Properties:
      LogGroupName: /aws/apigateway/BlocksAIControlIntake
      RetentionInDays: 365
  IntakeStage:
    Type: AWS::ApiGatewayV2::Stage
    Condition: AnyProviderEnabled
    Properties:
      ApiId: !Ref IntakeApi
      StageName: $default
      AutoDeploy: true
      AccessLogSettings:
        DestinationArn: !GetAtt IntakeAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","sourceIp":"$context.identity.sourceIp","status":"$context.status","routeKey":"$context.routeKey","error":"$context.error.message","authorizerError":"$context.authorizer.error"}'
      DefaultRouteSettings:
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10
      Tags:
        OwnedBy: Blocks.cloud
  IntakeAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Condition: AnyProviderEnabled
    Properties:
      ApiId: !Ref IntakeApi
      Name: BlocksIntakeToken
      AuthorizerType: JWT
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Issuer: !Ref IntakeIssuer
        Audience:
          - !Ref AWS::AccountId
  IntakeIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: AnthropicEnabled
    Properties:
      ApiId: !Ref IntakeApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Ref AnthropicProviderIntakeAlias
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 30000
  IntakeRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: AnthropicEnabled
    Properties:
      ApiId: !Ref IntakeApi
      RouteKey: POST /providers/anthropic/credentials
      AuthorizationType: JWT
      AuthorizerId: !Ref IntakeAuthorizer
      AuthorizationScopes:
        - ai-control:store-key
      Target: !Sub "integrations/${IntakeIntegration}"
  IntakeInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: AnthropicEnabled
    Properties:
      FunctionName: !Ref AnthropicProviderIntakeAlias
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${IntakeApi}/*/POST/providers/anthropic/credentials"
  OpenAIIntakeIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: OpenAIEnabled
    Properties:
      ApiId: !Ref IntakeApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Ref OpenAIProviderIntakeAlias
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 30000
  OpenAIIntakeRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: OpenAIEnabled
    Properties:
      ApiId: !Ref IntakeApi
      RouteKey: POST /providers/openai/credentials
      AuthorizationType: JWT
      AuthorizerId: !Ref IntakeAuthorizer
      AuthorizationScopes:
        - ai-control:store-key
      Target: !Sub "integrations/${OpenAIIntakeIntegration}"
  OpenAIIntakeInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: OpenAIEnabled
    Properties:
      FunctionName: !Ref OpenAIProviderIntakeAlias
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${IntakeApi}/*/POST/providers/openai/credentials"
Outputs:
  ProviderIntakeUrl:
    Condition: AnthropicEnabled
    Value: !Sub "https://${IntakeApi}.execute-api.${AWS::Region}.amazonaws.com/providers/anthropic/credentials"
  OpenAIProviderIntakeUrl:
    Condition: OpenAIEnabled
    Value: !Sub "https://${IntakeApi}.execute-api.${AWS::Region}.amazonaws.com/providers/openai/credentials"
  AnthropicProviderFunctionArn:
    Condition: AnthropicEnabled
    Value: !GetAtt AnthropicProviderFunction.Arn
  OpenAIProviderFunctionArn:
    Condition: OpenAIEnabled
    Value: !GetAtt OpenAIProviderFunction.Arn
