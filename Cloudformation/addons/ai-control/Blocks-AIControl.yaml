          AnthropicProviderVersion:
            Type: AWS::Lambda::Version
            Condition: AnthropicEnabled
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              FunctionName: !Ref AnthropicProviderFunction
              Description: !Sub "Provider code sha256:898d6ae3241397e2 v${TemplateVersion} ${ProviderKeysKey} ${IntakeIssuer}"
          AnthropicProviderIntakeAlias:
            Type: AWS::Lambda::Alias
            Condition: AnthropicEnabled
            Properties:
              FunctionName: !Ref AnthropicProviderFunction
              FunctionVersion: !GetAtt AnthropicProviderVersion.Version
              Name: intake
          IntakeApi:
            Type: AWS::ApiGatewayV2::Api
            Condition: AnthropicEnabled
            Properties:
              Name: BlocksAIControlIntake
              Description: "Key intake for Blocks AI Control. Your browser sends the provider service account key here, not to Blocks."
              ProtocolType: HTTP
              CorsConfiguration:
                AllowOrigins:
                  - !Ref IntakeAllowedOrigin
                AllowMethods:
                  - POST
                AllowHeaders:
                  - authorization
                  - content-type
                MaxAge: 600
              Tags:
                OwnedBy: Blocks.cloud
          IntakeAccessLogGroup:
            Type: AWS::Logs::LogGroup
            Condition: AnthropicEnabled
            Properties:
              LogGroupName: /aws/apigateway/BlocksAIControlIntake
              RetentionInDays: 365
          IntakeStage:
            Type: AWS::ApiGatewayV2::Stage
            Condition: AnthropicEnabled
            Properties:
              ApiId: !Ref IntakeApi
              StageName: $default
              AutoDeploy: true
              AccessLogSettings:
                DestinationArn: !GetAtt IntakeAccessLogGroup.Arn
                Format: '{"requestId":"$context.requestId","sourceIp":"$context.identity.sourceIp","status":"$context.status","routeKey":"$context.routeKey","error":"$context.error.message","authorizerError":"$context.authorizer.error"}'
              DefaultRouteSettings:
                ThrottlingRateLimit: 5
                ThrottlingBurstLimit: 10
              Tags:
                OwnedBy: Blocks.cloud
          IntakeAuthorizer:
            Type: AWS::ApiGatewayV2::Authorizer
            Condition: AnthropicEnabled
