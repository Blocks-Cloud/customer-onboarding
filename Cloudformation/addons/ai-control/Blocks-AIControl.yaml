AWSTemplateFormatVersion: "2010-09-09"
Description: >
  IMPORTANT: Deploy this stack in your AWS Organization Management (root) account in the us-east-1 region only.

  SUMMARY: Blocks AI Control (optional add-on). Creates one member account in its own OU, a service control policy
  that denies Amazon Bedrock (created, NOT attached) and a kill switch Lambda in that account that only Blocks can call.

  ACTIONS (in order of execution):
  1. Checks the organization (all features, SCP type, StackSets trusted access, account quota, email length).
  2. Creates the BlocksAIControlOU organizational unit.
  3. Creates the "Blocks AI Control" member account in that OU (root email: your management root email +aic-<id>).
  4. Creates the deny-Bedrock service control policy, not attached.
  5. Creates a role that only the kill switch can assume; it can attach or detach only that policy.
  6. StackSet into the control account: Lambda BlocksAIControlKillSwitch and role BlocksAIControlInvokeRole (ExternalId).
  7. Creates an EventBridge rule that notifies Blocks about the state of this stack.

Metadata:
  TemplateVersion: "0.2.1" # x-release-please-version

Mappings:
  TemplateConfig:
    Constants:
      Version: "0.2.1" # x-release-please-version
      # Name of the Blocks platform role that may assume BlocksAIControlInvokeRole (contract with the platform, D28).
      ExecutorRoleName: ai-control-executor-role
      # CI only: blocks_cli --mock-control-account sets this to "false" (no account, so no StackSet).
      DeployKillSwitch: "true"

Conditions:
  DeployKillSwitch: !Equals [!FindInMap [TemplateConfig, Constants, DeployKillSwitch], "true"]

Rules:
  EnforceUsEast1:
    Assertions:
      - Assert:
          Fn::Equals:
            - !Ref AWS::Region
            - us-east-1
        AssertDescription: "You must deploy to region us-east-1 only."

  EnforceManagementAccount:
    Assertions:
      - Assert:
          Fn::Or:
            - Fn::Equals:
                - !Ref AWS::AccountId
                - "{{MANAGEMENT_ACCOUNT_ID}}"
            - Fn::Equals:
                - "{{MANAGEMENT_ACCOUNT_ID}}"
                - "SKIP"
        AssertDescription: "This stack must be deployed in the AWS Organization management account only. The current account does not match the expected management account."

Resources:
  # ---------------------------------------------------------------------------
  # One execution role per setup Lambda, each limited to what that Lambda calls
  # ---------------------------------------------------------------------------
  OrgInfoRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "BlocksAIControlOrgInfoRole-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      Description: "Used by the Blocks AI Control stack's preflight Lambda. Email support@blocks.cloud for assistance."
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: BlocksAIControlPreflight
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - organizations:DescribeOrganization
                  - organizations:ListRoots
                  - organizations:ListPoliciesForTarget
                  - organizations:ListAccounts
                  - servicequotas:GetServiceQuota
                  - servicequotas:GetAWSDefaultServiceQuota
                Resource: "*"
              - Effect: Allow
                Action: organizations:EnablePolicyType
                Resource: !Sub "arn:${AWS::Partition}:organizations::${AWS::AccountId}:root/o-*/r-*"
              # Service-managed StackSets need trusted access (same grants as Step 2 EnableOrgServices)
              - Effect: Allow
                Action:
                  - cloudformation:DescribeOrganizationsAccess
                  - cloudformation:ActivateOrganizationsAccess
                  - organizations:EnableAWSServiceAccess
                  - iam:GetRole
                  - iam:CreateServiceLinkedRole
                Resource: "*"

  ControlAccountRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "BlocksAIControlAccountRole-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      Description: "Used by the Blocks AI Control stack's account-creation Lambda. Email support@blocks.cloud for assistance."
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: BlocksAIControlAccount
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - organizations:CreateAccount
                  - organizations:TagResource
                  - organizations:DescribeCreateAccountStatus
                  - organizations:ListAccounts
                  - organizations:ListParents
                Resource: "*"
              - Effect: Allow
                Action: organizations:MoveAccount
                Resource:
                  - !Sub "arn:${AWS::Partition}:organizations::${AWS::AccountId}:root/o-*/r-*"
                  - !Sub "arn:${AWS::Partition}:organizations::${AWS::AccountId}:ou/o-*/ou-*"
                  - !Sub "arn:${AWS::Partition}:organizations::${AWS::AccountId}:account/o-*/*"

  PolicyLifecycleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "BlocksAIControlLifecycleRole-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      Description: "Used by the Blocks AI Control stack to detach its own policy on delete. Email support@blocks.cloud for assistance."
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: BlocksAIControlDetachOwnPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - organizations:ListTargetsForPolicy
                  - organizations:DetachPolicy
                Resource:
                  - !Sub "arn:${AWS::Partition}:organizations::${AWS::AccountId}:policy/o-*/service_control_policy/${KillSwitchPolicy}"
              - Effect: Allow
                Action: organizations:DetachPolicy
                Resource:
                  - !Sub "arn:${AWS::Partition}:organizations::${AWS::AccountId}:root/o-*/r-*"
                  - !Sub "arn:${AWS::Partition}:organizations::${AWS::AccountId}:ou/o-*/ou-*"
                  - !Sub "arn:${AWS::Partition}:organizations::${AWS::AccountId}:account/o-*/*"
        # On stack delete: remove the account-level Bedrock block of the kill switch in every region, and its guardrails.
        - PolicyName: BlocksAIControlRemoveBedrockBlock
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:ListGuardrails
                  - bedrock:ListEnforcedGuardrailsConfiguration
                  - bedrock:DeleteEnforcedGuardrailConfiguration
                  - account:ListRegions
                Resource: "*"
              - Effect: Allow
                Action: bedrock:DeleteGuardrail
                Resource: !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:guardrail/*"
              - Effect: Allow
                Action: ssm:GetParametersByPath
                Resource: !Sub "arn:${AWS::Partition}:ssm:*::parameter/aws/service/global-infrastructure/services/bedrock/regions"

  # ---------------------------------------------------------------------------
  # Preflight: organization facts and prerequisites (D27)
  # ---------------------------------------------------------------------------
  OrgInfo:
    Type: Custom::BlocksAIControlOrgInfo
    Properties:
      ServiceToken: !GetAtt OrgInfoFunction.Arn
      TemplateVersion: !FindInMap [TemplateConfig, Constants, Version]

  OrgInfoFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "BlocksAIControlOrgInfo-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 840
      Role: !GetAtt OrgInfoRole.Arn
      Code:
        ZipFile: |
          import time
          import boto3
          import cfnresponse
          from botocore.exceptions import ClientError

          SCP_LIMIT = 10


          def ensure_scp_type(o, root):
              on = any(t["Type"] == "SERVICE_CONTROL_POLICY" and t["Status"] == "ENABLED" for t in root["PolicyTypes"])
              if on:
                  return
              try:
                  o.enable_policy_type(RootId=root["Id"], PolicyType="SERVICE_CONTROL_POLICY")
              except ClientError as e:
                  if e.response["Error"]["Code"] != "PolicyTypeAlreadyEnabledException":
                      raise


          def account_headroom(sq, o):
              try:
                  quota = sq.get_service_quota(ServiceCode="organizations", QuotaCode="L-E619E033")["Quota"]["Value"]
              except ClientError:
                  quota = sq.get_aws_default_service_quota(ServiceCode="organizations", QuotaCode="L-E619E033")["Quota"]["Value"]
              used = sum(1 for p in o.get_paginator("list_accounts").paginate() for _ in p["Accounts"])
              return int(quota) - used


          def email_fits(root_email, rid):
              """Same derivation as the account Lambda: an existing +tag is replaced, not appended."""
              local, domain = root_email.split("@")
              return len(f"{local.split('+')[0]}+aic-{rid.lower()}@{domain}") <= 64


          def check_new_account(o, sq, org, root, root_scp_count):
              """Checks that only matter when the account and the policy are created (not on a version update)."""
              ensure_scp_type(o, root)
              if root_scp_count >= SCP_LIMIT:
                  raise RuntimeError(f"The organization root already has {root_scp_count} service control policies attached (limit {SCP_LIMIT})")
              headroom = account_headroom(sq, o)
              if headroom < 1:
                  raise RuntimeError("Your organization has no free account slot (quota L-E619E033); request a raise or close unused accounts")
              if not email_fits(org["MasterAccountEmail"], "{{BLOCKS_CUSTOMER_RESOURCE_ID}}"):
                  raise RuntimeError("Management account root email is too long to derive the control account email (64 characters max)")
              return headroom


          def ensure_stacksets_access(cfn, wait=60, tries=12):
              """The kill switch StackSet is service-managed: it needs StackSets trusted access (a Step 1 customer may not have it)."""
              if cfn.describe_organizations_access(CallAs="SELF")["Status"] == "ENABLED":
                  return
              cfn.activate_organizations_access()
              for _ in range(tries):
                  if cfn.describe_organizations_access(CallAs="SELF")["Status"] == "ENABLED":
                      return
                  time.sleep(wait)
              raise RuntimeError("StackSets trusted access did not turn on; activate it in the CloudFormation StackSets console and retry")


          def handler(event, ctx):
              try:
                  if event["RequestType"] == "Delete":
                      cfnresponse.send(event, ctx, cfnresponse.SUCCESS, {}, physicalResourceId="orginfo")
                      return
                  o = boto3.client("organizations", region_name="us-east-1")
                  sq = boto3.client("service-quotas", region_name="us-east-1")
                  org = o.describe_organization()["Organization"]
                  if org["FeatureSet"] != "ALL":
                      raise RuntimeError("Your organization must have all features enabled (not consolidated billing only)")
                  ensure_stacksets_access(boto3.client("cloudformation", region_name="us-east-1"))
                  root = o.list_roots()["Roots"][0]
                  n = len(o.list_policies_for_target(TargetId=root["Id"], Filter="SERVICE_CONTROL_POLICY")["Policies"])
                  headroom = check_new_account(o, sq, org, root, n) if event["RequestType"] == "Create" else ""
                  cfnresponse.send(event, ctx, cfnresponse.SUCCESS, {
                      "RootId": root["Id"],
                      "OrgId": org["Id"],
                      "ManagementAccountId": org["MasterAccountId"],
                      "RootEmail": org["MasterAccountEmail"],
                      "RootScpCount": str(n),
                      "AccountHeadroom": str(headroom),
                  }, physicalResourceId="orginfo")
              except Exception as e:
                  cfnresponse.send(event, ctx, cfnresponse.FAILED, {}, reason=str(e).replace('"', "'").replace("\\", "/").replace("\n", " ")[:500])

  # ---------------------------------------------------------------------------
  # OU and control account
  # ---------------------------------------------------------------------------
  BlocksAIControlOU:
    Type: AWS::Organizations::OrganizationalUnit
    Properties:
      Name: "BlocksAIControlOU-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      ParentId: !GetAtt OrgInfo.RootId
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud

  CreateControlAccount:
    Type: Custom::BlocksAIControlAccount
    Properties:
      ServiceToken: !GetAtt CreateControlAccountFunction.Arn
      OrganizationalUnitId: !Ref BlocksAIControlOU
      RootId: !GetAtt OrgInfo.RootId
      RootEmail: !GetAtt OrgInfo.RootEmail
      ResourceId: "{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      TemplateVersion: !FindInMap [TemplateConfig, Constants, Version]
      RequireAccount: !FindInMap [TemplateConfig, Constants, DeployKillSwitch]

  CreateControlAccountFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "BlocksAIControlCreateAccount-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 900
      Role: !GetAtt ControlAccountRole.Arn
      Code:
        ZipFile: |
          import time
          import boto3
          import cfnresponse
          from botocore.exceptions import ClientError

          RETRYABLE = ("ConcurrentModificationException", "TooManyRequestsException")
          MOCK_NO_ACCOUNT = False  # CI only: blocks_cli --mock-control-account sets this to True (no real account)


          def retry(fn, ctx, **kw):
              delay = 5
              while True:
                  try:
                      return fn(**kw)
                  except ClientError as e:
                      if e.response["Error"]["Code"] not in RETRYABLE or ctx.get_remaining_time_in_millis() < 120000:
                          raise
                      time.sleep(delay)
                      delay = min(delay * 2, 60)


          def find_account(o, name):
              found = None
              for page in o.get_paginator("list_accounts").paginate():
                  for a in page["Accounts"]:
                      if a["Name"] == name:
                          if a["Status"] == "ACTIVE":
                              return a
                          found = found or a
              return found


          def email_for(root_email, rid):
              local, domain = root_email.split("@")
              local = local.split("+")[0]
              e = f"{local}+aic-{rid.lower()}@{domain}"
              if len(e) > 64:
                  raise RuntimeError("root email too long for plus-addressing (64 characters max)")
              return e


          def parent_of(o, acct_id):
              return o.list_parents(ChildId=acct_id)["Parents"][0]["Id"]


          def move(o, ctx, acct_id, dest):
              src = parent_of(o, acct_id)
              if src != dest:
                  retry(o.move_account, ctx, AccountId=acct_id, SourceParentId=src, DestinationParentId=dest)


          def create(o, ctx, email, name):
              t0 = time.time()
              r = retry(o.create_account, ctx, Email=email, AccountName=name, IamUserAccessToBilling="DENY",
                        Tags=[{"Key": "OwnedBy", "Value": "Blocks.cloud"}, {"Key": "Purpose", "Value": "BlocksAIControl"}])
              req = r["CreateAccountStatus"]["Id"]
              while True:
                  s = o.describe_create_account_status(CreateAccountRequestId=req)["CreateAccountStatus"]
                  if s["State"] == "SUCCEEDED":
                      print(f"CreateAccount took {time.time() - t0:.1f}s")
                      return s["AccountId"]
                  if s["State"] == "FAILED":
                      raise RuntimeError(f"CreateAccount failed: {s.get('FailureReason')}")
                  if ctx.get_remaining_time_in_millis() < 60000:
                      raise RuntimeError("timed out waiting for CreateAccount; re-run the stack update to finish")
                  time.sleep(5)


          def handler(event, ctx):
              p = event["ResourceProperties"]
              name = f"Blocks AI Control {p['ResourceId']}"
              o = boto3.client("organizations", region_name="us-east-1")
              try:
                  if MOCK_NO_ACCOUNT and event["RequestType"] != "Delete":
                      cfnresponse.send(event, ctx, cfnresponse.SUCCESS, {"AccountId": "", "AccountError": ""},
                                       physicalResourceId=f"none-{p['ResourceId']}")
                      return
                  if event["RequestType"] == "Delete":
                      phys = event.get("PhysicalResourceId", "")
                      a = find_account(o, name)
                      # Only the Delete issued for the live account acts. A Delete for a replaced physical id (for example
                      # none-<rid> after a failed first run) must not move the account the stack just put in the OU.
                      if a and a["Status"] == "ACTIVE" and a["Id"] == phys:
                          move(o, ctx, a["Id"], p["RootId"])  # never close; free the OU for deletion
                      cfnresponse.send(event, ctx, cfnresponse.SUCCESS, {})
                      return
                  a = find_account(o, name)
                  if a and a["Status"] != "ACTIVE":
                      raise RuntimeError("the control account exists but is closed; its root email stays reserved for 90 days, contact support@blocks.cloud")
                  acct_id = a["Id"] if a else create(o, ctx, email_for(p["RootEmail"], p["ResourceId"]), name)
                  move(o, ctx, acct_id, p["OrganizationalUnitId"])
                  cfnresponse.send(event, ctx, cfnresponse.SUCCESS, {"AccountId": acct_id, "AccountError": ""},
                                   physicalResourceId=acct_id)
              except Exception as e:
                  msg = str(e).replace('"', "'").replace("\\", "/").replace("\n", " ")[:500]
                  print(f"control account error: {msg}")
                  # Keep the existing physical id on Update: a changed id is a replacement, and the cleanup Delete would
                  # move the live account back to the root.
                  phys = event.get("PhysicalResourceId") or ""
                  kept = "" if (not phys or phys.startswith("none-")) else phys  # report the account that still exists
                  if not kept and event["RequestType"] != "Delete" and p.get("RequireAccount") == "true":
                      # v0.2 cannot work without the account: an empty id would reach the policy role principal and fail
                      # the stack with an opaque IAM error. Fail here with the real reason. With an account that still
                      # exists (an Update that failed later) the error is only reported in the outputs. The rollback of a
                      # failed v0.1 -> v0.2 update sends the v0.1 properties (no RequireAccount) to this code: it must
                      # still answer SUCCESS, or the rollback fails (UPDATE_ROLLBACK_FAILED).
                      cfnresponse.send(event, ctx, cfnresponse.FAILED, {}, reason=msg, physicalResourceId=phys or f"none-{p['ResourceId']}")
                      return
                  cfnresponse.send(event, ctx, cfnresponse.SUCCESS, {"AccountId": kept, "AccountError": msg},
                                   physicalResourceId=phys or f"none-{p['ResourceId']}")

  # ---------------------------------------------------------------------------
  # Kill-switch SCP (created, not attached) and its delete-time lifecycle (D4, D12)
  # ---------------------------------------------------------------------------
  KillSwitchPolicy:
    Type: AWS::Organizations::Policy
    DependsOn: OrgInfo
    Properties:
      Name: "BlocksAIControlDenyBedrock-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      Type: SERVICE_CONTROL_POLICY
      Description: "Blocks AI Control kill switch. Denies Amazon Bedrock. Attached only when you block Bedrock through Blocks."
      Content:
        Version: "2012-10-17"
        Statement:
          - Sid: BlocksAIControlDenyBedrock
            Effect: Deny
            Action:
              - "bedrock:*"
              - "bedrock-mantle:*"
            Resource: "*"
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud

  KillSwitchPolicyLifecycle:
    Type: Custom::BlocksAIControlPolicyLifecycle
    Properties:
      ServiceToken: !GetAtt KillSwitchPolicyLifecycleFunction.Arn
      PolicyId: !Ref KillSwitchPolicy
      GuardrailName: "BlocksAIControlBlockAll-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"

  KillSwitchPolicyLifecycleFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "BlocksAIControlPolicyLifecycle-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 600
      Role: !GetAtt PolicyLifecycleRole.Arn
      Code:
        ZipFile: |
          import json
          import re
          import time
          import urllib.error
          import urllib.request

          import boto3
          import cfnresponse
          from botocore.auth import SigV4Auth
          from botocore.awsrequest import AWSRequest
          from botocore.config import Config
          from botocore.credentials import Credentials
          from botocore.exceptions import BotoCoreError, ClientError


          def detach_all(o, policy_id):
              try:
                  targets = o.list_targets_for_policy(PolicyId=policy_id)["Targets"]
              except ClientError as e:
                  if e.response["Error"]["Code"] in ("PolicyNotFoundException", "AWSOrganizationsNotInUseException"):
                      return 0
                  raise
              n = 0
              for t in targets:
                  try:
                      o.detach_policy(PolicyId=policy_id, TargetId=t["TargetId"])
                      n += 1
                  except ClientError as e:
                      if e.response["Error"]["Code"] != "PolicyNotAttachedException":
                          raise
                  time.sleep(0.5)  # DetachPolicy throttle is 2 per second
              return n


          GUARD_REGION_RE = re.compile(r"^[a-z]{2}(-[a-z]+)+-[0-9]{1,2}$")
          CONFIG_PATH = "/enforcedGuardrailsConfiguration"
          REST_TIMEOUT = 20
          CLIENT_CONFIG = Config(connect_timeout=5, read_timeout=10, retries={"mode": "standard", "max_attempts": 3})


          class GuardError(Exception):
              """A step failed. The message is an error code, never a name, an ARN or a request value."""


          def code_of(e):
              if isinstance(e, ClientError):
                  return e.response["Error"]["Code"]
              return str(e) if isinstance(e, GuardError) else type(e).__name__


          def creds_client(creds, service, region="us-east-1"):
              # A new session per call: the default session is not safe to share between threads.
              return boto3.session.Session().client(service, region_name=region, config=CLIENT_CONFIG, aws_access_key_id=creds["AccessKeyId"],
                                                    aws_secret_access_key=creds["SecretAccessKey"], aws_session_token=creds["SessionToken"])


          def control_plane(creds, region):
              """A function (method, path, body=None) that makes SigV4-signed calls to the Bedrock control plane of this region, for the
              account-level enforcement operations only.
              Why not boto3: the SDK that Lambda bundles changes with runtime updates and region, and may not know these operations
              or their current shape (selectiveContentGuarding, modelEnforcement)."""
              credentials = Credentials(creds["AccessKeyId"], creds["SecretAccessKey"], creds["SessionToken"])

              def call(method, path, body=None):
                  url = f"https://bedrock.{region}.amazonaws.com{path}"
                  data = json.dumps(body).encode() if body is not None else None
                  req = AWSRequest(method=method, url=url, data=data, headers={"Content-Type": "application/json"} if data else {})
                  SigV4Auth(credentials, "bedrock", region).add_auth(req)
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, data=data, method=method, headers=dict(req.headers)), timeout=REST_TIMEOUT) as r:
                          raw = r.read()
                  except urllib.error.HTTPError as e:
                      raise GuardError((e.headers.get("x-amzn-ErrorType") or "").split(":")[0] or f"HTTP{e.code}") from None
                  except (urllib.error.URLError, OSError):
                      raise GuardError("ConnectionError") from None
                  return json.loads(raw) if raw else {}

              return call


          def all_items(client, op, key, **kw):
              for page in client.get_paginator(op).paginate(**kw):
                  yield from page[key]


          def guard_regions(creds):
              """Regions to cover: every Bedrock region the SDK or AWS (public SSM parameters) lists that the account has enabled.
              The union means a Bedrock region that is new to an old SDK is still covered."""
              known = set(boto3.session.Session().get_available_regions("bedrock"))
              try:
                  for page in creds_client(creds, "ssm").get_paginator("get_parameters_by_path").paginate(
                          Path="/aws/service/global-infrastructure/services/bedrock/regions"):
                      known |= {p["Value"] for p in page["Parameters"]}
              except (ClientError, BotoCoreError):
                  pass  # the SDK list alone still covers every region it knows
              on = ["ENABLED", "ENABLED_BY_DEFAULT"]
              enabled = {r["RegionName"] for r in all_items(creds_client(creds, "account"), "list_regions", "Regions", RegionOptStatusContains=on)}
              return sorted(r for r in known & enabled if GUARD_REGION_RE.match(r))


          def find_guardrail(bc, name):
              """The DRAFT summary (id, arn) of the guardrail with this name, or None."""
              for g in all_items(bc, "list_guardrails", "guardrails"):
                  if g["name"] == name:
                      return g
              return None


          def cfg_guardrail_id(cfg):
              """The guardrail id of an enforced configuration (the id, or the last part of the ARN)."""
              return cfg.get("guardrailId") or (cfg.get("guardrailArn") or "").rsplit("/", 1)[-1]


          def owns(cfg, g):
              """True when this enforced configuration points to our guardrail (g: its summary from list_guardrails, or None)."""
              return bool(cfg and g and cfg_guardrail_id(cfg) == g["id"])


          def enforced_config(call):
              """The account-level enforced configuration of this region, or None. A region can have at most one."""
              configs = call("GET", CONFIG_PATH).get("guardrailsConfig") or []
              return configs[0] if configs else None


          def remove_enforcement(call, cfg):
              """Delete this enforced configuration. The caller has checked that it points to our guardrail."""
              if not re.fullmatch(r"[a-z0-9]+", str(cfg.get("configId"))):
                  raise GuardError("InvalidConfigId")
              call("DELETE", f"{CONFIG_PATH}/{cfg['configId']}")


          LIFECYCLE_BUDGET_SECONDS = 540  # the Lambda times out at 600 s: answer CloudFormation before that


          def remove_in_region(creds, region, name, deadline):
              """Remove our enforced configuration (if it is ours) and then our guardrail. Reading the enforcement comes first, so
              nothing is deleted before we know whether it is enforced. A read that fails is not fatal by itself (a region may have no
              enforcement API): the guardrail delete then decides, because AWS refuses to delete an enforced guardrail."""
              if time.monotonic() > deadline:
                  raise GuardError("timeout")  # before anything is deleted: a retry still finds the guardrail and so our enforcement
              bc = creds_client(creds, "bedrock", region)
              g = find_guardrail(bc, name)
              if g is None:
                  return
              call, read_error = control_plane(creds, region), None
              try:
                  cfg = enforced_config(call)
              except (ClientError, BotoCoreError, GuardError) as e:
                  cfg, read_error = None, e
              if owns(cfg, g):
                  remove_enforcement(call, cfg)
              try:
                  bc.delete_guardrail(guardrailIdentifier=g["id"])
              except ClientError:
                  if read_error:
                      raise read_error  # enforcement unreadable and the guardrail is kept: fail so the delete can be retried


          def remove_guardrails(creds, name, deadline=None):
              """Remove our enforced configuration and guardrail in every region. A region where the enforcement cannot be removed
              fails the stack delete (codes only), so no block is left behind unseen; retry the delete."""
              deadline = deadline or time.monotonic() + LIFECYCLE_BUDGET_SECONDS
              failed = {}
              for region in guard_regions(creds):
                  try:
                      if time.monotonic() > deadline:
                          raise GuardError("timeout")
                      remove_in_region(creds, region, name, deadline)
                  except Exception as e:  # every region is tried, whatever goes wrong in one
                      failed[code_of(e)] = failed.get(code_of(e), 0) + 1
              if failed:
                  raise GuardError("could not remove the Bedrock block in the management account (" + ", ".join(f"{c} x{n}" for c, n in sorted(failed.items())) + "); retry the delete")


          def handler(event, ctx):
              try:
                  props = event.get("ResourceProperties") or {}
                  pid = props.get("PolicyId")
                  stable = f"lifecycle-{pid}"
                  if event["RequestType"] == "Delete":
                      # Detach only when the live resource is deleted. A Delete for a replaced physical id (property or
                      # ServiceToken change on update) must not release an engaged kill switch.
                      if pid and event.get("PhysicalResourceId") == stable:
                          o = boto3.client("organizations", region_name="us-east-1")
                          print(f"detached from {detach_all(o, pid)} targets")
                          if props.get("GuardrailName"):
                              c = boto3.Session().get_credentials().get_frozen_credentials()
                              # Answer CloudFormation before the Lambda times out (it would otherwise wait for about an hour).
                              left = ctx.get_remaining_time_in_millis() / 1000 - 60 if ctx else LIFECYCLE_BUDGET_SECONDS
                              remove_guardrails({"AccessKeyId": c.access_key, "SecretAccessKey": c.secret_key, "SessionToken": c.token},
                                                props["GuardrailName"], time.monotonic() + left)
                  cfnresponse.send(event, ctx, cfnresponse.SUCCESS, {}, physicalResourceId=stable)
              except Exception as e:
                  # Error codes only: a message can carry ARNs or names, and stack events are readable by many people.
                  why = str(e) if isinstance(e, GuardError) else code_of(e)
                  cfnresponse.send(event, ctx, cfnresponse.FAILED, {}, reason=why.replace('"', "'").replace("\n", " ")[:500])

  # ---------------------------------------------------------------------------
  # Kill switch (I3): policy role here, Lambda and invoke role in the control account through a StackSet (D3, D29)
  # ---------------------------------------------------------------------------
  KillSwitchPolicyRole:
    Type: AWS::IAM::Role
    Condition: DeployKillSwitch
    Properties:
      RoleName: "BlocksAIControlPolicyRole-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      Description: "Lets only the Blocks AI Control kill switch Lambda in the control account attach or detach the Blocks deny-Bedrock policy. Email support@blocks.cloud for assistance."
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${CreateControlAccount.AccountId}:root"
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                "aws:PrincipalArn": !Sub "arn:${AWS::Partition}:iam::${CreateControlAccount.AccountId}:role/BlocksAIControlLambdaRole"
      Policies:
        - PolicyName: BlocksAIControlAttachOwnPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - organizations:AttachPolicy
                  - organizations:DetachPolicy
                Resource:
                  - !GetAtt KillSwitchPolicy.Arn
                  - !Sub "arn:${AWS::Partition}:organizations::${AWS::AccountId}:root/o-*/r-*"
                  - !Sub "arn:${AWS::Partition}:organizations::${AWS::AccountId}:ou/o-*/ou-*"
                  - !Sub "arn:${AWS::Partition}:organizations::${AWS::AccountId}:account/o-*/*"
              - Effect: Allow
                Action:
                  - organizations:ListRoots
                  - organizations:ListOrganizationalUnitsForParent
                  - organizations:ListAccountsForParent
                  - organizations:ListAccounts
                  - organizations:ListPoliciesForTarget
                  - organizations:ListPolicies
                  - organizations:DescribePolicy
                  - organizations:DescribeOrganization
                  - organizations:ListTargetsForPolicy
                Resource: "*"
        # The management account is never covered by an SCP. The kill switch blocks Bedrock there with an account-level
        # enforced guardrail that blocks everything, in each region: one guardrail (and version) and one enforced configuration.
        - PolicyName: BlocksAIControlManagementAccountGuardrail
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:CreateGuardrail
                  - bedrock:ListGuardrails
                  - bedrock:ListEnforcedGuardrailsConfiguration
                  - bedrock:PutEnforcedGuardrailConfiguration
                  - bedrock:DeleteEnforcedGuardrailConfiguration
                  - account:ListRegions
                Resource: "*"
              - Effect: Allow
                Action:
                  - bedrock:GetGuardrail
                  - bedrock:CreateGuardrailVersion
                  - bedrock:TagResource
                Resource: !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:guardrail/*"
              - Effect: Allow
                Action: ssm:GetParametersByPath
                Resource: !Sub "arn:${AWS::Partition}:ssm:*::parameter/aws/service/global-infrastructure/services/bedrock/regions"

  ControlAccountStackSet:
    Type: AWS::CloudFormation::StackSet
    Condition: DeployKillSwitch
    # Deleted before the lifecycle resource, so no kill switch can attach while the stack detaches on delete.
    DependsOn: KillSwitchPolicyLifecycle
    Properties:
      StackSetName: "BlocksAIControl-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      Description: "Blocks AI Control kill switch Lambda and invoke role in the control account. Email support@blocks.cloud for assistance."
      PermissionModel: SERVICE_MANAGED
      CallAs: SELF
      AutoDeployment:
        Enabled: false
      Capabilities:
        - CAPABILITY_NAMED_IAM
      OperationPreferences:
        FailureToleranceCount: 0
        MaxConcurrentCount: 1
      Parameters:
        - ParameterKey: BlocksAccountId
          ParameterValue: "{{BLOCKS_ACCOUNT_ID}}"
        - ParameterKey: ExternalId
          ParameterValue: "{{EXTERNAL_ID}}"
        - ParameterKey: ExecutorRoleName
          ParameterValue: !FindInMap [TemplateConfig, Constants, ExecutorRoleName]
        - ParameterKey: PolicyRoleArn
          ParameterValue: !GetAtt KillSwitchPolicyRole.Arn
        - ParameterKey: PolicyId
          ParameterValue: !Ref KillSwitchPolicy
        - ParameterKey: ManagementAccountId
          ParameterValue: !Ref AWS::AccountId
        - ParameterKey: GuardrailName
          ParameterValue: "BlocksAIControlBlockAll-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
        - ParameterKey: TemplateVersion
          ParameterValue: !FindInMap [TemplateConfig, Constants, Version]
      StackInstancesGroup:
        - DeploymentTargets:
            OrganizationalUnitIds:
              - !Ref BlocksAIControlOU
            Accounts:
              - !GetAtt CreateControlAccount.AccountId
            AccountFilterType: INTERSECTION
          Regions:
            - us-east-1
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud
      TemplateBody: |
        AWSTemplateFormatVersion: "2010-09-09"
        Description: "Blocks AI Control kill switch in the control account. Deployed and removed by the Blocks AI Control stack in your management account. Email support@blocks.cloud for assistance."
        Parameters:
          BlocksAccountId:
            Type: String
            AllowedPattern: "^[0-9]{12}$"
          ExternalId:
            Type: String
            MinLength: 1
            NoEcho: true
          ExecutorRoleName:
            Type: String
            AllowedPattern: "^[A-Za-z0-9+=,.@_-]{1,64}$"
          PolicyRoleArn:
            Type: String
          PolicyId:
            Type: String
            AllowedPattern: "^p-[0-9a-z]{8,128}$"
          ManagementAccountId:
            Type: String
            AllowedPattern: "^[0-9]{12}$"
          GuardrailName:
            Type: String
            Default: ""
            AllowedPattern: "^[0-9A-Za-z_-]{0,50}$"
          TemplateVersion:
            Type: String
        Resources:
          KillSwitchLogGroup:
            Type: AWS::Logs::LogGroup
            Properties:
              LogGroupName: /aws/lambda/BlocksAIControlKillSwitch
              RetentionInDays: 365
          KillSwitchLambdaRole:
            Type: AWS::IAM::Role
            Properties:
              RoleName: BlocksAIControlLambdaRole
              Description: "Execution role of the Blocks AI Control kill switch. It can only assume the policy role in your management account."
              Tags:
                - Key: OwnedBy
                  Value: Blocks.cloud
              AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: Allow
                    Principal:
                      Service: lambda.amazonaws.com
                    Action: sts:AssumeRole
              Policies:
                - PolicyName: BlocksAIControlKillSwitch
                  PolicyDocument:
                    Version: "2012-10-17"
                    Statement:
                      - Effect: Allow
                        Action: sts:AssumeRole
                        Resource: !Ref PolicyRoleArn
                      - Effect: Allow
                        Action:
                          - logs:CreateLogStream
                          - logs:PutLogEvents
                        Resource: !GetAtt KillSwitchLogGroup.Arn
          KillSwitchFunction:
            Type: AWS::Lambda::Function
            Properties:
              FunctionName: BlocksAIControlKillSwitch
              Description: "Attaches or detaches the Blocks AI Control deny-Bedrock SCP and the account-level Bedrock block in the management account. Actions: engage, release, dry_run."
              Runtime: python3.13
              Architectures: [arm64]
              Handler: index.handler
              Timeout: 300
              MemorySize: 256
              Role: !GetAtt KillSwitchLambdaRole.Arn
              LoggingConfig:
                LogGroup: !Ref KillSwitchLogGroup
              Environment:
                Variables:
                  POLICY_ROLE_ARN: !Ref PolicyRoleArn
                  POLICY_ID: !Ref PolicyId
                  MANAGEMENT_ACCOUNT_ID: !Ref ManagementAccountId
                  GUARDRAIL_NAME: !Ref GuardrailName
                  TEMPLATE_VERSION: !Ref TemplateVersion
              Code:
                ZipFile: |
                  import json
                  import os
                  import re
                  import threading
                  import time
                  import urllib.error
                  import urllib.request
                  from concurrent.futures import ThreadPoolExecutor, wait

                  import boto3
                  from botocore.auth import SigV4Auth
                  from botocore.awsrequest import AWSRequest
                  from botocore.config import Config
                  from botocore.credentials import Credentials
                  from botocore.exceptions import BotoCoreError, ClientError

                  SCHEMA_VERSIONS = (1,)
                  ACTIONS = ("engage", "release", "dry_run")
                  SCP_LIMIT = 10  # direct SCP attachments per root, OU or account (D32)
                  PACE_SECONDS = 0.5  # AttachPolicy and DetachPolicy: at most 2 calls per second
                  MAX_TARGETS = 50
                  TARGET_RE = re.compile(r"^(r-[0-9a-z]{4,32}|ou-[0-9a-z]{4,32}-[a-z0-9]{8,32}|[0-9]{12})$")
                  DENIED = {"bedrock:*", "bedrock-mantle:*"}
                  RETRIES = Config(retries={"mode": "standard", "max_attempts": 10})


                  class InputError(ValueError):
                      pass


                  def parse(event):
                      """Validate the request. The policy id never comes from the request, only from the stack."""
                      if not isinstance(event, dict):
                          raise InputError("the request must be a JSON object")
                      if event.get("schema_version") not in SCHEMA_VERSIONS:
                          raise InputError(f"unsupported schema_version {event.get('schema_version')!r}")
                      action = event.get("action")
                      if action not in ACTIONS:
                          raise InputError(f"unknown action {action!r}")
                      targets = event.get("targets") or []
                      if not isinstance(targets, list) or len(targets) > MAX_TARGETS:
                          raise InputError(f"targets must be a list of at most {MAX_TARGETS} ids")
                      if not all(isinstance(t, str) and TARGET_RE.match(t) for t in targets):
                          raise InputError("each target must be a root, OU or account id")
                      if action == "engage" and not targets:
                          raise InputError("engage needs at least one target")
                      return action, list(dict.fromkeys(targets)), str(event.get("request_id") or "")[:128]


                  def policy_role_credentials():
                      """Credentials of the policy role in the management account (the one hop this Lambda makes)."""
                      sts = boto3.client("sts", region_name="us-east-1")
                      return sts.assume_role(RoleArn=os.environ["POLICY_ROLE_ARN"], RoleSessionName="BlocksAIControlKillSwitch")["Credentials"]


                  def org_client():
                      """Organizations client on the policy role."""
                      c = policy_role_credentials()
                      return boto3.client("organizations", region_name="us-east-1", config=RETRIES, aws_access_key_id=c["AccessKeyId"],
                                          aws_secret_access_key=c["SecretAccessKey"], aws_session_token=c["SessionToken"])


                  def pages(o, op, key, **kw):
                      for page in o.get_paginator(op).paginate(**kw):
                          yield from page[key]


                  def snapshot(o):
                      """Root, OUs and accounts with ids, names and parents. Names go back to Blocks, never to the logs."""
                      root = o.list_roots()["Roots"][0]
                      ous, accounts, todo = [], [], [root["Id"]]
                      while todo:
                          parent = todo.pop()
                          for ou in pages(o, "list_organizational_units_for_parent", "OrganizationalUnits", ParentId=parent):
                              ous.append({"id": ou["Id"], "name": ou["Name"], "parent": parent})
                              todo.append(ou["Id"])
                          for a in pages(o, "list_accounts_for_parent", "Accounts", ParentId=parent):
                              accounts.append({"id": a["Id"], "name": a["Name"], "status": a["Status"], "parent": parent})
                      return {"root": {"id": root["Id"]}, "ous": ous, "accounts": accounts}


                  def scps_on(o, target):
                      return [p["Id"] for p in pages(o, "list_policies_for_target", "Policies", TargetId=target, Filter="SERVICE_CONTROL_POLICY")]


                  def policy_problem(o, policy_id):
                      """None when the policy is our deny-Bedrock SCP, else the reason."""
                      p = o.describe_policy(PolicyId=policy_id)["Policy"]
                      if p["PolicySummary"]["Type"] != "SERVICE_CONTROL_POLICY":
                          return "not a service control policy"
                      statements = json.loads(p["Content"]).get("Statement", [])
                      statements = statements if isinstance(statements, list) else [statements]
                      for s in statements:
                          actions = s.get("Action", [])
                          actions = {actions} if isinstance(actions, str) else set(actions)
                          if s.get("Effect") == "Deny" and DENIED <= actions and s.get("Resource") == "*" and "Condition" not in s:
                              return None
                      return "the policy no longer denies bedrock:* and bedrock-mantle:* without conditions"


                  def refusals(targets, snap, mgmt, control):
                      """Targets this Lambda will not touch, with the reason. Everything else is in the Organization."""
                      known = {snap["root"]["id"]} | {u["id"] for u in snap["ous"]} | {a["id"] for a in snap["accounts"]}
                      refused = []
                      for t in targets:
                          if t == mgmt:
                              refused.append({"target": t, "reason": "management_account"})
                          elif t == control:
                              refused.append({"target": t, "reason": "control_account"})
                          elif t not in known:
                              refused.append({"target": t, "reason": "not_in_organization"})
                      return refused


                  def change(o, policy_id, targets, attach):
                      """Attach or detach on each target (idempotent), paced, then read back."""
                      results = []
                      for i, t in enumerate(targets):
                          if i:
                              time.sleep(PACE_SECONDS)
                          try:
                              if attach:
                                  o.attach_policy(PolicyId=policy_id, TargetId=t)
                              else:
                                  o.detach_policy(PolicyId=policy_id, TargetId=t)
                          except (ClientError, BotoCoreError) as e:
                              code = code_of(e)
                              if code not in ("DuplicatePolicyAttachmentException", "PolicyNotAttachedException"):
                                  results.append({"target": t, "ok": False, "error": code})
                                  continue
                          try:
                              attached = policy_id in scps_on(o, t)
                          except (ClientError, BotoCoreError) as e:
                              # The change is made; keep reporting it, and the targets before it.
                              results.append({"target": t, "ok": False, "error": "not_verified", "detail": code_of(e)})
                              continue
                          ok = attached == attach
                          results.append({"target": t, "ok": ok, "attached": attached} if ok else
                                         {"target": t, "ok": False, "attached": attached, "error": "not_verified"})
                      return results


                  def dry_run(o, policy_id, targets, snap):
                      """Everything an engage needs, without changing anything."""
                      problem = policy_problem(o, policy_id)
                      checked = []
                      for t in targets or [snap["root"]["id"]]:
                          ids = scps_on(o, t)
                          checked.append({"target": t, "scp_count": len(ids), "headroom": SCP_LIMIT - len(ids), "attached": policy_id in ids})
                      attached_to = [x["TargetId"] for x in pages(o, "list_targets_for_policy", "Targets", PolicyId=policy_id)]
                      ok = problem is None and all(c["headroom"] > 0 or c["attached"] for c in checked)
                      return {"ok": ok, "scp_problem": problem, "targets": checked, "attached_targets": attached_to, "snapshot": snap}


                  def run(action, targets, control):
                      policy_id, mgmt = os.environ["POLICY_ID"], os.environ["MANAGEMENT_ACCOUNT_ID"]
                      try:
                          o = org_client()
                          org = o.describe_organization()["Organization"]
                      except (ClientError, BotoCoreError) as e:
                          return {"ok": False, "error": "assume_or_read_failed", "detail": code_of(e)}
                      if org["MasterAccountId"] != mgmt:
                          return {"ok": False, "error": "management_account_mismatch"}
                      snap = snapshot(o)
                      snap.update({"organization_id": org["Id"], "management_account_id": mgmt, "control_account_id": control})
                      # Detaching can never lock anyone out, so release refuses nothing; engage and dry_run refuse what they must not touch.
                      refused = [] if action == "release" else refusals(targets, snap, mgmt, control)
                      allowed = [t for t in targets if t not in {r["target"] for r in refused}]
                      if action == "dry_run":
                          return {**dry_run(o, policy_id, allowed, snap), "refused": refused}
                      if action == "release" and not targets:
                          allowed = [x["TargetId"] for x in pages(o, "list_targets_for_policy", "Targets", PolicyId=policy_id)]
                      results = change(o, policy_id, allowed, attach=action == "engage")
                      return {"ok": not refused and all(r["ok"] for r in results), "results": results, "refused": refused}


                  GUARD_REGION_RE = re.compile(r"^[a-z]{2}(-[a-z]+)+-[0-9]{1,2}$")
                  CONFIG_PATH = "/enforcedGuardrailsConfiguration"
                  REST_TIMEOUT = 20
                  CLIENT_CONFIG = Config(connect_timeout=5, read_timeout=10, retries={"mode": "standard", "max_attempts": 3})


                  class GuardError(Exception):
                      """A step failed. The message is an error code, never a name, an ARN or a request value."""


                  def code_of(e):
                      if isinstance(e, ClientError):
                          return e.response["Error"]["Code"]
                      return str(e) if isinstance(e, GuardError) else type(e).__name__


                  def creds_client(creds, service, region="us-east-1"):
                      # A new session per call: the default session is not safe to share between threads.
                      return boto3.session.Session().client(service, region_name=region, config=CLIENT_CONFIG, aws_access_key_id=creds["AccessKeyId"],
                                                            aws_secret_access_key=creds["SecretAccessKey"], aws_session_token=creds["SessionToken"])


                  def control_plane(creds, region):
                      """A function (method, path, body=None) that makes SigV4-signed calls to the Bedrock control plane of this region, for the
                      account-level enforcement operations only.
                      Why not boto3: the SDK that Lambda bundles changes with runtime updates and region, and may not know these operations
                      or their current shape (selectiveContentGuarding, modelEnforcement)."""
                      credentials = Credentials(creds["AccessKeyId"], creds["SecretAccessKey"], creds["SessionToken"])

                      def call(method, path, body=None):
                          url = f"https://bedrock.{region}.amazonaws.com{path}"
                          data = json.dumps(body).encode() if body is not None else None
                          req = AWSRequest(method=method, url=url, data=data, headers={"Content-Type": "application/json"} if data else {})
                          SigV4Auth(credentials, "bedrock", region).add_auth(req)
                          try:
                              with urllib.request.urlopen(urllib.request.Request(url, data=data, method=method, headers=dict(req.headers)), timeout=REST_TIMEOUT) as r:
                                  raw = r.read()
                          except urllib.error.HTTPError as e:
                              raise GuardError((e.headers.get("x-amzn-ErrorType") or "").split(":")[0] or f"HTTP{e.code}") from None
                          except (urllib.error.URLError, OSError):
                              raise GuardError("ConnectionError") from None
                          return json.loads(raw) if raw else {}

                      return call


                  def all_items(client, op, key, **kw):
                      for page in client.get_paginator(op).paginate(**kw):
                          yield from page[key]


                  def guard_regions(creds):
                      """Regions to cover: every Bedrock region the SDK or AWS (public SSM parameters) lists that the account has enabled.
                      The union means a Bedrock region that is new to an old SDK is still covered."""
                      known = set(boto3.session.Session().get_available_regions("bedrock"))
                      try:
                          for page in creds_client(creds, "ssm").get_paginator("get_parameters_by_path").paginate(
                                  Path="/aws/service/global-infrastructure/services/bedrock/regions"):
                              known |= {p["Value"] for p in page["Parameters"]}
                      except (ClientError, BotoCoreError):
                          pass  # the SDK list alone still covers every region it knows
                      on = ["ENABLED", "ENABLED_BY_DEFAULT"]
                      enabled = {r["RegionName"] for r in all_items(creds_client(creds, "account"), "list_regions", "Regions", RegionOptStatusContains=on)}
                      return sorted(r for r in known & enabled if GUARD_REGION_RE.match(r))


                  def find_guardrail(bc, name):
                      """The DRAFT summary (id, arn) of the guardrail with this name, or None."""
                      for g in all_items(bc, "list_guardrails", "guardrails"):
                          if g["name"] == name:
                              return g
                      return None


                  def cfg_guardrail_id(cfg):
                      """The guardrail id of an enforced configuration (the id, or the last part of the ARN)."""
                      return cfg.get("guardrailId") or (cfg.get("guardrailArn") or "").rsplit("/", 1)[-1]


                  def owns(cfg, g):
                      """True when this enforced configuration points to our guardrail (g: its summary from list_guardrails, or None)."""
                      return bool(cfg and g and cfg_guardrail_id(cfg) == g["id"])


                  def enforced_config(call):
                      """The account-level enforced configuration of this region, or None. A region can have at most one."""
                      configs = call("GET", CONFIG_PATH).get("guardrailsConfig") or []
                      return configs[0] if configs else None


                  def remove_enforcement(call, cfg):
                      """Delete this enforced configuration. The caller has checked that it points to our guardrail."""
                      if not re.fullmatch(r"[a-z0-9]+", str(cfg.get("configId"))):
                          raise GuardError("InvalidConfigId")
                      call("DELETE", f"{CONFIG_PATH}/{cfg['configId']}")


                  # --- Management account: SCPs never apply there, so an account-level enforced guardrail that blocks everything does the job ---
                  GUARD_BUDGET_SECONDS = 100  # from the start of the request: the executor waits about 150 s for the answer
                  GUARD_GRACE_SECONDS = 12  # a call in flight is bounded by the client timeouts
                  GUARD_POLL_SECONDS = 2
                  MAX_REGION_WORKERS = 12
                  BLOCK_ALL_PATTERN = "[\\s\\S]"
                  BLOCKED_MESSAGE = "Blocked by the Blocks AI Control kill switch."
                  COMPREHENSIVE = {"system": "COMPREHENSIVE", "messages": "COMPREHENSIVE"}
                  ALL_MODELS = {"includedModels": ["ALL"], "excludedModels": []}


                  class Budget:
                      """The time left for the regions, and a flag that stops a thread that is still running after the answer was sent
                      (it would otherwise resume in the next invocation and change something the platform no longer expects)."""

                      def __init__(self, deadline):
                          self.deadline, self.cancel = deadline, threading.Event()


                  def check_time(budget):
                      """Called before every write."""
                      if budget.cancel.is_set() or time.monotonic() > budget.deadline:
                          raise GuardError("timeout")


                  def blocks_everything(g):
                      """True when this guardrail version still blocks all input and output (a regex that matches any text, action BLOCK)."""
                      for r in (g.get("sensitiveInformationPolicy") or {}).get("regexes", []):
                          both = all(r.get(k, r.get("action")) == "BLOCK" for k in ("inputAction", "outputAction"))
                          if r.get("pattern") == BLOCK_ALL_PATTERN and both and r.get("inputEnabled", True) and r.get("outputEnabled", True):
                              return True
                      return False


                  def wait_ready(bc, gid, version, budget):
                      while True:
                          g = bc.get_guardrail(guardrailIdentifier=gid, guardrailVersion=version)
                          if g["status"] == "READY":
                              return g
                          if g["status"] not in ("CREATING", "UPDATING", "VERSIONING"):
                              raise GuardError(f"guardrail_{g['status'].lower()}")
                          check_time(budget)
                          time.sleep(GUARD_POLL_SECONDS)


                  def newest_version(bc, gid):
                      numbers = [int(v["version"]) for v in all_items(bc, "list_guardrails", "guardrails", guardrailIdentifier=gid) if v["version"].isdigit()]
                      return str(max(numbers)) if numbers else None


                  def ensure_guardrail(bc, name, budget, g):
                      """(guardrail id, newest numeric version that blocks everything). Creates the guardrail and the version when missing.
                      g is the summary of the existing guardrail, or None."""
                      if g is None:
                          check_time(budget)
                          g = bc.create_guardrail(
                              name=name, description="Blocks AI Control kill switch: blocks all Bedrock input and output while enforced.",
                              sensitiveInformationPolicyConfig={"regexesConfig": [{"name": "block-everything", "description": "Matches any text",
                                                                                   "pattern": BLOCK_ALL_PATTERN, "action": "BLOCK"}]},
                              blockedInputMessaging=BLOCKED_MESSAGE, blockedOutputsMessaging=BLOCKED_MESSAGE, tags=[{"key": "OwnedBy", "value": "Blocks.cloud"}])
                          gid = g["guardrailId"]
                      else:
                          gid = g["id"]
                      newest = newest_version(bc, gid)
                      if newest and blocks_everything(wait_ready(bc, gid, newest, budget)):
                          return gid, newest
                      if not blocks_everything(wait_ready(bc, gid, "DRAFT", budget)):
                          raise GuardError("guardrail_changed")  # we cannot update it (no permission): refuse rather than enforce something weaker
                      check_time(budget)
                      version = bc.create_guardrail_version(guardrailIdentifier=gid, description="Blocks AI Control kill switch")["version"]
                      if not blocks_everything(wait_ready(bc, gid, version, budget)):
                          raise GuardError("guardrail_changed")
                      return gid, version


                  def is_current(cfg, gid, version):
                      models = cfg.get("modelEnforcement") or {}
                      return (cfg_guardrail_id(cfg) == gid and cfg.get("guardrailVersion") == version and cfg.get("selectiveContentGuarding") == COMPREHENSIVE
                              and models.get("includedModels") == ["ALL"] and not models.get("excludedModels"))


                  def engage_region(creds, region, name, budget):
                      bc, call = creds_client(creds, "bedrock", region), control_plane(creds, region)
                      g, cfg = find_guardrail(bc, name), enforced_config(call)
                      if cfg and not owns(cfg, g):
                          # The customer's own configuration: never overwritten. Checked first, so nothing is created that cannot be enforced.
                          return {"region": region, "ok": False, "enforced": False, "conflict": True}
                      gid, version = ensure_guardrail(bc, name, budget, g)
                      changed = not (cfg and is_current(cfg, gid, version))
                      if changed:
                          check_time(budget)
                          body = {"guardrailInferenceConfig": {"guardrailIdentifier": gid, "guardrailVersion": version,
                                                               "selectiveContentGuarding": COMPREHENSIVE, "modelEnforcement": ALL_MODELS}}
                          if cfg:
                              body["configId"] = cfg["configId"]
                          call("PUT", CONFIG_PATH, body)
                          now = enforced_config(call)
                          if not (now and is_current(now, gid, version)):
                              raise GuardError("not_verified")
                      return {"region": region, "ok": True, "enforced": True, "changed": changed, "guardrail_id": gid, "guardrail_version": version}


                  def release_region(creds, region, name, budget):
                      """Delete our enforced configuration only. The guardrail stays (a later engage reuses it)."""
                      g, call = find_guardrail(creds_client(creds, "bedrock", region), name), control_plane(creds, region)
                      cfg = enforced_config(call)
                      ours = owns(cfg, g)
                      if ours:
                          check_time(budget)
                          remove_enforcement(call, cfg)
                          if owns(enforced_config(call), g):
                              raise GuardError("not_verified")
                      return {"region": region, "ok": True, "enforced": False, "changed": ours, "other_config": bool(cfg) and not ours}


                  def dry_run_region(creds, region, name, budget):
                      """Changes nothing: is our guardrail there, is it enforced, is something else enforced."""
                      bc = creds_client(creds, "bedrock", region)
                      g, cfg = find_guardrail(bc, name), enforced_config(control_plane(creds, region))
                      ours = owns(cfg, g)
                      newest = newest_version(bc, g["id"]) if g else None
                      ready = bool(newest and blocks_everything(bc.get_guardrail(guardrailIdentifier=g["id"], guardrailVersion=newest)))
                      conflict = bool(cfg) and not ours
                      out = {"region": region, "ok": not conflict, "guardrail": bool(g), "guardrail_ready": ready, "enforced": ours, "conflict": conflict}
                      if ours:
                          out["enforced_version"] = cfg.get("guardrailVersion")
                      return out


                  GUARD_TASKS = {"engage": engage_region, "release": release_region, "dry_run": dry_run_region}


                  def run_region(creds, action, region, name, budget):
                      try:
                          return GUARD_TASKS[action](creds, region, name, budget)
                      except Exception as e:  # one region must never take the answer down
                          return {"region": region, "ok": False, "error": code_of(e)}


                  def guard_run(creds, action, name, deadline):
                      budget, pool = Budget(deadline), ThreadPoolExecutor(max_workers=MAX_REGION_WORKERS)
                      futures = {pool.submit(run_region, creds, action, region, name, budget): region for region in guard_regions(creds)}
                      done, late = wait(futures, timeout=max(0, deadline - time.monotonic()) + GUARD_GRACE_SECONDS)
                      budget.cancel.set()
                      pool.shutdown(wait=False, cancel_futures=True)
                      results = [f.result() for f in done] + [{"region": futures[f], "ok": False, "error": "timeout"} for f in late]
                      results.sort(key=lambda r: r["region"])
                      errors = {}
                      for r in results:
                          if r.get("error"):
                              errors[r["error"]] = errors.get(r["error"], 0) + 1
                      return {"ok": all(r["ok"] for r in results), "regions": results, "enforced_regions": sum(1 for r in results if r.get("enforced")),
                              "conflicts": [r["region"] for r in results if r.get("conflict")], "errors": errors}


                  def management_guard(action, started):
                      """The management account part of an answer. Needs the policy role; an empty name means an older stack instance.
                      started: time.monotonic() at the start of the request, so the SCP part counts against the budget."""
                      name = os.environ.get("GUARDRAIL_NAME", "")
                      if not name:
                          return {"enabled": False}
                      try:
                          return {"enabled": True, **guard_run(policy_role_credentials(), action, name, started + GUARD_BUDGET_SECONDS)}
                      except Exception as e:  # the SCP part of the answer must still go out
                          return {"enabled": True, "ok": False, "error": "management_account_failed", "detail": code_of(e)}


                  def handler(event, ctx):
                      t0, started = time.time(), time.monotonic()
                      control = ctx.invoked_function_arn.split(":")[4]
                      try:
                          action, targets, request_id = parse(event)
                      except InputError as e:
                          return {"schema_version": 1, "ok": False, "error": "invalid_input", "detail": str(e)}
                      try:
                          out = run(action, targets, control)
                      except (ClientError, BotoCoreError) as e:
                          # Throttling, a missing permission or a connection error mid-run: still an answer the executor can read.
                          out = {"ok": False, "error": "organizations_call_failed", "detail": code_of(e)}
                      if out.get("error") != "management_account_mismatch":
                          out["management_account"] = management_guard(action, started)
                      out.update({"schema_version": 1, "action": action, "request_id": request_id, "policy_id": os.environ["POLICY_ID"],
                                  "template_version": os.environ.get("TEMPLATE_VERSION", ""), "duration_ms": int((time.time() - t0) * 1000)})
                      # Ids, regions and counts only in the log: no account, OU or guardrail names.
                      m = out.get("management_account", {})
                      print(json.dumps({"request_id": request_id, "action": action, "ok": out["ok"], "error": out.get("error"),
                                        "targets": targets, "refused": out.get("refused"), "duration_ms": out["duration_ms"],
                                        "management_account": {k: m.get(k) for k in ("enabled", "ok", "error", "detail", "enforced_regions", "conflicts", "errors")}}))
                      return out
          InvokeRole:
            Type: AWS::IAM::Role
            Properties:
              RoleName: BlocksAIControlInvokeRole
              Description: "Lets the Blocks platform invoke the AI Control kill switch, and nothing else."
              Tags:
                - Key: OwnedBy
                  Value: Blocks.cloud
              AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: Allow
                    Principal:
                      AWS: !Sub "arn:${AWS::Partition}:iam::${BlocksAccountId}:root"
                    Action: sts:AssumeRole
                    Condition:
                      StringEquals:
                        "sts:ExternalId": !Ref ExternalId
                      ArnEquals:
                        "aws:PrincipalArn": !Sub "arn:${AWS::Partition}:iam::${BlocksAccountId}:role/${ExecutorRoleName}"
                  - Effect: Allow
                    Principal:
                      AWS: !Sub "arn:${AWS::Partition}:iam::${BlocksAccountId}:root"
                    Action: sts:TagSession
                    Condition:
                      ArnEquals:
                        "aws:PrincipalArn": !Sub "arn:${AWS::Partition}:iam::${BlocksAccountId}:role/${ExecutorRoleName}"
              Policies:
                - PolicyName: BlocksAIControlInvoke
                  PolicyDocument:
                    Version: "2012-10-17"
                    Statement:
                      - Effect: Allow
                        Action: lambda:InvokeFunction
                        Resource: !GetAtt KillSwitchFunction.Arn
                      - Effect: Allow
                        Action: organizations:DescribeOrganization
                        Resource: "*"
        Outputs:
          KillSwitchFunctionArn:
            Value: !GetAtt KillSwitchFunction.Arn
          InvokeRoleArn:
            Value: !GetAtt InvokeRole.Arn

  # ---------------------------------------------------------------------------
  # Pingback to Blocks (own queue, D13-D15, D18)
  # ---------------------------------------------------------------------------
  BlocksAIControlNotifierRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "BlocksAIControlNotifierRole-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      Description: "Used by Blocks.cloud to notify about AI Control deployment events. Must remain in place. Email support@blocks.cloud for assistance."
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud
        - Key: Purpose
          Value: EventNotification
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendToBlocksSQS
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: "arn:aws:sqs:us-east-1:{{BLOCKS_ACCOUNT_ID}}:Blocks-AIControl-Queue"

  NotifyBlocksAIControl:
    Type: AWS::Events::Rule
    Properties:
      Name: "NotifyBlocksAIControl-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      Description: "Notifies Blocks when this AI Control stack changes state"
      EventPattern:
        source:
          - "aws.cloudformation"
        detail-type:
          - "CloudFormation Stack Status Change"
        detail:
          stack-id:
            - prefix: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/"
      Targets:
        - Arn: "arn:aws:sqs:us-east-1:{{BLOCKS_ACCOUNT_ID}}:Blocks-AIControl-Queue"
          Id: "BlocksAIControlQueue"
          RoleArn: !GetAtt BlocksAIControlNotifierRole.Arn
          InputTransformer:
            InputPathsMap:
              account: "$.account"
              region: "$.region"
              time: "$.time"
              stackId: "$.detail.stack-id"
              statusDetails: "$.detail.status-details"
            InputTemplate: !Sub
              - |
                {
                  "source": "aws.cloudformation",
                  "account": <account>,
                  "region": <region>,
                  "time": <time>,
                  "stackId": <stackId>,
                  "statusDetails": <statusDetails>,
                  "service": "ai_control",
                  "templateVersion": "${TemplateVersion}",
                  "customerResourceId": "{{BLOCKS_CUSTOMER_RESOURCE_ID}}",
                  "externalId": "{{EXTERNAL_ID}}",
                  "controlAccountId": "${CreateControlAccount.AccountId}",
                  "controlAccountError": "${CreateControlAccount.AccountError}",
                  "policyId": "${KillSwitchPolicy}",
                  "organizationalUnitId": "${BlocksAIControlOU}",
                  "policyRoleArn": "${PolicyRoleArn}",
                  "invokeRoleArn": "${InvokeRoleArn}",
                  "killLambdaArn": "${KillLambdaArn}"
                }
              - TemplateVersion: !FindInMap [TemplateConfig, Constants, Version]
                PolicyRoleArn: !If [DeployKillSwitch, !GetAtt KillSwitchPolicyRole.Arn, ""]
                InvokeRoleArn: !If
                  - DeployKillSwitch
                  - !Sub "arn:${AWS::Partition}:iam::${CreateControlAccount.AccountId}:role/BlocksAIControlInvokeRole"
                  - ""
                KillLambdaArn: !If
                  - DeployKillSwitch
                  - !Sub "arn:${AWS::Partition}:lambda:us-east-1:${CreateControlAccount.AccountId}:function:BlocksAIControlKillSwitch"
                  - ""

Outputs:
  ControlAccountId:
    Value: !GetAtt CreateControlAccount.AccountId
  ControlAccountError:
    Value: !GetAtt CreateControlAccount.AccountError
  PolicyId:
    Value: !Ref KillSwitchPolicy
  OrganizationalUnitId:
    Value: !Ref BlocksAIControlOU
  RootScpCount:
    Value: !GetAtt OrgInfo.RootScpCount
  TemplateVersion:
    Value: !FindInMap [TemplateConfig, Constants, Version]
  PolicyRoleArn:
    Condition: DeployKillSwitch
    Value: !GetAtt KillSwitchPolicyRole.Arn
  ControlAccountStackSetId:
    Condition: DeployKillSwitch
    Value: !Ref ControlAccountStackSet
  InvokeRoleArn:
    Condition: DeployKillSwitch
    Value: !Sub "arn:${AWS::Partition}:iam::${CreateControlAccount.AccountId}:role/BlocksAIControlInvokeRole"
  KillSwitchFunctionArn:
    Condition: DeployKillSwitch
    Value: !Sub "arn:${AWS::Partition}:lambda:us-east-1:${CreateControlAccount.AccountId}:function:BlocksAIControlKillSwitch"
