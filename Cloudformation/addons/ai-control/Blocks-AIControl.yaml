                    Effect: Allow
                    Principal:
                      AWS: "*"
                    Action:
                      - kms:Decrypt
                      - kms:Encrypt
                      - kms:GenerateDataKey
                    Resource: "*"
                    Condition:
                      StringEquals:
                        "kms:CallerAccount": !Ref AWS::AccountId
