                      ArnEquals:
                        "aws:PrincipalArn": !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/BlocksAIControlProviderAnthropicRole"
                  - Sid: ProviderRolesDescribeKey
                    Effect: Allow
                    Principal:
                      AWS: "*"
                    Action: kms:DescribeKey
                    Resource: "*"
                    Condition:
                      StringEquals:
                        "kms:CallerAccount": !Ref AWS::AccountId
                      ArnEquals:
                        "aws:PrincipalArn": !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/BlocksAIControlProviderAnthropicRole"
