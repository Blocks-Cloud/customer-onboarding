          # Stack delete: the secrets go before the key and the role (this resource depends on both). Create and Update do nothing.
          ProviderSecretsCleanup:
            Type: Custom::BlocksAIControlProviderSecretsCleanup
            Condition: AnthropicEnabled
            DependsOn:
