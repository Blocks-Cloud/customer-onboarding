        detail-type:
          - "CloudFormation Stack Status Change"
        detail:
          stack-id:
            - prefix: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/"
      Targets:
        - Arn: "arn:aws:sqs:us-east-1:{{BLOCKS_ACCOUNT_ID}}:Blocks-AIControl-Queue"
          Id: "BlocksAIControlQueue"
          RoleArn: !GetAtt BlocksAIControlNotifierRole.Arn
          InputTransformer:
            InputPathsMap:
              account: "$.account"
              region: "$.region"
              time: "$.time"
              stackId: "$.detail.stack-id"
              statusDetails: "$.detail.status-details"
            InputTemplate: !Sub
              - |
                {
                  "source": "aws.cloudformation",
                  "account": <account>,
                  "region": <region>,
                  "time": <time>,
                  "stackId": <stackId>,
                  "statusDetails": <statusDetails>,
                  "service": "ai_control",
                  "templateVersion": "${TemplateVersion}",
                  "customerResourceId": "{{BLOCKS_CUSTOMER_RESOURCE_ID}}",
                  "externalId": "{{EXTERNAL_ID}}",
                  "controlAccountId": "${CreateControlAccount.AccountId}",
                  "controlAccountError": "${CreateControlAccount.AccountError}",
                  "policyId": "${KillSwitchPolicy}",
                  "organizationalUnitId": "${BlocksAIControlOU}",
                  "policyRoleArn": "${PolicyRoleArn}",
                  "invokeRoleArn": "${InvokeRoleArn}",
                  "killLambdaArn": "${KillLambdaArn}"
                }
              - TemplateVersion: !FindInMap [TemplateConfig, Constants, Version]
                PolicyRoleArn: !If [DeployKillSwitch, !GetAtt KillSwitchPolicyRole.Arn, ""]
                InvokeRoleArn: !If
                  - DeployKillSwitch
                  - !Sub "arn:${AWS::Partition}:iam::${CreateControlAccount.AccountId}:role/BlocksAIControlInvokeRole"
                  - ""
                KillLambdaArn: !If
                  - DeployKillSwitch
                  - !Sub "arn:${AWS::Partition}:lambda:us-east-1:${CreateControlAccount.AccountId}:function:BlocksAIControlKillSwitch"
                  - ""

Outputs:
  ControlAccountId:
    Value: !GetAtt CreateControlAccount.AccountId
  ControlAccountError:
    Value: !GetAtt CreateControlAccount.AccountError
  PolicyId:
    Value: !Ref KillSwitchPolicy
  OrganizationalUnitId:
    Value: !Ref BlocksAIControlOU
  RootScpCount:
    Value: !GetAtt OrgInfo.RootScpCount
  TemplateVersion:
    Value: !FindInMap [TemplateConfig, Constants, Version]
  PolicyRoleArn:
    Condition: DeployKillSwitch
    Value: !GetAtt KillSwitchPolicyRole.Arn
  ControlAccountStackSetId:
    Condition: DeployKillSwitch
    Value: !Ref ControlAccountStackSet
  InvokeRoleArn:
    Condition: DeployKillSwitch
    Value: !Sub "arn:${AWS::Partition}:iam::${CreateControlAccount.AccountId}:role/BlocksAIControlInvokeRole"
  KillSwitchFunctionArn:
    Condition: DeployKillSwitch
    Value: !Sub "arn:${AWS::Partition}:lambda:us-east-1:${CreateControlAccount.AccountId}:function:BlocksAIControlKillSwitch"
