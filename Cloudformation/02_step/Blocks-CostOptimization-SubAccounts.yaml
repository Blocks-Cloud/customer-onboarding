AWSTemplateFormatVersion: "2010-09-09"
Description: >
  This template creates a cross-account execution role for Blocks to perform cost optimization actions
  within a sub-account. It grants permissions to purchase Reserved Instances, manage budgets and alarms,
  and read configuration data across compute, storage, database, and monitoring services.

Metadata:
  TemplateVersion: "0.1.11"
  LastUpdated: "2026-01-08"

Parameters:
  BlocksCustomerId:
    Type: String
    Description: "Unique customer identifier provided by Blocks"
    AllowedPattern: "^[a-zA-Z0-9-_]+$"
    ConstraintDescription: "Must contain only alphanumeric characters, hyphens, and underscores"

  BlocksAccountId:
    Type: String
    Description: "Blocks AWS account ID for cross-account access"
    AllowedPattern: "^[0-9]{12}$"
    ConstraintDescription: "Must be a valid 12-digit AWS account ID"

  ExternalId:
    Type: String
    Description: "External ID for secure cross-account role assumption"
    NoEcho: true

Resources:
  # IAM Policy: Base Read Permissions (Shared by all Blocks roles)
  # Common read-only permissions for Cost Explorer, CloudWatch, and Pricing APIs
  BlocksBaseReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "BlocksBaseReadPolicy-${BlocksCustomerId}"
      Description: "Shared read-only permissions for all Blocks roles - Cost Explorer, CloudWatch, Pricing. Must remain in place for Blocks to function correctly."
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Cost Explorer - Read access
          # Services: Cost Explorer
          - Sid: CostExplorerRead
            Effect: Allow
            Action:
              - ce:Get*
              - ce:List*
              - ce:Describe*
            Resource: "*"

          # Cost Optimization Hub - Full read access
          # Services: Cost Optimization Hub
          - Sid: CostOptimizationHubRead
            Effect: Allow
            Action:
              - cost-optimization-hub:Get*
              - cost-optimization-hub:List*
            Resource: "*"

          # Pricing API - Full read access
          # Services: Pricing
          - Sid: PricingRead
            Effect: Allow
            Action:
              - pricing:Get*
              - pricing:DescribeServices
              - pricing:ListPriceLists
            Resource: "*"

          # CloudWatch - Full read access
          # Services: CloudWatch
          - Sid: CloudWatchRead
            Effect: Allow
            Action:
              - cloudwatch:Describe*
              - cloudwatch:Get*
              - cloudwatch:List*
            Resource: "*"

          # CloudWatch Logs - Basic read access
          # Services: CloudWatch Logs
          - Sid: CloudWatchLogsRead
            Effect: Allow
            Action:
              - logs:Describe*
              - logs:List*
            Resource: "*"

          # IAM Policy Simulation - Read access
          # Services: IAM
          - Sid: IamPolicySimulationRead
            Effect: Allow
            Action:
              - iam:SimulatePrincipalPolicy
            Resource: "*"

  BlocksCostOptimizationWritePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "BlocksCostOptimizationWritePolicy-${BlocksCustomerId}"
      Description: "Used by Blocks.cloud. Must remain in place for Blocks to function correctly. Email support@blocks.cloud for assistance. Grants execution permissions for cost optimization actions including purchasing Savings Plans, RIs, and managing accounts."
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Reserved Instance Purchases
          # Allows Blocks to purchase, modify, and exchange Reserved Instances
          # across AWS services to optimize costs based on your usage patterns
          # Services: EC2, RDS, ElastiCache, Redshift, OpenSearch, MemoryDB
          - Sid: SavingsPlansAndRIsWrite
            Effect: Allow
            Action:
              # EC2 Reserved Instances
              - ec2:PurchaseReservedInstancesOffering
              - ec2:ModifyReservedInstances
              - ec2:AcceptReservedInstancesExchangeQuote
              - ec2:DeleteQueuedReservedInstances
              # RDS Reserved Instances
              - rds:PurchaseReservedDBInstancesOffering
              # ElastiCache Reserved Nodes
              - elasticache:PurchaseReservedCacheNodesOffering
              # Redshift Reserved Nodes
              - redshift:PurchaseReservedNodeOffering
              # OpenSearch Reserved Instances
              - es:PurchaseReservedInstanceOffering
              # MemoryDB Reserved Nodes
              - memorydb:PurchaseReservedNodesOffering
            Resource: "*"

          # Governance & Monitoring
          # Services: Budgets, Cost Explorer, Billing, Account, Service Quotas
          - Sid: GovernanceWrite
            Effect: Allow
            Action:
              - budgets:*
              - ce:UpdateCostAllocationTagsStatus
              - ce:CreateAnomalyMonitor
              - ce:CreateAnomalySubscription
              - ce:UpdateAnomalyMonitor
              - ce:UpdateAnomalySubscription
              - servicequotas:RequestServiceQuotaIncrease
              - servicequotas:GetServiceQuota
              - servicequotas:ListServiceQuotas
              - servicequotas:GetRequestedServiceQuotaChange
              - servicequotas:ListRequestedServiceQuotaChangeHistory
              - servicequotas:GetAWSDefaultServiceQuota
              - servicequotas:ListAWSDefaultServiceQuotas
            Resource: "*"

          # Service Quotas Service-Linked Role
          # Required for Service Quotas to function
          # Services: IAM
          - Sid: ServiceQuotasServiceLinkedRole
            Effect: Allow
            Action:
              - iam:CreateServiceLinkedRole
            Resource: "arn:aws:iam::*:role/aws-service-role/servicequotas.amazonaws.com/*"
            Condition:
              StringEquals:
                "iam:AWSServiceName": "servicequotas.amazonaws.com"

          # SNS Write for Anomaly Detection Subscriptions
          # Services: SNS
          - Sid: SNSAnomalyDetectionSubscriptionsWrite
            Effect: Allow
            Action:
              - sns:*
            Resource: !Sub "arn:${AWS::Partition}:sns:*:${AWS::AccountId}:Blocks*"

          # CloudWatch Write for Alarms
          # Services: CloudWatch
          - Sid: CloudWatchWrite
            Effect: Allow
            Action:
              - cloudwatch:PutMetricAlarm
              - cloudwatch:DeleteAlarms
              - cloudwatch:EnableAlarmActions
              - cloudwatch:DisableAlarmActions
            Resource: !Sub "arn:${AWS::Partition}:cloudwatch:*:${AWS::AccountId}:alarm:Blocks-*"

          # EventBridge Management
          # Services: EventBridge
          - Sid: EventBridgeWrite
            Effect: Allow
            Action:
              - events:PutRule
              - events:PutTargets
              - events:DeleteRule
              - events:RemoveTargets
              - events:CreateEventBus
              - events:DeleteEventBus
              - events:PutEvents
            Resource:
              - !Sub "arn:${AWS::Partition}:events:*:*:rule/Blocks*"
              - !Sub "arn:${AWS::Partition}:events:*:*:event-bus/Blocks*"

          # Compute Optimizer
          # Services: Compute Optimizer
          - Sid: ComputeOptimizerWrite
            Effect: Allow
            Action:
              - compute-optimizer:*
            Resource: "*"

          # Cost Optimization Hub Opt-In
          # Services: IAM, Cost Optimization Hub
          - Sid: CostOptimizationHubOptIn
            Effect: Allow
            Action:
              - iam:CreateServiceLinkedRole
            Resource: "arn:aws:iam::*:role/aws-service-role/cost-optimization-hub.bcm.amazonaws.com/AWSServiceRoleForCostOptimizationHub"
            Condition:
              StringLike:
                "iam:AWSServiceName": "cost-optimization-hub.bcm.amazonaws.com"
          - Sid: CostOptimizationHubPolicy
            Effect: Allow
            Action:
              - iam:PutRolePolicy
            Resource: "arn:aws:iam::*:role/aws-service-role/cost-optimization-hub.bcm.amazonaws.com/AWSServiceRoleForCostOptimizationHub"
          - Sid: CostOptimizationHubUpdateStatus
            Effect: Allow
            Action:
              - cost-optimization-hub:UpdateEnrollmentStatus
            Resource: "*"

  BlocksCostOptimizationReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "BlocksCostOptimizationReadPolicy-${BlocksCustomerId}"
      Description: "Used by Blocks.cloud. Must remain in place for Blocks to function correctly. Email support@blocks.cloud for assistance. Read-only access to configuration and usage data across compute, storage, database, and monitoring services for savings analysis."
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Cost Explorer extras (beyond base policy)
          # Services: Cost Explorer
          - Sid: CostExplorerExtras
            Effect: Allow
            Action:
              - ce:StartCommitmentPurchaseAnalysis
              - ce:StartSavingsPlansPurchaseRecommendationGeneration
            Resource: "*"

          # Invoicing - Read access for invoice profiles and summaries
          # Services: AWS Invoicing
          - Sid: InvoicingRead
            Effect: Allow
            Action:
              - invoicing:BatchGetInvoiceProfile
              - invoicing:ListInvoiceSummaries
              - invoicing:GetInvoicePdf
              - invoicing:ListInvoiceUnits
              - invoicing:GetInvoiceUnit
            Resource: "*"

          # Tax Settings - Read access for tax registration info
          # Services: AWS Tax Settings
          - Sid: TaxRead
            Effect: Allow
            Action:
              - tax:GetTaxRegistration
              - tax:ListTaxRegistrations
            Resource: "*"

          # IAM Identity Center ReadOnly
          # Services: IAM Identity Center (SSO)
          - Sid: IamIdentityCenterReadOnly
            Effect: Allow
            Action:
              - sso:ListInstances
            Resource: "*"

          # Compute, scaling, and load balancing
          # Services: EC2, Auto Scaling, Application Auto Scaling, ELB, Lambda
          - Sid: ComputeAndScalingReadOnly
            Effect: Allow
            Action:
              - ec2:Describe*
              - ec2:Get*
              - ec2:List*
              - dlm:Get*
              - elasticloadbalancing:Describe*
              - autoscaling:Describe*
              - autoscaling:Get*
              - application-autoscaling:Describe*
              - application-autoscaling:List*
              - application-autoscaling:Get*
              - autoscaling-plans:Describe*
              - autoscaling-plans:Get*
              - lambda:List*
              - lambda:GetFunctionConfiguration
            Resource: "*"

          # Containers, orchestration, and build/deploy
          # Services: ECS, EKS, ECR
          - Sid: ContainersAndBuildReadOnly
            Effect: Allow
            Action:
              - ecs:List*
              - ecs:Describe*
              - eks:List*
              - eks:Describe*
              - ecr:DescribeRepositories
              - ecr:ListImages
              - ecr:DescribeImages
            Resource: "*"

          # Databases and caching
          # Services: RDS, DynamoDB, DAX, Redshift, Redshift Serverless, ElastiCache, MemoryDB, Aurora DSQL
          - Sid: DatabasesAndCachingReadOnly
            Effect: Allow
            Action:
              - rds:Describe*
              - rds:List*
              - dsql:Get*
              - dsql:List*
              - dynamodb:List*
              - dynamodb:Describe*
              - redshift:Describe*
              - redshift:Get*
              - redshift:List*
              - redshift-serverless:Describe*
              - redshift-serverless:List*
              - elasticache:Describe*
              - elasticache:List*
              - memorydb:Describe*
              - memorydb:List*
            Resource: "*"

          # Storage, backup, and content delivery
          # Services: S3 (metadata only), FSx, EFS, Backup
          - Sid: StorageAndContentReadOnly
            Effect: Allow
            Action:
              - s3:ListAllMyBuckets
              - s3:ListBucketVersions
              - s3vectors:ListVectorBuckets
              - s3:GetLifecycleConfiguration
              - s3:GetBucketLocation
              - s3:GetBucketVersioning
              - s3:GetObjectRetention
              - s3:GetBucketTagging
              - fsx:Describe*
              - fsx:List*
              - elasticfilesystem:Describe*
              - elasticfilesystem:List*
              - backup:Describe*
              - backup:Get*
              - backup:List*
            Resource: "*"

          # End-user compute and application streaming
          # Services: WorkSpaces, AppStream
          - Sid: EndUserServicesReadOnly
            Effect: Allow
            Action:
              - workspaces:Describe*
              - appstream:Describe*
              - appstream:List*
            Resource: "*"

          # Observability extras (CloudWatch and Logs are in BlocksBaseReadPolicy)
          # Services: CloudWatch OAM, Config
          - Sid: ObservabilityExtras
            Effect: Allow
            Action:
              - oam:ListSinks
              - config:Describe*
              - config:Get*
              - config:List*
            Resource: "*"

          - Sid: NetworkAndEdgeReadOnly
            Effect: Allow
            Action:
              - wafv2:List*
            Resource: "*"

          # CloudTrail Read Access
          # Services: CloudTrail
          - Sid: CloudTrailReadAccess
            Effect: Allow
            Action:
              - cloudtrail:LookupEvents
              - cloudtrail:Describe*
              - cloudtrail:Get*
              - cloudtrail:List*
            Resource: "*"

          # Systems Manager Automation
          # Services: Systems Manager
          - Sid: SSMAutomationRead
            Effect: Allow
            Action:
              - ssm:DescribeAutomationStepExecutions
              - ssm:DescribeAutomationExecutions
            Resource: "*"

          # CloudFormation Stack Read Access
          # Services: CloudFormation
          - Sid: CloudFormationStackReadAccess
            Effect: Allow
            Action:
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:ListStacks
            Resource: "*"

  # IAM Policy: MajorTom Read Permissions
  # AI-specific read permissions for Cloud Control API, CloudTrail, and cost analysis
  MajorTomReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "MajorTomReadPolicy-${BlocksCustomerId}"
      Description: "MajorTom AI read permissions for Cloud Control API, CloudTrail, and cost analysis. Must remain in place for MajorTom to function correctly."
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Cloud Control API Read
          # Services: Cloud Control API
          - Sid: CloudControlAPIRead
            Effect: Allow
            Action:
              - cloudcontrol:GetResource
              - cloudcontrol:ListResources
              - cloudcontrol:GetResourceRequestStatus
            Resource: "*"

          # CloudFormation Schema Read
          # Services: CloudFormation
          - Sid: CloudFormationSchemaRead
            Effect: Allow
            Action:
              - cloudformation:DescribeType
              - cloudformation:DescribeGeneratedTemplate
              - cloudformation:GetGeneratedTemplate
              - cloudformation:ListGeneratedTemplates
            Resource: "*"

          # CloudWatch Logs extras (beyond base policy)
          # Services: CloudWatch Logs
          - Sid: CloudWatchLogsExtras
            Effect: Allow
            Action:
              - logs:StartQuery
              - logs:GetQueryResults
              - logs:StopQuery
              - logs:GetLogEvents
              - logs:FilterLogEvents
            Resource: "*"

          # CloudTrail
          # Services: CloudTrail
          - Sid: CloudTrailRead
            Effect: Allow
            Action:
              - cloudtrail:LookupEvents
              - cloudtrail:DescribeTrails
              - cloudtrail:GetTrail
              - cloudtrail:GetTrailStatus
              - cloudtrail:ListTrails
              - cloudtrail:GetEventSelectors
              - cloudtrail:GetInsightSelectors
            Resource: "*"

          # CloudTrail Lake
          # Services: CloudTrail
          - Sid: CloudTrailLakeRead
            Effect: Allow
            Action:
              - cloudtrail:ListEventDataStores
              - cloudtrail:GetEventDataStore
              - cloudtrail:StartQuery
              - cloudtrail:DescribeQuery
              - cloudtrail:GetQueryResults
              - cloudtrail:ListQueries
            Resource: "*"

          # EC2 Region Discovery
          # Services: EC2
          # Required for MajorTom Briefing Service to discover available AWS regions
          - Sid: EC2RegionDiscovery
            Effect: Allow
            Action:
              - ec2:DescribeRegions
            Resource: "*"

          # Budgets
          # Services: Budgets
          - Sid: BudgetsRead
            Effect: Allow
            Action:
              - budgets:ViewBudget
              - budgets:DescribeBudget
              - budgets:DescribeBudgets
            Resource: "*"

          # Free Tier
          # Services: Free Tier
          - Sid: FreeTierRead
            Effect: Allow
            Action:
              - freetier:GetFreeTierUsage
            Resource: "*"

          # Pricing Calculator
          # Services: BCM Pricing Calculator
          - Sid: PricingCalculatorRead
            Effect: Allow
            Action:
              - bcm-pricing-calculator:GetPreferences
              - bcm-pricing-calculator:GetWorkloadEstimate
              - bcm-pricing-calculator:ListWorkloadEstimateUsage
              - bcm-pricing-calculator:ListWorkloadEstimates
            Resource: "*"

  BlocksExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "BlocksExecutionRole-${BlocksCustomerId}"
      Description: "Used by Blocks.cloud to execute cost optimization actions. Must remain in place for Blocks to function correctly. Email support@blocks.cloud for assistance."
      MaxSessionDuration: 3600
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud
        - Key: Purpose
          Value: CostOptimization
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${BlocksAccountId}:role/BlocksCustomerAccessRole"
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${BlocksAccountId}:role/BlocksCustomerAccessRole"
            Action:
              - sts:TagSession
      ManagedPolicyArns:
        - !Ref BlocksBaseReadPolicy
        - !Ref BlocksCostOptimizationWritePolicy
        - !Ref BlocksCostOptimizationReadPolicy
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSSavingsPlansFullAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/ComputeOptimizerReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSOrganizationsReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSResourceGroupsReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSSecurityHubReadOnlyAccess

  # IAM Role: Blocks Read Role (Sub-Accounts)
  # Read-only cross-account role for cost analysis and monitoring
  BlocksReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "BlocksReadRole-${BlocksCustomerId}"
      Description: "Read-only role for Blocks.cloud cost analysis and monitoring. Must remain in place for Blocks to function correctly. Email support@blocks.cloud for assistance."
      MaxSessionDuration: 3600
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud
        - Key: Purpose
          Value: CostOptimization
        - Key: RoleType
          Value: ReadOnly
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${BlocksAccountId}:role/BlocksCustomerAccessRole"
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${BlocksAccountId}:role/BlocksCustomerAccessRole"
            Action:
              - sts:TagSession
      ManagedPolicyArns:
        - !Ref BlocksBaseReadPolicy
        - !Ref BlocksCostOptimizationReadPolicy
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSSavingsPlansReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/ComputeOptimizerReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSOrganizationsReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSResourceGroupsReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSSecurityHubReadOnlyAccess

  # IAM Role: MajorTom Read Role
  # Read-only AI role for cost analysis and monitoring
  MajorTomReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "MajorTomReadRole-${BlocksCustomerId}"
      Description: "Read-only AI role for Blocks.cloud cost analysis and monitoring. Must remain in place for MajorTom to function correctly."
      MaxSessionDuration: 3600
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud
        - Key: Purpose
          Value: CostOptimization
        - Key: RoleType
          Value: AI-ReadOnly
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${BlocksAccountId}:role/BlocksCustomerAccessRole"
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${BlocksAccountId}:role/BlocksCustomerAccessRole"
            Action:
              - sts:TagSession
      ManagedPolicyArns:
        - !Ref BlocksBaseReadPolicy
        - !Ref MajorTomReadPolicy
        - !Sub arn:${AWS::Partition}:iam::aws:policy/ComputeOptimizerReadOnlyAccess

Outputs:
  BlocksExecutionRoleArn:
    Description: "Cross-account role for cost and resource optimization analysis within a sub-account"
    Value: !GetAtt BlocksExecutionRole.Arn
  BlocksExecutionRoleName:
    Description: "Name of the cross-account Blocks read role"
    Value: !Ref BlocksExecutionRole
  BlocksReadRoleArn:
    Description: "Read-only cross-account role ARN for cost analysis"
    Value: !GetAtt BlocksReadRole.Arn
  BlocksReadRoleName:
    Description: "Name of the read-only Blocks role"
    Value: !Ref BlocksReadRole

  ###################
  # MajorTom Roles  #
  ###################
  MajorTomReadRoleArn:
    Description: "Read-only AI role ARN for cost analysis and monitoring"
    Value: !GetAtt MajorTomReadRole.Arn
  MajorTomReadRoleName:
    Description: "Name of the MajorTom read-only role"
    Value: !Ref MajorTomReadRole

