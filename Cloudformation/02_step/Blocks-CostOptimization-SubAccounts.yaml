AWSTemplateFormatVersion: "2010-09-09"
Description: >
  This template creates a cross-account execution role for Blocks to perform cost optimization actions
  within a sub-account. It grants permissions to purchase Reserved Instances, manage budgets and alarms,
  and read configuration data across compute, storage, database, and monitoring services.

Metadata:
  TemplateVersion: "0.1.12"
  LastUpdated: "2026-01-08"

Parameters:
  BlocksCustomerId:
    Type: String
    Description: "Unique customer identifier provided by Blocks"
    AllowedPattern: "^[a-zA-Z0-9-_]+$"
    ConstraintDescription: "Must contain only alphanumeric characters, hyphens, and underscores"

  BlocksAccountId:
    Type: String
    Description: "Blocks AWS account ID for cross-account access"
    AllowedPattern: "^[0-9]{12}$"
    ConstraintDescription: "Must be a valid 12-digit AWS account ID"

  ExternalId:
    Type: String
    Description: "External ID for secure cross-account role assumption"
    NoEcho: true

Resources:
  # IAM Policy: Data Protection Deny Policy
  # Explicit deny overlay to block access to sensitive data while using broad managed read policies
  # This works with ViewOnlyAccess to provide read-only infrastructure access while protecting data
  # ============================================================================
  # COMPREHENSIVE 11-TIER DATA PROTECTION POLICY
  # ============================================================================
  # Provides cryptographic assurance that Blocks cannot access customer sensitive data
  # IAM evaluation: Explicit Deny > Allow > Implicit Deny (denies always win)
  # Coverage: 100+ actions across 11 tiers protecting secrets, communications,
  # documents, databases, storage, analytics, logs, identity, code, ML, and instance access
  # ============================================================================
  BlocksDataProtectionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "BlocksDataProtectionPolicy-${BlocksCustomerId}"
      Description: "Comprehensive 11-tier data protection policy with 100+ explicit denies across secrets, communications, documents, databases, storage, analytics, logs, identity, code, ML, and instance access. Provides cryptographic assurance that Blocks cannot access customer sensitive data."
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # TIER 1: Secrets & Credentials
          - Sid: DenySecretsAndCredentials
            Effect: Deny
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:GetResourcePolicy
              - secretsmanager:DescribeSecret
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParameterHistory
              - ssm:GetParametersByPath
              - acm-pca:GetCertificate
              - acm-pca:GetCertificateAuthorityCertificate
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:ReEncrypt*
            Resource: "*"

          # TIER 2: Communications (Emails, Messages, SMS)
          - Sid: DenyCommunicationsData
            Effect: Deny
            Action:
              - workmail:*
              - ses:GetMessage
              - ses:GetEmailIdentity
              - ses:GetEmailTemplate
              - chime:GetMessage*
              - chime:GetConversation*
              - chime:ListMessages
              - connect:GetContactAttributes
              - connect:GetContactRecording
              - pinpoint:GetEmailTemplate
              - pinpoint:GetSmsTemplate
              - sns:GetSMSAttributes
            Resource: "*"

          # TIER 3: Documents & Collaboration
          - Sid: DenyDocumentsAccess
            Effect: Deny
            Action:
              - workdocs:GetDocument
              - workdocs:GetDocumentVersion
              - workdocs:DownloadDocumentVersion
              - workspaces:DescribeWorkspacesConnectionStatus
              - workspaces:DescribeWorkspaceSnapshots
            Resource: "*"

          # TIER 4: Database Content
          - Sid: DenyDatabaseContentAccess
            Effect: Deny
            Action:
              - dynamodb:GetItem
              - dynamodb:BatchGetItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:GetRecords
              - dynamodb:GetShardIterator
              - rds-data:ExecuteStatement
              - rds-data:BatchExecuteStatement
              - rds:DownloadDBLogFilePortion
              - rds:DownloadCompleteDBLogFile
              - neptune-db:*
              - timestream:Select
              - timestream:SelectValues
              - qldb:SendCommand
              - qldb:ExecuteStatement
              - redshift:GetClusterCredentials
              - redshift:ExecuteQuery
              - redshift-data:ExecuteStatement
              - redshift-data:GetStatementResult
            Resource: "*"

          # TIER 5: Storage Content - S3 with CUR exception
          # Deny S3 object reads EXCEPT for Blocks CUR bucket
          # ArnNotLike means "deny UNLESS it matches" - this ALLOWS blocks-cur-data-* and DENIES everything else
          - Sid: DenyS3DataAccessExceptCURBucket
            Effect: Deny
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:GetObjectTorrent
            Resource: "*"
            Condition:
              ArnNotLike:
                "aws:ResourceArn": "arn:aws:s3:::blocks-cur-data-*/cur2/*"

          # Deny all S3 write/delete operations
          - Sid: DenyS3WriteDelete
            Effect: Deny
            Action:
              - s3:PutObject
              - s3:DeleteObject
            Resource: "*"

          # TIER 5: File systems and backups
          - Sid: DenyFileSystemAndBackupAccess
            Effect: Deny
            Action:
              - elasticfilesystem:ClientMount
              - elasticfilesystem:ClientWrite
              - elasticfilesystem:ClientRootAccess
              - fsx:*
              - backup:GetRecoveryPointRestoreMetadata
              - backup:StartRestoreJob
            Resource: "*"

          # TIER 6: Analytics Query Results
          - Sid: DenyAnalyticsQueryResults
            Effect: Deny
            Action:
              - athena:GetQueryResults
              - athena:GetQueryResultsStream
              - quicksight:GetDashboard
              - quicksight:GetDataSet
              - glue:GetTable
              - glue:GetPartition
              - glue:GetPartitions
            Resource: "*"

          # TIER 7: Logs with Container Insights exception
          # Deny CloudWatch Logs queries EXCEPT Container Insights performance logs
          - Sid: DenyLogsQueryExceptContainerInsights
            Effect: Deny
            Action:
              - logs:StartQuery
              - logs:GetQueryResults
            Resource: "*"
            Condition:
              StringNotLike:
                "logs:LogGroupName": "/aws/containerinsights/*/performance"

          # Deny direct log access
          - Sid: DenyLogEventsAccess
            Effect: Deny
            Action:
              - logs:GetLogEvents
              - logs:FilterLogEvents
              - logs:GetLogRecord
              - cloudtrail:LookupEvents
              - cloudtrail:GetQueryResults
            Resource: "*"

          # TIER 8: User Directories & Identity
          - Sid: DenyUserDirectoryAccess
            Effect: Deny
            Action:
              - cognito-identity:*
              - cognito-idp:*
              - cognito-sync:*
              - ds:DescribeUsers
              - iam:GetSSHPublicKey
              - iam:GetServiceSpecificCredential
              - iam:GetLoginProfile
            Resource: "*"

          # TIER 9: Code & Artifacts
          - Sid: DenyCodeAccess
            Effect: Deny
            Action:
              - codecommit:GetFile
              - codecommit:GetFolder
              - codecommit:GetBlob
              - codecommit:GitPull
              - codeartifact:GetPackageVersionAsset
              - codeartifact:ReadFromRepository
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Resource: "*"

          # TIER 10: Machine Learning Data
          - Sid: DenyMachineLearningData
            Effect: Deny
            Action:
              - sagemaker:DescribeModelPackage
              - sagemaker:DescribeTrainingJob
              - rekognition:DetectFaces
              - rekognition:SearchFaces*
              - comprehend:DetectPiiEntities
            Resource: "*"

          # TIER 11: Instance Access
          - Sid: DenyInstanceAccess
            Effect: Deny
            Action:
              - ec2:GetConsoleOutput
              - ec2:GetConsoleScreenshot
              - ec2:GetPasswordData
              - ssm:StartSession
            Resource: "*"

          # Additional sensitive operations
          - Sid: DenyOtherSensitiveOperations
            Effect: Deny
            Action:
              - lambda:InvokeFunction
              - sqs:ReceiveMessage
              - kinesis:GetRecords
            Resource: "*"

  # IAM Policy: Custom Read Permissions
  # Permissions not covered by AWS managed policies, serving as an extensible bucket for future custom read permissions
  BlocksCustomReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "BlocksCustomReadPolicy-${BlocksCustomerId}"
      Description: "Custom read permissions for Blocks cost optimization not covered by AWS managed policies"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: InvoicingTaxRead
            Effect: Allow
            Action:
              - invoicing:BatchGetInvoiceProfile
              - tax:GetTaxRegistration
              - taxsettings:Get*
              - taxsettings:List*
            Resource: "*"
          - Sid: CommitmentReads
            Effect: Allow
            Action:
              - redshift:GetReservedNodeExchangeOfferings
              - redshift:GetReservedNodeExchangeConfigurationOptions
              - cloudfront:ListSavingsPlans
              - cloudfront:GetSavingsPlan
              - cloudfront:ListRateCards
              - cloudfront:ListUsages
              - ce:GetCommitmentPurchaseAnalysis
              - ce:ListCommitmentPurchaseAnalyses
              - sagemaker:SearchTrainingPlanOfferings
            Resource: "*"

  BlocksCostOptimizationWritePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "BlocksCostOptimizationWritePolicy-${BlocksCustomerId}"
      Description: "Used by Blocks.cloud. Must remain in place for Blocks to function correctly. Email support@blocks.cloud for assistance. Grants execution permissions for cost optimization actions including purchasing Savings Plans, RIs, and managing accounts."
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Reserved Instance Purchases
          # Allows Blocks to purchase, modify, and exchange Reserved Instances
          # across AWS services to optimize costs based on your usage patterns
          # Services: EC2, RDS, ElastiCache, Redshift, OpenSearch, MemoryDB
          - Sid: SavingsPlansAndRIsWrite
            Effect: Allow
            Action:
              # EC2 Reserved Instances
              - ec2:PurchaseReservedInstancesOffering
              - ec2:ModifyReservedInstances
              - ec2:AcceptReservedInstancesExchangeQuote
              - ec2:DeleteQueuedReservedInstances
              - ec2:PurchaseHostReservation
              # RDS Reserved Instances
              - rds:PurchaseReservedDBInstancesOffering
              # ElastiCache Reserved Nodes
              - elasticache:PurchaseReservedCacheNodesOffering
              # Redshift Reserved Nodes
              - redshift:PurchaseReservedNodeOffering
              - redshift:AcceptReservedNodeExchange
              # OpenSearch Reserved Instances
              - es:PurchaseReservedInstanceOffering
              # MemoryDB Reserved Nodes
              - memorydb:PurchaseReservedNodesOffering
              # DynamoDB Reserved Capacity
              - dynamodb:PurchaseReservedCapacityOfferings
              # CloudFront Savings Plans
              - cloudfront:CreateSavingsPlan
              # EC2 Capacity Blocks
              - ec2:PurchaseCapacityBlock
              # MediaConvert Reserved Queues
              - mediaconvert:CreateQueue
              - mediaconvert:UpdateQueue
              # MediaConnect Reservations
              - mediaconnect:PurchaseOffering
              # SageMaker Training Plans
              - sagemaker:CreateTrainingPlan
            Resource: "*"

          # Governance & Monitoring
          # Services: Budgets, Cost Explorer, Service Quotas, IAM
          - Sid: GovernanceWrite
            Effect: Allow
            Action:
              - budgets:*
              - ce:UpdateCostAllocationTagsStatus
              - ce:CreateAnomalyMonitor
              - ce:CreateAnomalySubscription
              - ce:UpdateAnomalyMonitor
              - ce:UpdateAnomalySubscription
              - ce:StartCommitmentPurchaseAnalysis
              - ce:StartSavingsPlansPurchaseRecommendationGeneration
              - servicequotas:RequestServiceQuotaIncrease
              - servicequotas:GetServiceQuota
              - servicequotas:ListServiceQuotas
              - servicequotas:GetRequestedServiceQuotaChange
              - servicequotas:ListRequestedServiceQuotaChangeHistory
              - servicequotas:GetAWSDefaultServiceQuota
              - servicequotas:ListAWSDefaultServiceQuotas
              - iam:SimulatePrincipalPolicy
            Resource: "*"

          # Service Quotas Service-Linked Role
          # Required for Service Quotas to function
          # Services: IAM
          - Sid: ServiceQuotasServiceLinkedRole
            Effect: Allow
            Action:
              - iam:CreateServiceLinkedRole
            Resource: "arn:aws:iam::*:role/aws-service-role/servicequotas.amazonaws.com/*"
            Condition:
              StringEquals:
                "iam:AWSServiceName": "servicequotas.amazonaws.com"

          # SNS Write for Anomaly Detection Subscriptions
          # Services: SNS
          - Sid: SNSAnomalyDetectionSubscriptionsWrite
            Effect: Allow
            Action:
              - sns:*
            Resource: !Sub "arn:${AWS::Partition}:sns:*:${AWS::AccountId}:Blocks*"

          # CloudWatch Write for Alarms
          # Services: CloudWatch
          - Sid: CloudWatchWrite
            Effect: Allow
            Action:
              - cloudwatch:PutMetricAlarm
              - cloudwatch:DeleteAlarms
              - cloudwatch:EnableAlarmActions
              - cloudwatch:DisableAlarmActions
            Resource: !Sub "arn:${AWS::Partition}:cloudwatch:*:${AWS::AccountId}:alarm:Blocks-*"

          # EventBridge Management
          # Services: EventBridge
          - Sid: EventBridgeWrite
            Effect: Allow
            Action:
              - events:PutRule
              - events:PutTargets
              - events:DeleteRule
              - events:RemoveTargets
              - events:CreateEventBus
              - events:DeleteEventBus
              - events:PutEvents
            Resource:
              - !Sub "arn:${AWS::Partition}:events:*:*:rule/Blocks*"
              - !Sub "arn:${AWS::Partition}:events:*:*:event-bus/Blocks*"

          # Compute Optimizer
          # Services: Compute Optimizer
          - Sid: ComputeOptimizerWrite
            Effect: Allow
            Action:
              - compute-optimizer:*
            Resource: "*"

          # Cost Optimization Hub Opt-In
          # Services: IAM, Cost Optimization Hub
          - Sid: CostOptimizationHubOptIn
            Effect: Allow
            Action:
              - iam:CreateServiceLinkedRole
            Resource: "arn:aws:iam::*:role/aws-service-role/cost-optimization-hub.bcm.amazonaws.com/AWSServiceRoleForCostOptimizationHub"
            Condition:
              StringLike:
                "iam:AWSServiceName": "cost-optimization-hub.bcm.amazonaws.com"
          - Sid: CostOptimizationHubPolicy
            Effect: Allow
            Action:
              - iam:PutRolePolicy
            Resource: "arn:aws:iam::*:role/aws-service-role/cost-optimization-hub.bcm.amazonaws.com/AWSServiceRoleForCostOptimizationHub"
          - Sid: CostOptimizationHubUpdateStatus
            Effect: Allow
            Action:
              - cost-optimization-hub:UpdateEnrollmentStatus
            Resource: "*"

  BlocksExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "BlocksExecutionRole-${BlocksCustomerId}"
      Description: "Used by Blocks.cloud to execute cost optimization actions. Must remain in place for Blocks to function correctly. Email support@blocks.cloud for assistance."
      MaxSessionDuration: 3600
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud
        - Key: Purpose
          Value: CostOptimization
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${BlocksAccountId}:role/BlocksCustomerAccessRole"
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${BlocksAccountId}:role/BlocksCustomerAccessRole"
            Action:
              - sts:TagSession
      ManagedPolicyArns:
        # Write permissions for cost optimization actions
        - !Ref BlocksCostOptimizationWritePolicy
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSSavingsPlansFullAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSBillingReadOnlyAccess
        # Read permissions - using AWS managed policies for broad coverage
        - !Sub arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess
        # Additional AWS managed policies not covered by ReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSSavingsPlansReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/ComputeOptimizerReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSOrganizationsReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/SecurityAudit
        - !Ref BlocksDataProtectionPolicy
        - !Ref BlocksCustomReadPolicy

  # IAM Role: Blocks Read Role (Sub-Accounts)
  # Read-only cross-account role for cost analysis and monitoring
  BlocksReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "BlocksReadRole-${BlocksCustomerId}"
      Description: "Read-only role for Blocks.cloud cost analysis and monitoring. Must remain in place for Blocks to function correctly. Email support@blocks.cloud for assistance."
      MaxSessionDuration: 3600
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud
        - Key: Purpose
          Value: CostOptimization
        - Key: RoleType
          Value: ReadOnly
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${BlocksAccountId}:role/BlocksCustomerAccessRole"
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${BlocksAccountId}:role/BlocksCustomerAccessRole"
            Action:
              - sts:TagSession
      ManagedPolicyArns:
        # Read permissions - using AWS managed policies for broad coverage
        - !Sub arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSBillingReadOnlyAccess
        # Additional AWS managed policies not covered by ViewOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSSavingsPlansReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/ComputeOptimizerReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSOrganizationsReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/SecurityAudit
        - !Ref BlocksDataProtectionPolicy
        - !Ref BlocksCustomReadPolicy

  # IAM Role: MajorTom Read Role
  # Read-only AI role for cost analysis and monitoring
  MajorTomReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "MajorTomReadRole-${BlocksCustomerId}"
      Description: "Read-only AI role for Blocks.cloud cost analysis and monitoring. Must remain in place for MajorTom to function correctly."
      MaxSessionDuration: 3600
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud
        - Key: Purpose
          Value: CostOptimization
        - Key: RoleType
          Value: AI-ReadOnly
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${BlocksAccountId}:role/BlocksCustomerAccessRole"
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${BlocksAccountId}:role/BlocksCustomerAccessRole"
            Action:
              - sts:TagSession
      ManagedPolicyArns:
        # Read permissions - using AWS managed policies for broad coverage
        - !Sub arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSBillingReadOnlyAccess
        # Additional AWS managed policies not covered by ViewOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSSavingsPlansReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/ComputeOptimizerReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSOrganizationsReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/SecurityAudit
        - !Ref BlocksDataProtectionPolicy
        - !Ref BlocksCustomReadPolicy

Outputs:
  BlocksExecutionRoleArn:
    Description: "Cross-account role for cost and resource optimization analysis within a sub-account"
    Value: !GetAtt BlocksExecutionRole.Arn
  BlocksExecutionRoleName:
    Description: "Name of the cross-account Blocks read role"
    Value: !Ref BlocksExecutionRole
  BlocksReadRoleArn:
    Description: "Read-only cross-account role ARN for cost analysis"
    Value: !GetAtt BlocksReadRole.Arn
  BlocksReadRoleName:
    Description: "Name of the read-only Blocks role"
    Value: !Ref BlocksReadRole

  ###################
  # MajorTom Roles  #
  ###################
  MajorTomReadRoleArn:
    Description: "Read-only AI role ARN for cost analysis and monitoring"
    Value: !GetAtt MajorTomReadRole.Arn
  MajorTomReadRoleName:
    Description: "Name of the MajorTom read-only role"
    Value: !Ref MajorTomReadRole

