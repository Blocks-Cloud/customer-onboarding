  BlocksOptimizationNotifierRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "BlocksOptimizationNotifierRole-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      Description: "Used by Blocks.cloud to notify about deployment events. Must remain in place for Blocks to function correctly. Email support@blocks.cloud for assistance."
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud
        - Key: Purpose
          Value: EventNotification
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendToBlocksSQS
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: "arn:aws:sqs:us-east-1:{{BLOCKS_ACCOUNT_ID}}:Blocks-Onboarding-Queue"

  # EventBridge Rule: Stack Completion Notification
  # Sends CloudFormation status events to Blocks SQS queue
  CloudFormationCompleteRule:
    Type: AWS::Events::Rule
    Properties:
      Name: "NotifyBlocksStep2Complete-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      Description: "Notifies Blocks when CloudFormation stack deployment completes"
      EventPattern:
        source:
          - "aws.cloudformation"
        detail-type:
          - "CloudFormation Stack Status Change"
        detail:
          stack-id:
            - prefix: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/"
      Targets:
        - Arn: "arn:aws:sqs:us-east-1:{{BLOCKS_ACCOUNT_ID}}:Blocks-Onboarding-Queue"
          Id: "BlocksSQSQueue"
          RoleArn: !GetAtt BlocksOptimizationNotifierRole.Arn
          InputTransformer:
            InputPathsMap:
              account: "$.account"
              region: "$.region"
              time: "$.time"
              stackId: "$.detail.stack-id"
              statusDetails: "$.detail.status-details"
            InputTemplate: !Sub
              - |
                {
                  "source": "aws.cloudformation",
                  "account": <account>,
                  "region": <region>,
                  "time": <time>,
                  "stackId": <stackId>,
                  "statusDetails": <statusDetails>,
                  "templateVersion": "${TemplateVersion}",
                  "customerResourceId": "{{BLOCKS_CUSTOMER_RESOURCE_ID}}",
                  "executionRoleArn": "${BlocksExecutionRole.Arn}",
                  "readRoleArn": "${BlocksReadRole.Arn}",
                  "majorTomReadRoleArn": "${MajorTomReadRole.Arn}",
                  "blocksOptimizationOUId": "${BlocksOptimizationOU}",
                  "externalId": "{{EXTERNAL_ID}}",
                  "step": "2"
                }
              - TemplateVersion: !FindInMap [TemplateConfig, Constants, Version]

  ############################
  # EventBridge Cross-Account Event Forwarding
  ############################

  # IAM Role: Allows EventBridge to forward events to the Blocks customer-events bus
  BlocksEventBridgeCrossAccountRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "BlocksEventBridgeCrossAccountRole-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      Description: "Used by Blocks.cloud to forward CloudTrail events to Blocks for change detection. Must remain in place for Blocks to function correctly. Email support@blocks.cloud for assistance."
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud
        - Key: Purpose
          Value: EventForwarding
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PutEventsToBlocksBus
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: "arn:aws:events:eu-central-1:{{BLOCKS_ACCOUNT_ID}}:event-bus/blocks-customer-events"

  # StackSet: Deploy EventBridge forwarding rules to all member accounts across all default regions
  # Note: SERVICE_MANAGED StackSets only deploy to member accounts, not the management account.
  # Management account event forwarding is handled by MgmtEventForwardingStackSet (self-managed).
  EventForwardingStackSet:
    Type: AWS::CloudFormation::StackSet
    DependsOn: SubAccountStackSet
    Properties:
      StackSetName: "Blocks-EventForwarding-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      Description: "Deploys EventBridge rules to forward CloudTrail management write events to Blocks across all regions. Must remain in place for Blocks to function correctly. Email support@blocks.cloud for assistance."
      PermissionModel: SERVICE_MANAGED
      AutoDeployment:
        Enabled: true
        RetainStacksOnAccountRemoval: false
      Capabilities:
        - CAPABILITY_NAMED_IAM
      TemplateURL: "{{EVENT_FORWARDING_TEMPLATE_URL}}"
      Parameters:
        - ParameterKey: BlocksCustomerId
          ParameterValue: "{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
        - ParameterKey: BlocksEventBusArn
          ParameterValue: "arn:aws:events:eu-central-1:{{BLOCKS_ACCOUNT_ID}}:event-bus/blocks-customer-events"
      StackInstancesGroup:
        - DeploymentTargets:
            OrganizationalUnitIds:
              - !GetAtt EnableOrgServices.OrganizationRootId
          Regions:
            - us-east-1
            - us-east-2
            - us-west-1
            - us-west-2
            - ca-central-1
            - eu-central-1
            - eu-north-1
            - eu-west-1
            - eu-west-2
            - eu-west-3
            - ap-northeast-1
            - ap-northeast-2
            - ap-northeast-3
            - ap-south-1
            - ap-southeast-1
            - ap-southeast-2
            - sa-east-1
      OperationPreferences:
        # 100% tolerance: a customer SCP may deny EventBridge rule creation in some
        # regions. Tolerating all per-region failures lets those instances stay FAILED
        # (rule skipped there) without failing the operation or rolling back Step 2.
        # The SCP-immune management StackSet below stays strict to catch real failures.
        FailureTolerancePercentage: 100
        MaxConcurrentPercentage: 100
        RegionConcurrencyType: PARALLEL
        ConcurrencyMode: SOFT_FAILURE_TOLERANCE
      Tags:
        - Key: TemplateVersion
          Value: !FindInMap [TemplateConfig, Constants, Version]
      CallAs: SELF

  ############################
  # Management Account Event Forwarding (Self-Managed StackSet)
  ############################
  # SERVICE_MANAGED StackSets exclude the management account, so we use a self-managed
  # StackSet to deploy EventBridge forwarding rules to the management account across all regions.

  # IAM Role: Allows CloudFormation StackSets to assume the execution role
  BlocksStackSetAdministrationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "BlocksStackSetAdministrationRole-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      Description: "Administration role for self-managed StackSet deploying EventBridge forwarding rules to management account. Managed by Blocks.cloud."
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud
        - Key: Purpose
          Value: StackSetAdministration
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AssumeExecutionRole
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/BlocksStackSetExecutionRole-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"

  # IAM Role: Execution role for self-managed StackSet operations in management account
  BlocksStackSetExecutionRole:
    Type: AWS::IAM::Role
    DependsOn: BlocksStackSetAdministrationRole
    Properties:
      RoleName: "BlocksStackSetExecutionRole-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      Description: "Execution role for self-managed StackSet deploying EventBridge forwarding rules. Scoped to EventBridge rule management. Managed by Blocks.cloud."
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud
        - Key: Purpose
          Value: StackSetExecution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/BlocksStackSetAdministrationRole-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EventBridgeManagement
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # EventBridge rule management for blocks-* rules
              - Effect: Allow
                Action:
                  - events:PutRule
                  - events:DeleteRule
                  - events:DescribeRule
                  - events:PutTargets
                  - events:RemoveTargets
                  - events:ListTargetsByRule
                  - events:EnableRule
                  - events:DisableRule
                Resource:
                  - !Sub "arn:${AWS::Partition}:events:*:${AWS::AccountId}:rule/Blocks*"
              # CloudFormation stack management for StackSet operations
              - Effect: Allow
                Action:
                  - cloudformation:*
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/StackSet-Blocks-MgmtEventForwarding-*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:type/resource/*"
              # iam:PassRole for EventBridge to use the cross-account role on rule targets
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/BlocksEventBridgeCrossAccountRole-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
                Condition:
                  StringEquals:
                    iam:PassedToService: events.amazonaws.com
              # SNS for StackSet notifications (if configured)
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId

  # Self-Managed StackSet: Deploy EventBridge forwarding rules to management account across all regions
  MgmtEventForwardingStackSet:
    Type: AWS::CloudFormation::StackSet
    DependsOn:
      - BlocksEventBridgeCrossAccountRole
      - EventForwardingStackSet
    Properties:
      StackSetName: "Blocks-MgmtEventForwarding-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      Description: "Deploys EventBridge forwarding rules to the management account across all regions. Required because SERVICE_MANAGED StackSets exclude the management account. Managed by Blocks.cloud."
      PermissionModel: SELF_MANAGED
      AdministrationRoleARN: !GetAtt BlocksStackSetAdministrationRole.Arn
      ExecutionRoleName: !Ref BlocksStackSetExecutionRole
      TemplateURL: "{{EVENT_FORWARDING_TEMPLATE_URL}}"
      Parameters:
        - ParameterKey: BlocksCustomerId
          ParameterValue: "{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
        - ParameterKey: BlocksEventBusArn
          ParameterValue: "arn:aws:events:eu-central-1:{{BLOCKS_ACCOUNT_ID}}:event-bus/blocks-customer-events"
      StackInstancesGroup:
        - DeploymentTargets:
            Accounts:
              - !Ref AWS::AccountId
          Regions:
            - us-east-1
            - us-east-2
            - us-west-1
            - us-west-2
            - ca-central-1
            - eu-central-1
            - eu-north-1
            - eu-west-1
            - eu-west-2
            - eu-west-3
            - ap-northeast-1
            - ap-northeast-2
            - ap-northeast-3
            - ap-south-1
            - ap-southeast-1
            - ap-southeast-2
            - sa-east-1
      OperationPreferences:
        FailureTolerancePercentage: 0
        MaxConcurrentPercentage: 100
        RegionConcurrencyType: PARALLEL
        ConcurrencyMode: SOFT_FAILURE_TOLERANCE
      Tags:
        - Key: TemplateVersion
          Value: !FindInMap [TemplateConfig, Constants, Version]

Outputs:
  BlocksExecutionRoleArn:
    Description: "Cross-account role ARN for execution of cost optimization actions"
    Value: !GetAtt BlocksExecutionRole.Arn
  BlocksExecutionRoleName:
    Description: "Name of the cross-account Blocks execution role"
    Value: !Ref BlocksExecutionRole
  BlocksReadRoleArn:
    Description: "Read-only cross-account role ARN for cost analysis"
    Value: !GetAtt BlocksReadRole.Arn
  BlocksReadRoleName:
    Description: "Name of the read-only Blocks role"
    Value: !Ref BlocksReadRole

  ###################
  # MajorTom Roles  #
  ###################
  MajorTomReadRoleArn:
    Description: "Read-only AI role ARN for cost analysis and monitoring"
    Value: !GetAtt MajorTomReadRole.Arn
  MajorTomReadRoleName:
    Description: "Name of the MajorTom read-only role"
    Value: !Ref MajorTomReadRole

  ###################################
  # Organizational Unit             #
  ###################################
  BlocksOptimizationOUId:
    Description: "Organizational Unit ID for Blocks-managed accounts (exempted from Savings Plans SCP)"
    Value: !Ref BlocksOptimizationOU
    Export:
      Name: !Sub "${AWS::StackName}-BlocksOptimizationOUId"

  BlocksOptimizationOUArn:
    Description: "ARN of the Blocks Optimization OU"
    Value: !GetAtt BlocksOptimizationOU.Arn

  ###################################
  # Service Control Policies        #
  ###################################
  SavingsPlansSCPId:
    Description: "ID of the Savings Plans deny SCP policy (attached to organization root)"
    Value: !Ref BlocksSavingsPlansDenyPolicy

  SavingsPlansSCPArn:
    Description: "ARN of the Savings Plans deny SCP policy"
    Value: !GetAtt BlocksSavingsPlansDenyPolicy.Arn

  GovernanceSCPId:
    Description: "ID of the Blocks Governance deny SCP policy (attached to BlocksOptimization OU)"
    Value: !Ref BlocksGovernanceDenyPolicy

  GovernanceSCPArn:
    Description: "ARN of the Blocks Governance deny SCP policy"
    Value: !GetAtt BlocksGovernanceDenyPolicy.Arn
