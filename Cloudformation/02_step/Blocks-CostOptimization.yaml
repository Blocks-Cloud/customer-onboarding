AWSTemplateFormatVersion: "2010-09-09"
Description: >
  IMPORTANT: Deploy this stack in your AWS Organization Management (root) account in the us-east-1 region only.

  SUMMARY: This template enables Blocks to perform comprehensive cost analysis and optimization execution across your organization.

  ACTIONS (in order of execution):
  1. Enables AWS Organizations trusted access for Cost Optimization Hub and Compute Optimizer via Lambda function.
  2. Deploys BlocksExecutionRole to all member accounts via StackSet for organization-wide optimization.
  3. Creates BlocksExecutionRole in management account with permissions for Savings Plans/RIs, Budgets, EventBridge, CloudWatch, Cost Optimization Hub, and AWS Organizations management.
  4. Creates EventBridge rule to notify Blocks upon stack completion.

Metadata:
  TemplateVersion: "0.1.84" # x-release-please-version

Mappings:
  TemplateConfig:
    Constants:
      Version: "0.1.84" # x-release-please-version

Rules:
  EnforceUsEast1:
    Assertions:
      - Assert:
          Fn::Equals:
            - !Ref AWS::Region
            - us-east-1
        AssertDescription: "You must deploy to region us-east-1 only. Since Data exports is only available in us-east-1"

  EnforceManagementAccount:
    Assertions:
      - Assert:
          Fn::Or:
            - Fn::Equals:
                - !Ref AWS::AccountId
                - "{{MANAGEMENT_ACCOUNT_ID}}"
            - Fn::Equals:
                - "{{MANAGEMENT_ACCOUNT_ID}}"
                - "SKIP"
        AssertDescription: "This stack must be deployed in the AWS Organization management account only. The current account does not match the expected management account."

Resources:
  BlocksOnboardingLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "BlocksOnboardingLambdaRole-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      Description: "Used by Blocks.cloud to enable organization services. Must remain in place for Blocks to function correctly. Email support@blocks.cloud for assistance."
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud
        - Key: Purpose
          Value: Onboarding
      Policies:
        - PolicyName: BlocksOnboardingLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cost-optimization-hub:UpdateEnrollmentStatus
                  - cost-optimization-hub:ListEnrollmentStatuses
                  - compute-optimizer:UpdateEnrollmentStatus
                Resource: "*"
              # Service-Linked Role creation for Cost Optimization Hub, Compute Optimizer, and CloudFormation StackSets
              - Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:CreateServiceLinkedRole
                Resource: "*"
              - Effect: Allow
                Action:
                  - organizations:DescribeOrganization
                  - organizations:EnableAWSServiceAccess
                  - organizations:EnablePolicyType
                  - organizations:ListRoots
                Resource: "*"
              - Effect: Allow
                Action:
                  - cloudformation:DescribeOrganizationsAccess
                  - cloudformation:ActivateOrganizationsAccess
                Resource: "*"
              # Permissions for deleting Step 1 stack
              - Effect: Allow
                Action:
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/blocks-customer-step-1-{{BLOCKS_CUSTOMER_RESOURCE_ID}}/*"
              # Permissions to delete Step 1 StackSet
              - Effect: Allow
                Action:
                  - cloudformation:DeleteStackSet
                  - cloudformation:DeleteStackInstances
                  - cloudformation:DescribeStackSet
                  - cloudformation:DescribeStackSetOperation
                  - cloudformation:ListStackInstances
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stackset/Blocks-CostEstimations-{{BLOCKS_CUSTOMER_RESOURCE_ID}}:*"
              - Effect: Allow
                Action:
                  - cloudformation:DeleteStackInstances
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation::${AWS::AccountId}:stackset-target/Blocks-CostEstimations-{{BLOCKS_CUSTOMER_RESOURCE_ID}}:*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}::type/resource/AWS-IAM-ManagedPolicy"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}::type/resource/AWS-IAM-Role"
              # Permissions to delete Step 1 EventBridge rule
              - Effect: Allow
                Action:
                  - events:DeleteRule
                  - events:RemoveTargets
                  - events:DescribeRule
                  - events:ListTargetsByRule
                Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/NotifyBlocksStep1Complete-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
              # Permissions to delete Step 1 IAM resources
              - Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:GetRole
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/BlocksEstimationsReadRole-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/BlocksEstimationsNotifierRole-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/EnableStackSetsLambdaRole-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
              - Effect: Allow
                Action:
                  - iam:DeletePolicy
                  - iam:GetPolicy
                  - iam:ListPolicyVersions
                  - iam:DeletePolicyVersion
                  - iam:ListEntitiesForPolicy
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/BlocksSavingsEstimationReadOnlyPolicy-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/BlocksEstimationsDataProtectionPolicy-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/BlocksEstimationsCustomReadPolicy-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
              # Permissions to delete Step 1 Lambda
              - Effect: Allow
                Action:
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:InvokeFunction
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:EnableStackSets-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"

  EnableOrgServicesLambda:
    Type: AWS::Lambda::Function
    Properties:
      Description: "Lambda function to enable Organization services access (enables SCPs, Cost Optimization Hub, Compute Optimizer)"
      FunctionName: EnableOrgServices-{{BLOCKS_CUSTOMER_RESOURCE_ID}}
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt BlocksOnboardingLambdaRole.Arn
      Timeout: 900
      Architectures:
        - arm64
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import time
          from botocore.exceptions import ClientError

          def enable_coh(orgs, max_retries=3):
              # 1. Enable Service Access
              try:
                  orgs.enable_aws_service_access(ServicePrincipal='cost-optimization-hub.bcm.amazonaws.com')
                  print("Enabled AWS Organizations Service Access for Cost Optimization Hub")
                  time.sleep(5)
              except ClientError as e:
                  print(f"Skipped enabling AWS Organizations Service Access for Cost Optimization Hub: {e}")

              # 2. Update Enrollment with retry logic
              cost_hub = boto3.client("cost-optimization-hub")
              last_error = None
              for attempt in range(max_retries):
                  try:
                      cost_hub.update_enrollment_status(status='Active', includeMemberAccounts=True)
                      print("Enabled Cost Optimization Hub Enrollment (Opt-In)")
                      return
                  except Exception as e:
                      last_error = e
                      print(f"Attempt {attempt + 1}/{max_retries} failed to enable Cost Optimization Hub: {e}")
                      if attempt < max_retries - 1:
                          sleep_time = 5 * (attempt + 1)
                          print(f"Retrying in {sleep_time} seconds...")
                          time.sleep(sleep_time)
              print(f"Failed to enable Cost Optimization Hub after {max_retries} attempts")
              raise last_error

          def enable_compute_optimizer(orgs, max_retries=3):
              # 1. Enable Service Access
              try:
                  orgs.enable_aws_service_access(ServicePrincipal='compute-optimizer.amazonaws.com')
                  print("Enabled AWS Organizations Service Access for Compute Optimizer")
                  time.sleep(5)
              except ClientError as e:
                  print(f"Skipped enabling AWS Organizations Service Access for Compute Optimizer: {e}")

              # 2. Update Enrollment with retry logic
              co_client = boto3.client("compute-optimizer")
              last_error = None
              for attempt in range(max_retries):
                  try:
                      co_client.update_enrollment_status(status='Active', includeMemberAccounts=True)
                      print("Enabled Compute Optimizer Enrollment (Opt-In)")
                      return
                  except Exception as e:
                      last_error = e
                      print(f"Attempt {attempt + 1}/{max_retries} failed to enable Compute Optimizer: {e}")
                      if attempt < max_retries - 1:
                          sleep_time = 5 * (attempt + 1)
                          print(f"Retrying in {sleep_time} seconds...")
                          time.sleep(sleep_time)
              print(f"Failed to enable Compute Optimizer after {max_retries} attempts")
              raise last_error

          def enable_scps(orgs, root_id, max_attempts=3):
              """Enable Service Control Policies in the organization with retry logic"""
              last_error = None

              for attempt in range(max_attempts):
                  try:
                      orgs.enable_policy_type(
                          RootId=root_id,
                          PolicyType='SERVICE_CONTROL_POLICY'
                      )
                      print(f"Enabled Service Control Policies (SCPs) on attempt {attempt + 1}")
                      # Wait for AWS Organizations to propagate the policy type enablement
                      print("Waiting for SCP policy type propagation...")
                      time.sleep(5)
                      return
                  except ClientError as e:
                      if 'PolicyTypeAlreadyEnabledException' in str(e):
                          print("Service Control Policies already enabled")
                          return

                      last_error = e
                      error_code = e.response.get('Error', {}).get('Code', 'Unknown')
                      print(f"Attempt {attempt + 1}/{max_attempts} failed to enable SCPs: [{error_code}] {e}")

                      if attempt < max_attempts - 1:
                          wait_time = 2 ** attempt  # Exponential backoff: 1s, 2s, 4s
                          print(f"Retrying in {wait_time} seconds...")
                          time.sleep(wait_time)

              # All retries exhausted
              error_msg = (
                  f"Failed to enable SCPs after {max_attempts} attempts. "
                  f"Verify organization has 'All Features' enabled and you have "
                  f"organizations:EnablePolicyType permission. Last error: {last_error}"
              )
              print(f"Error: {error_msg}")
              raise Exception(error_msg)

          def get_organization_root_id(orgs):
              """Fetch the Organization Root ID using list_roots API."""
              roots = orgs.list_roots()['Roots']
              if not roots:
                  raise Exception("No Organization Roots found. Ensure this is the management account.")
              return roots[0]['Id']

          def enable_stacksets(orgs, cfn, max_retries=12):
              """Enable StackSets trusted access with AWS Organizations."""
              # Step 1: Enable Organizations service access (idempotent, catches ClientError)
              try:
                  orgs.enable_aws_service_access(ServicePrincipal='member.org.stacksets.cloudformation.amazonaws.com')
                  print("Enabled AWS Organizations Service Access for CloudFormation StackSets")
                  time.sleep(10)
              except ClientError as e:
                  print(f"Skipped enabling service access for StackSets: {e}")

              # Step 2: Activate CFN trusted access if not already enabled
              if cfn.describe_organizations_access().get('Status') != 'ENABLED':
                  last_error = None
                  for attempt in range(3):
                      try:
                          cfn.activate_organizations_access()
                          print("Activated Trusted Access for CloudFormation StackSets")
                          break
                      except ClientError as e:
                          last_error = e
                          print(f"Attempt {attempt + 1}/3 failed to activate StackSets trusted access: {e}")
                          if attempt < 2:
                              time.sleep(2 ** attempt)
                  else:
                      raise last_error

              # Step 3: Poll until ENABLED
              for i in range(max_retries):
                  status = cfn.describe_organizations_access().get('Status')
                  if status == 'ENABLED':
                      print("StackSets trusted access is ENABLED")
                      return
                  time.sleep(60)
              raise Exception(f"Failed to verify StackSets activation after {max_retries} attempts. Status: {status}")

          def handler(event, context):
              try:
                  response_data = {}
                  orgs = boto3.client("organizations")

                  if event['RequestType'] in ['Create', 'Update']:
                      # Wait for IAM policy propagation on first deploy
                      time.sleep(10)

                      if orgs.describe_organization()['Organization']['FeatureSet'] != 'ALL':
                          raise Exception("Organization must have 'All Features' enabled.")

                      # 1. Enable & Verify Cost Optimization Hub
                      enable_coh(orgs)

                      # 2. Enable & Verify Compute Optimizer
                      enable_compute_optimizer(orgs)

                      # 3. Fetch Organization Root ID (needed for SCP and StackSet deployment)
                      org_root_id = get_organization_root_id(orgs)
                      print(f"Organization Root ID: {org_root_id}")
                      response_data['OrganizationRootId'] = org_root_id

                      # 4. Enable Service Control Policies
                      enable_scps(orgs, org_root_id)

                      # 5. Enable StackSets trusted access (needed for SERVICE_MANAGED StackSets)
                      cfn_client = boto3.client("cloudformation")
                      enable_stacksets(orgs, cfn_client)
                  else:
                      # For Delete operations, still need to fetch root ID for response
                      org_root_id = get_organization_root_id(orgs)
                      response_data['OrganizationRootId'] = org_root_id

                  cfnresponse.send(event, context, cfnresponse.SUCCESS, response_data)
              except Exception as e:
                  print(f"Unexpected Error in EnableOrgServices: {e}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(e)})

  # Custom Resource: Enable Organization Services
  # Triggers Lambda to enable Cost Optimization Hub and Compute Optimizer
  EnableOrgServices:
    Type: Custom::EnableOrgServices
    Properties:
      ServiceToken: !GetAtt EnableOrgServicesLambda.Arn
      # Force re-execution on template updates by including version
      TemplateVersion: !FindInMap [TemplateConfig, Constants, Version]

  # Lambda Function: Delete Step 1 Stack
  # Deletes the Step 1 stack after Step 2 deployment completes
  DeleteStep1StackLambda:
    Type: AWS::Lambda::Function
    Properties:
      Description: "Lambda function to delete Step 1 stack"
      FunctionName: DeleteStep1Stack-{{BLOCKS_CUSTOMER_RESOURCE_ID}}
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt BlocksOnboardingLambdaRole.Arn
      Timeout: 60
      Architectures:
        - arm64
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          from botocore.exceptions import ClientError

          STACK_NAME = "blocks-customer-step-1-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"

          def handler(event, context):
              print(f"Received event: {event}")

              try:
                  if event['RequestType'] in ['Create', 'Update']:
                      cf_client = boto3.client('cloudformation')

                      # Check if stack exists
                      try:
                          cf_client.describe_stacks(StackName=STACK_NAME)
                      except ClientError as e:
                          if 'does not exist' in str(e):
                              print(f"Stack {STACK_NAME} not found, nothing to delete")
                              cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                              return
                          raise

                      # Delete the stack - CloudFormation handles StackSet cleanup
                      cf_client.delete_stack(StackName=STACK_NAME)
                      print(f"Delete initiated for stack {STACK_NAME}")

                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})

              except Exception as e:
                  print(f"Error: {e}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(e)})

  # Custom Resource: Delete Step 1 Stack
  # Triggers after Step 2 deployment completes to clean up Step 1 resources
  DeleteStep1Stack:
    Type: Custom::DeleteStep1Stack
    DependsOn:
      - SubAccountStackSet
      - BlocksExecutionRole
    Properties:
      ServiceToken: !GetAtt DeleteStep1StackLambda.Arn

  # Organizational Unit: Blocks Optimization
  # Accounts in this OU are exempted from Savings Plans restrictions
  # Provides organizational boundary for cost optimization governance
  BlocksOptimizationOU:
    Type: AWS::Organizations::OrganizationalUnit
    Properties:
      Name: "BlocksOptimization-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      ParentId: !GetAtt EnableOrgServices.OrganizationRootId
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud
        - Key: Purpose
          Value: CostOptimization
        - Key: ManagedBy
          Value: CloudFormation

  # Service Control Policy: Savings Plans Restriction
  # Denies all Savings Plans write operations except for:
  #   1. BlocksExecutionRole (works from any account)
  #   2. Any principal in BlocksOptimization OU (organizational boundary)
  # Applies at organization root level to enforce governance across all accounts
  BlocksSavingsPlansDenyPolicy:
    Type: AWS::Organizations::Policy
    Properties:
      Type: SERVICE_CONTROL_POLICY
      Name: BlocksSavingsPlansDenyPolicy-{{BLOCKS_CUSTOMER_RESOURCE_ID}}
      Description: "Denies Savings Plans write operations except BlocksExecutionRole and accounts in BlocksOptimization OU. Managed by Blocks.cloud."
      Content:
        Version: "2012-10-17"
        Statement:
          # Deny if NOT using BlocksExecutionRole (regardless of OU)
          - Sid: DenySavingsPlansIfNotUsingBlocksRole
            Effect: Deny
            Action:
              - savingsplans:CreateSavingsPlan
              - savingsplans:DeleteQueuedSavingsPlan
              - savingsplans:ReturnSavingsPlan
              - savingsplans:TagResource
              - savingsplans:UntagResource
            Resource: "*"
            Condition:
              ArnNotLike:
                aws:PrincipalArn: arn:aws:iam::*:role/BlocksExecutionRole-{{BLOCKS_CUSTOMER_RESOURCE_ID}}

          # Deny if NOT in BlocksOptimization OU (regardless of role)
          - Sid: DenySavingsPlansIfNotInBlocksOU
            Effect: Deny
            Action:
              - savingsplans:CreateSavingsPlan
              - savingsplans:DeleteQueuedSavingsPlan
              - savingsplans:ReturnSavingsPlan
              - savingsplans:TagResource
              - savingsplans:UntagResource
            Resource: "*"
            Condition:
              ForAllValues:StringNotLike:
                aws:PrincipalOrgPaths:
                  - !Sub "o-*/r-*/${BlocksOptimizationOU}/*"
                  - !Sub "o-*/r-*/${BlocksOptimizationOU}/"
      TargetIds:
        - !GetAtt EnableOrgServices.OrganizationRootId
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud
        - Key: Purpose
          Value: SavingsPlansRestriction

  # Service Control Policy: Blocks Governance - Complete Lockdown
  # Denies ALL resource creation and IAM management for accounts in BlocksOptimization OU
  # BlocksExecutionRole, AWS service-linked roles, and BlocksPoolAccountTransferRole exempted
  # Creates frozen sandbox environment for Blocks-only operations
  BlocksGovernanceDenyPolicy:
    Type: AWS::Organizations::Policy
    Properties:
      Type: SERVICE_CONTROL_POLICY
      Name: BlocksGovernanceDenyPolicy-{{BLOCKS_CUSTOMER_RESOURCE_ID}}
      Description: "Complete account lockdown for BlocksOptimization OU. Only BlocksExecutionRole can create resources or manage IAM. AWS services and users are blocked. Managed by Blocks.cloud."
      Content:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyOrgAndAccountActions
            Effect: Deny
            Action:
              - organizations:LeaveOrganization
              - organizations:RemoveAccountFromOrganization
              - account:CloseAccount
              - account:EnableRegion
              - account:DisableRegion
              - iam:CreateUser
              - iam:CreateAccessKey
            Resource: "*"
            Condition:
              ArnNotLike:
                aws:PrincipalArn:
                  - !Sub "arn:${AWS::Partition}:iam::*:role/BlocksExecutionRole-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
                  - !Sub "arn:${AWS::Partition}:iam::*:role/aws-service-role/*"
                  - !Sub "arn:${AWS::Partition}:iam::*:role/BlocksPoolAccountTransferRole"

          - Sid: DenyResourceCreation
            Effect: Deny
            Action:
              - ec2:RunInstances
              - ec2:CreateVpc
              - ec2:CreateSubnet
              - ec2:CreateVolume
              - ec2:CreateSecurityGroup
              - lambda:CreateFunction
              - rds:CreateDBInstance
              - rds:CreateDBCluster
              - dynamodb:CreateTable
              - ecs:CreateCluster
              - eks:CreateCluster
              - cloudwatch:PutMetricAlarm
              - sns:CreateTopic
              - sqs:CreateQueue
            Resource: "*"
            Condition:
              ArnNotLike:
                aws:PrincipalArn:
                  - !Sub "arn:${AWS::Partition}:iam::*:role/BlocksExecutionRole-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"

          - Sid: DenyS3BucketCreationExceptCUR
            Effect: Deny
            Action:
              - s3:CreateBucket
            Resource: "*"
            Condition:
              ArnNotLike:
                aws:PrincipalArn:
                  - !Sub "arn:${AWS::Partition}:iam::*:role/BlocksExecutionRole-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
                aws:ResourceArn:
                  - "arn:aws:s3:::blocks-cur-data-*"

          - Sid: DenySecurityTampering
            Effect: Deny
            Action:
              - guardduty:DeleteDetector
              - config:DeleteConfigRule
              - config:StopConfigurationRecorder
              - cloudtrail:DeleteTrail
              - cloudtrail:StopLogging
              - cloudtrail:UpdateTrail
              - securityhub:DisableSecurityHub
            Resource: "*"
            Condition:
              ArnNotLike:
                aws:PrincipalArn:
                  - !Sub "arn:${AWS::Partition}:iam::*:role/BlocksExecutionRole-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      TargetIds:
        - !Ref BlocksOptimizationOU
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud
        - Key: Purpose
          Value: GovernanceControl

  SubAccountStackSet:
    Type: AWS::CloudFormation::StackSet
    DependsOn: BlocksSavingsPlansDenyPolicy
    Properties:
      StackSetName: "Blocks-CostOptimization-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      Description: "Deploys the Blocks IAM roles to all member accounts for organization-wide cost analysis and optimization. Must remain in place for Blocks to function correctly. Email support@blocks.cloud for assistance."
      PermissionModel: SERVICE_MANAGED
      AutoDeployment:
        Enabled: true
        RetainStacksOnAccountRemoval: false
      Capabilities:
        - CAPABILITY_NAMED_IAM
      TemplateURL: "{{SUBACCOUNTS_TEMPLATE_URL}}"
      Parameters:
        - ParameterKey: BlocksCustomerId
          ParameterValue: "{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
        - ParameterKey: BlocksAccountId
          ParameterValue: "{{BLOCKS_ACCOUNT_ID}}"
        - ParameterKey: ExternalId
          ParameterValue: "{{EXTERNAL_ID}}"
        - ParameterKey: BlocksEventBusArn
          ParameterValue: "arn:aws:events:eu-central-1:{{BLOCKS_ACCOUNT_ID}}:event-bus/blocks-customer-events"
      StackInstancesGroup:
        - DeploymentTargets:
            OrganizationalUnitIds:
              - !GetAtt EnableOrgServices.OrganizationRootId
          Regions:
            - us-east-1
      OperationPreferences:
        # 100% tolerance: attempt EVERY account rather than aborting on the first
        # failure. Accounts fail for reasons the customer cannot fix mid-deploy (an
        # SCP, a suspended account, an IAM name collision), and partial org coverage
        # beats none. Trade-off: this resource reaches CREATE_COMPLETE even when some
        # instances FAILED, so incomplete coverage has to be read from the StackSet's
        # per-instance results rather than from the stack status.
        FailureTolerancePercentage: 100
        MaxConcurrentPercentage: 100
        RegionConcurrencyType: PARALLEL
        ConcurrencyMode: SOFT_FAILURE_TOLERANCE
      Tags:
        - Key: TemplateVersion
          Value: !FindInMap [TemplateConfig, Constants, Version]
      CallAs: SELF


  # ==== BEGIN GENERATED IAM POLICIES ====
  # Source: iam-policies/policies/
  # DO NOT EDIT MANUALLY 

  # IAM Policy: Cost Optimization Write Permissions
  # Grants Blocks execution permissions for purchasing RIs/Savings Plans,
  # managing budgets, alarms, Cost Optimization Hub enrollment, and AWS Organizations management
  BlocksCostOptimizationWritePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: "Used by Blocks.cloud. Must remain in place for Blocks to function correctly. Email support@blocks.cloud for assistance. Grants execution permissions for cost optimization actions including purchasing Savings Plans, RIs, and managing accounts."
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Reserved Instance Purchases - Allows purchasing, modifying, and exchanging RIs
          # Services: EC2, RDS, ElastiCache, Redshift, OpenSearch, MemoryDB, DynamoDB, CloudFront, MediaConvert, MediaConnect, SageMaker
          - Sid: SavingsPlansAndRIsWrite
            Effect: Allow
            Action:
              - ec2:PurchaseReservedInstancesOffering
              - ec2:ModifyReservedInstances
              - ec2:AcceptReservedInstancesExchangeQuote
              - ec2:DeleteQueuedReservedInstances
              - ec2:PurchaseHostReservation
              - rds:PurchaseReservedDBInstancesOffering
              - elasticache:PurchaseReservedCacheNodesOffering
              - redshift:PurchaseReservedNodeOffering
              - redshift:AcceptReservedNodeExchange
              - es:PurchaseReservedInstanceOffering
              - memorydb:PurchaseReservedNodesOffering
              - dynamodb:PurchaseReservedCapacityOfferings
              - cloudfront:CreateSavingsPlan
              - ec2:PurchaseCapacityBlock
              - mediaconvert:CreateQueue
              - mediaconvert:UpdateQueue
              - mediaconnect:PurchaseOffering
              - sagemaker:CreateTrainingPlan
            Resource: "*"
          # Organization Management - Manage organization structure and service integrations
          # Services: Organizations
          - Sid: OrgManagementWrite
            Effect: Allow
            Action:
              - organizations:MoveAccount
              - organizations:TagResource
              - organizations:UntagResource
              - organizations:AcceptHandshake
              - organizations:EnableAWSServiceAccess
              - organizations:CreateOrganizationalUnit
              - organizations:ListRoots
              - organizations:ListOrganizationalUnitsForParent
              - organizations:ListParents
            Resource: "*"
          # Account Transfer - Required for commitment service to move accounts between organizations
          # Services: Organizations
          - Sid: AccountTransferOperations
            Effect: Allow
            Action:
              - organizations:InviteAccountToOrganization
              - organizations:DescribeHandshake
              - organizations:ListHandshakesForOrganization
              - organizations:CancelHandshake
              - organizations:DescribeOrganization
            Resource: "*"
          # Governance & Monitoring - Budgets, anomaly detection, and service quotas. ViewBudget and ModifyBudget authorize the full budget CRUD surface; the Budget Action APIs are intentionally not granted, since they can attach IAM policies or stop EC2/RDS instances when a threshold trips.
          # Services: Budgets, Cost Explorer, Billing, Account, Service Quotas, IAM
          - Sid: GovernanceWrite
            Effect: Allow
            Action:
              - budgets:ViewBudget
              - budgets:ModifyBudget
              - ce:CreateAnomalyMonitor
              - ce:CreateAnomalySubscription
              - ce:UpdateAnomalyMonitor
              - ce:UpdateAnomalySubscription
              - ce:StartCommitmentPurchaseAnalysis
              - ce:StartSavingsPlansPurchaseRecommendationGeneration
              - servicequotas:RequestServiceQuotaIncrease
              - servicequotas:GetServiceQuota
              - servicequotas:ListServiceQuotas
              - servicequotas:GetRequestedServiceQuotaChange
              - servicequotas:ListRequestedServiceQuotaChangeHistory
              - servicequotas:GetAWSDefaultServiceQuota
              - servicequotas:ListAWSDefaultServiceQuotas
              - iam:SimulatePrincipalPolicy
            Resource: "*"
          # Service Quotas - Create service-linked role for Service Quotas functionality
          # Services: IAM
          - Sid: ServiceQuotasServiceLinkedRole
            Effect: Allow
            Action:
              - iam:CreateServiceLinkedRole
            Resource: "arn:aws:iam::*:role/aws-service-role/servicequotas.amazonaws.com/*"
            Condition:
              StringEquals:
                "iam:AWSServiceName": "servicequotas.amazonaws.com"
          # Cost Allocation Tags - Activate tags and trigger backfill (management account only)
          # Services: Cost Explorer
          - Sid: CostAllocationTagsWrite
            Effect: Allow
            Action:
              - ce:UpdateCostAllocationTagsStatus
              - ce:ListCostAllocationTags
              - ce:StartCostAllocationTagBackfill
              - ce:ListCostAllocationTagBackfillHistory
            Resource: "*"
          # Data Exports - Create and manage BCM Data Exports (CUR 2.0)
          # Services: BCM Data Exports
          - Sid: DataExportsWrite
            Effect: Allow
            Action:
              - bcm-data-exports:*
              - cur:*
            Resource: "*"
          # SNS - Write access for Blocks-prefixed topics (anomaly detection subscriptions)
          # Services: SNS
          - Sid: SNSAnomalyDetectionSubscriptionsWrite
            Effect: Allow
            Action:
              - sns:*
            Resource: !Sub "arn:${AWS::Partition}:sns:*:${AWS::AccountId}:Blocks*"
          # CloudWatch Alarms - Create and manage Blocks-prefixed alarms only
          # Services: CloudWatch
          - Sid: CloudWatchWrite
            Effect: Allow
            Action:
              - cloudwatch:PutMetricAlarm
              - cloudwatch:DeleteAlarms
              - cloudwatch:EnableAlarmActions
              - cloudwatch:DisableAlarmActions
            Resource: !Sub "arn:${AWS::Partition}:cloudwatch:*:${AWS::AccountId}:alarm:Blocks-*"
          # EventBridge - Write access for Blocks-prefixed rules and event buses
          # Services: EventBridge
          - Sid: EventBridgeWrite
            Effect: Allow
            Action:
              - events:PutRule
              - events:PutTargets
              - events:DeleteRule
              - events:RemoveTargets
              - events:CreateEventBus
              - events:DeleteEventBus
              - events:PutEvents
            Resource:
              - !Sub "arn:${AWS::Partition}:events:*:*:rule/Blocks*"
              - !Sub "arn:${AWS::Partition}:events:*:*:event-bus/Blocks*"
          # Compute Optimizer - Full write access for optimization recommendations
          # Services: Compute Optimizer
          - Sid: ComputeOptimizerWrite
            Effect: Allow
            Action:
              - compute-optimizer:*
            Resource: "*"
          # Cost Optimization Hub - Create service-linked role for opt-in
          # Services: IAM, Cost Optimization Hub
          - Sid: CostOptimizationHubOptIn
            Effect: Allow
            Action:
              - iam:CreateServiceLinkedRole
            Resource: "arn:aws:iam::*:role/aws-service-role/cost-optimization-hub.bcm.amazonaws.com/AWSServiceRoleForCostOptimizationHub"
            Condition:
              StringLike:
                "iam:AWSServiceName": "cost-optimization-hub.bcm.amazonaws.com"
          # Cost Optimization Hub - Update service-linked role policy
          # Services: IAM
          - Sid: CostOptimizationHubPolicy
            Effect: Allow
            Action:
              - iam:PutRolePolicy
            Resource: "arn:aws:iam::*:role/aws-service-role/cost-optimization-hub.bcm.amazonaws.com/AWSServiceRoleForCostOptimizationHub"
          # Cost Optimization Hub - Update enrollment status
          # Services: Cost Optimization Hub
          - Sid: CostOptimizationHubUpdateStatus
            Effect: Allow
            Action:
              - cost-optimization-hub:UpdateEnrollmentStatus
            Resource: "*"
          # CUR Bucket Management - Create and configure CUR S3 bucket (management account only)
          # Services: S3
          - Sid: CURBucketManagement
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:PutBucketVersioning
              - s3:PutBucketPolicy
              - s3:DeleteBucketPolicy
              - s3:PutBucketPublicAccessBlock
              - s3:PutEncryptionConfiguration
              - s3:PutLifecycleConfiguration
              - s3:PutBucketOwnershipControls
            Resource: "arn:aws:s3:::blocks-cur-data-*"
          # CloudTrail org trail management - Create and manage organization CloudTrail trail for EventBridge event delivery; PutEventSelectors scopes the Blocks trail to management write events (BLO-3417)
          # Services: CloudTrail
          - Sid: CloudTrailOrgTrailManagement
            Effect: Allow
            Action:
              - cloudtrail:CreateTrail
              - cloudtrail:StartLogging
              - cloudtrail:UpdateTrail
              - cloudtrail:PutEventSelectors
            Resource: "*"
          # CloudTrail - Create service-linked role (AWSServiceRoleForCloudTrail) required when creating an organization trail
          # Services: IAM, CloudTrail
          - Sid: CloudTrailServiceLinkedRole
            Effect: Allow
            Action:
              - iam:CreateServiceLinkedRole
            Resource: "arn:aws:iam::*:role/aws-service-role/cloudtrail.amazonaws.com/AWSServiceRoleForCloudTrail"
            Condition:
              StringLike:
                "iam:AWSServiceName": "cloudtrail.amazonaws.com"

  # IAM Policy: Custom Read Permissions
