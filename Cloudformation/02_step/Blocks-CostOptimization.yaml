            Resource: "*"

  # ============================================================================
  # IAM Managed Policy: Data Protection Policy (Step 2 - Cost Optimization)
  # Explicit Deny Policy - Explicit IAM Deny Controls for Data Protection
  # ============================================================================
  # IAM evaluation: Explicit Deny > Allow > Implicit Deny (denies always win)
  # Coverage: secrets, communications, documents, databases, search, storage,
  # analytics, logs, identity, code, ML, instance access, and additional
  # sensitive operations.
  # Note: Step 2 allows CUR bucket access (blocks-cur-data-*/cur2/*).
  # ============================================================================
  BlocksDataProtectionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: "Comprehensive 11-tier data protection policy with 100+ explicit denies across secrets, communications, documents, databases, search data plane, storage, analytics, logs, identity, code, ML, and instance access. Provides explicit IAM deny controls ensuring Blocks cannot access customer sensitive data."
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # TIER 1: Secrets & Credentials
          - Sid: DenySecretsAndCredentials
            Effect: Deny
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:BatchGetSecretValue
              - secretsmanager:ListSecretVersionIds
              - secretsmanager:GetResourcePolicy
              - secretsmanager:DescribeSecret
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParameterHistory
              - ssm:GetParametersByPath
              - acm-pca:GetCertificate
              - acm-pca:GetCertificateAuthorityCertificate
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:ReEncrypt*
              - glue:GetConnection
              - glue:GetConnections
            Resource: "*"
          # TIER 2: Communications (Emails, Messages, SMS)
          - Sid: DenyCommunicationsData
            Effect: Deny
            Action:
              - workmail:*
              - ses:List*
              - ses:Get*
              - ses:Describe*
              - sesv2:List*
              - sesv2:Get*
              - pinpoint:Get*
              - pinpoint:List*
              - pinpoint-email:*
              - pinpoint-sms-voice:*
              - chime:GetMessage*
              - chime:GetConversation*
              - chime:ListMessages
              - connect:GetContactAttributes
              - connect:DescribeContact
              - connect:SearchContacts
              - connect:ListContactReferences
              - connect:ListContactEvaluations
              - connect:DescribeContactEvaluation
              - connect:ListRealtimeContactAnalysisSegments
              - connect:ListRealtimeContactAnalysisSegmentsV2
              - connect:GetFederationToken
              - sns:GetSMSAttributes
              - sns:ListPlatformApplications
              - sns:GetPlatformApplicationAttributes
              - sns:ListEndpointsByPlatformApplication
              - sns:GetEndpointAttributes
              - sns:ListPhoneNumbersOptedOut
              - sns:ListOriginationNumbers
              - sns:ListSMSSandboxPhoneNumbers
              - sns:GetSMSSandboxAccountStatus
              - sns:CheckIfPhoneNumberIsOptedOut
              - sns:ListSubscriptions
              - sns:ListSubscriptionsByTopic
              - sns:GetSubscriptionAttributes
            Resource: "*"
          # TIER 3: Documents & Collaboration
          - Sid: DenyDocumentsAccess
            Effect: Deny
            Action:
              - workdocs:GetDocument
              - workdocs:GetDocumentVersion
              - workspaces:DescribeWorkspacesConnectionStatus
              - workspaces:DescribeWorkspaceSnapshots
            Resource: "*"
          # TIER 4: Database Content
          - Sid: DenyDatabaseContentAccess
            Effect: Deny
            Action:
              - dynamodb:GetItem
              - dynamodb:BatchGetItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:GetRecords
              - dynamodb:GetShardIterator
              - rds:DownloadDBLogFilePortion
              - rds:DownloadCompleteDBLogFile
              - rds-data:ExecuteStatement
              - rds-data:BatchExecuteStatement
              - rds-data:ExecuteSql
              - rds-data:BeginTransaction
              - rds-data:CommitTransaction
              - rds-data:RollbackTransaction
              - redshift-data:ExecuteStatement
              - redshift-data:BatchExecuteStatement
              - redshift-data:GetStatementResult
              - redshift-data:GetStatementResultV2
              - redshift-data:DescribeStatement
              - redshift-data:ListStatements
            Resource: "*"
          # TIER 4: Search data plane - HTTP reads against OpenSearch/Elasticsearch domains return index documents. Not granted by any Blocks statement; inherited from AWS-managed ReadOnlyAccess, so an explicit Deny is the only way to close it. Cost analysis needs the control plane only (see statements/read/opensearch.json).
          # Services: Amazon OpenSearch Service, Amazon OpenSearch Serverless
          - Sid: DenyOpenSearchDataPlane
            Effect: Deny
            Action:
              - es:ESHttpGet
              - es:ESHttpHead
              - es:ESHttpPost
              - aoss:APIAccessAll
            Resource: "*"
          # TIER 5: Storage Content - S3 with CUR exception
          - Sid: DenyS3DataAccessExceptCURBucket
            Effect: Deny
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:GetObjectTorrent
            Resource: "*"
            Condition:
              ArnNotLike:
                "aws:ResourceArn": "arn:aws:s3:::blocks-cur-data-*/cur2/*"
          # TIER 5: File systems and backups. GetRecoveryPointRestoreMetadata is denied because it returns the metadata required to restore a recovery point, which can reveal the contents and layout of protected data; cost analysis reads backup plan and vault configuration instead.
          - Sid: DenyFileSystemAndBackupAccess
            Effect: Deny
            Action:
              - backup:GetRecoveryPointRestoreMetadata
            Resource: "*"
          # TIER 5: EBS direct APIs read the raw block contents of snapshots - i.e. the volume data itself, including anything on the root filesystem. Snapshot cost analysis reads ec2:DescribeSnapshots metadata (size, age, source volume) and never the blocks. ListSnapshotBlocks/ListChangedBlocks are denied alongside GetSnapshotBlock because they enumerate the block indices and tokens that GetSnapshotBlock consumes.
          # Services: EBS direct APIs
          - Sid: DenyEBSDirectSnapshotDataAccess
            Effect: Deny
            Action:
              - ebs:GetSnapshotBlock
              - ebs:ListSnapshotBlocks
              - ebs:ListChangedBlocks
            Resource: "*"
          # TIER 6: Analytics Query Results
          - Sid: DenyAnalyticsQueryResults
            Effect: Deny
            Action:
              - athena:GetQueryResults
              - athena:GetQueryResultsStream
              - glue:GetTable
              - glue:GetPartition
              - glue:GetPartitions
            Resource: "*"
          # TIER 7: Logs (with Container Insights exception)
          - Sid: DenyLogsQueryExceptContainerInsights
            Effect: Deny
            Action:
              - logs:StartQuery
              - logs:GetQueryResults
            Resource: "*"
            Condition:
              StringNotLike:
                "logs:LogGroupName": "/aws/containerinsights/*/performance"
          # Deny direct log access
          - Sid: DenyLogEventsAccess
            Effect: Deny
            Action:
              - logs:GetLogEvents
              - logs:FilterLogEvents
              - logs:GetLogRecord
              - logs:StartLiveTail
            Resource: "*"
          # TIER 8: User Directories & Identity
          - Sid: DenyUserDirectoryAccess
            Effect: Deny
            Action:
              - cognito-identity:*
              - cognito-idp:*
              - cognito-sync:*
              - ds:DescribeUsers
              - iam:GetSSHPublicKey
              - iam:GetServiceSpecificCredential
              - iam:GetLoginProfile
            Resource: "*"
          # TIER 9: Code & Artifacts - blocks retrieval of source code, container image layers, package assets, and Lambda function definitions. The Lambda actions cover both direct reads and listing, since ListFunctions and ListVersionsByFunction also return FunctionConfiguration with Environment.Variables. ecs:DescribeTaskDefinition is deliberately NOT denied: the ECS Fargate rightsizing detector reads the task-level cpu/memory from it. Denying it silently drops every ECS Fargate finding, so customers who keep plaintext secrets in containerDefinitions[].environment re-add it in their own deny layer instead.
          - Sid: DenyCodeAccess
            Effect: Deny
            Action:
              - codecommit:GetFile
              - codecommit:GetFolder
              - codecommit:GetBlob
              - codecommit:GitPull
              - codeartifact:GetPackageVersionAsset
              - codeartifact:ReadFromRepository
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
              - lambda:GetFunction
              - lambda:GetFunctionConfiguration
              - lambda:ListFunctions
              - lambda:ListVersionsByFunction
            Resource: "*"
          # TIER 10: Machine Learning Data
          - Sid: DenyMachineLearningData
            Effect: Deny
            Action:
              - sagemaker:DescribeModelPackage
              - sagemaker:DescribeTrainingJob
              - rekognition:DetectFaces
              - rekognition:SearchFaces*
              - comprehend:DetectPiiEntities
            Resource: "*"
          # TIER 11: Instance Access. DescribeInstanceAttribute (Attribute=userData) and GetLaunchTemplateData both return user-data, a common location for bootstrap secrets/credentials; cost/rightsizing reads the equivalent configuration via DescribeInstances and DescribeLaunchTemplateVersions instead. Console output, console screenshots and password data expose live instance state and Windows administrator credentials, none of which cost analysis needs.
          - Sid: DenyInstanceAccess
            Effect: Deny
            Action:
              - ec2:DescribeInstanceAttribute
              - ec2:GetConsoleOutput
              - ec2:GetConsoleScreenshot
              - ec2:GetPasswordData
              - ec2:GetLaunchTemplateData
            Resource: "*"
          # Additional sensitive operations
          - Sid: DenyOtherSensitiveOperations
            Effect: Deny
            Action:
              - sqs:ReceiveMessage
              - kinesis:GetRecords
              - apigateway:GET
              - states:GetExecutionHistory
              - states:DescribeExecution
            Resource: "*"

  # ==== END GENERATED IAM POLICIES ====

  # IAM Role: Blocks Execution Role (Management Account)
  # Cross-account role assumed by Blocks to execute cost optimization actions
  # Combines write policy with read-only policies
  BlocksExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "BlocksExecutionRole-{{BLOCKS_CUSTOMER_RESOURCE_ID}}"
      Description: "Used by Blocks.cloud to execute cost optimization actions. Must remain in place for Blocks to function correctly. Email support@blocks.cloud for assistance."
      MaxSessionDuration: 3600
      Tags:
        - Key: OwnedBy
          Value: Blocks.cloud
        - Key: Purpose
          Value: CostOptimization
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::{{BLOCKS_ACCOUNT_ID}}:role/BlocksCustomerAccessRole"
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                "sts:ExternalId": "{{EXTERNAL_ID}}"
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::{{BLOCKS_ACCOUNT_ID}}:role/BlocksCustomerAccessRole"
            Action:
              - sts:TagSession
      ManagedPolicyArns:
        # Write permissions for cost optimization actions
        - !Ref BlocksCostOptimizationWritePolicy
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSSavingsPlansFullAccess
        # Read permissions - using AWS managed policies for broad coverage
        - !Sub arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess
        # Additional AWS managed policies not covered by ReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSBillingReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSOrganizationsReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/SecurityAudit
        - !Ref BlocksDataProtectionPolicy
        - !Ref BlocksCustomReadPolicy

